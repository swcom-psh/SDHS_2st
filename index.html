<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2학기 야자 자리 배치 프로그램</title>

    <!-- Pretendard Font -->
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            /* 🌊 Premium Summer Ocean Color Theme (HSL based for rich harmony) */
            --primary: hsl(200, 95%, 40%);
            /* Rich sky ocean blue */
            --primary-dark: hsl(230, 85%, 15%);
            /* Midnight navy */
            --secondary: hsl(204, 100%, 96%);
            /* Ice drop blue */
            --accent-glow: hsla(200, 95%, 45%, 0.15);

            --bg-canvas: hsl(204, 100%, 96%);
            --card-bg: rgba(255, 255, 255, 0.65);
            /* Glassmorphism transparent white */

            --text-main: hsl(222, 47%, 11%);
            /* Clean dark slate */
            --text-sub: hsl(215, 25%, 27%);
            /* Slate 700 */
            --text-muted: hsl(215, 16%, 47%);
            /* Slate 500 */

            --border: rgba(255, 255, 255, 0.45);
            --border-hover: rgba(0, 119, 182, 0.35);
            --border-focus: hsl(200, 95%, 35%);

            --shadow-sm: 0 4px 12px rgba(3, 4, 94, 0.03);
            --shadow-md: 0 12px 36px rgba(3, 4, 94, 0.06);
            --shadow-lg: 0 20px 50px rgba(3, 4, 94, 0.1);

            --drag-over: rgba(224, 242, 254, 0.8);

            /* Table variables */
            --table-border: hsl(214, 32%, 91%);
            --table-header: hsl(210, 40%, 96.1%);
            --table-row-hover: hsl(204, 100%, 97%);

            /* Room Point Colors - modern palettes */
            --room-2-3: hsl(197, 92%, 44%);
            /* Deep Ocean */
            --room-2-4: hsl(38, 92%, 50%);
            /* Sand Gold */
            --room-2-5: hsl(22, 90%, 50%);
            /* Coral Sunset */
            --room-2-6: hsl(175, 80%, 38%);
            /* Emerald Mint */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Helvetica Neue", "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
            background: linear-gradient(135deg, hsl(204, 100%, 96%), hsl(200, 80%, 90%), hsl(190, 85%, 93%), hsl(204, 100%, 96%));
            background-size: 300% 300%;
            animation: oceanWaves 18s ease-in-out infinite;
            color: var(--text-main);
            line-height: 1.6;
            padding: 40px 20px;
            letter-spacing: -0.02em;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        @keyframes oceanWaves {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        header {
            max-width: 1300px;
            margin: 0 auto 40px;
            text-align: center;
            padding: 45px 40px;
            background: var(--card-bg);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border-radius: 32px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
            color: var(--text-main);
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 850;
            color: var(--primary);
            margin-bottom: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            letter-spacing: -0.05em;
            text-shadow: 0 2px 4px rgba(0, 119, 182, 0.05);
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 24px;
            align-items: center;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        #dayButtons,
        #periodButtons {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 6px;
            border-radius: 50px;
            display: flex;
            gap: 4px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.02);
        }

        /* Turn day/period buttons into segment toggles */
        #dayButtons .day-btn,
        #periodButtons .day-btn {
            background: transparent;
            color: var(--text-sub);
            border: none;
            box-shadow: none;
            padding: 10px 24px;
            border-radius: 50px;
            font-weight: 600;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #dayButtons .day-btn:hover,
        #periodButtons .day-btn:hover {
            color: var(--primary);
            border-color: transparent;
        }

        #dayButtons .day-btn.active,
        #periodButtons .day-btn.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 14px rgba(0, 119, 182, 0.25);
            font-weight: 800;
            border: none;
        }

        .btn {
            padding: 11px 20px;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.18s ease, color 0.18s ease, border-color 0.18s ease;
            border: 1px solid rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.6);
            color: var(--text-sub);
            font-size: 0.93rem;
            box-shadow: var(--shadow-sm);
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.9);
            color: var(--primary-dark);
            border-color: var(--primary);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            box-shadow: 0 4px 12px rgba(0, 119, 182, 0.2);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, var(--primary-dark) 0%, #02022e 100%);
            color: white;
            box-shadow: 0 6px 16px rgba(3, 4, 94, 0.3);
        }

        .btn-danger {
            background: #FFF5F5;
            color: #E07070;
            border: 1px solid #F5D0D0;
        }

        .btn-danger:hover {
            background: #FFE8E8;
            color: #C05050;
        }

        /* Layout Grid */
        .seating-container {
            max-width: 1300px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 50px;
        }

        .classroom-section {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 36px 40px;
            border-radius: 28px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            transition: box-shadow 0.25s ease;
        }

        .classroom-section:hover {
            box-shadow: var(--shadow-md);
        }

        .grid-6x5 {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 40px minmax(0, 1fr) minmax(0, 1fr) 40px minmax(0, 1fr) minmax(0, 1fr);
            row-gap: 14px;
            margin: 28px 0;
        }

        /* 모바일 대응 미디어 쿼리 */
        @media (max-width: 768px) {
            .classroom-section {
                padding: 20px 15px;
                border-radius: 20px;
            }

            .grid-6x5 {
                grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 15px minmax(0, 1fr) minmax(0, 1fr) 15px minmax(0, 1fr) minmax(0, 1fr);
                row-gap: 8px;
            }

            .seat {
                border-radius: 12px;
                font-size: 0.75rem;
                min-width: 0;
                overflow: hidden;
            }

            .student-id {
                font-size: 0.6rem;
            }

            .student-name {
                font-size: 0.85rem;
                font-weight: 700;
            }

            .room-title {
                font-size: 1.5rem !important;
            }

            .header-left {
                width: 100%;
                margin-bottom: 5px;
            }
        }

        @media (max-width: 480px) {
            .grid-6x5 {
                grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 8px minmax(0, 1fr) minmax(0, 1fr) 8px minmax(0, 1fr) minmax(0, 1fr);
                row-gap: 6px;
            }

            .seat {
                border-radius: 8px;
                min-width: 0;
                overflow: hidden;
            }
        }

        .seat {
            aspect-ratio: 1 / 1.15;
            border: 1.5px solid rgba(0, 119, 182, 0.12);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(255, 255, 255, 0.88);
            font-size: 0.85rem;
            position: relative;
            cursor: pointer;
            transition: background-color 0.18s ease, border-color 0.18s ease;
            user-select: none;
            touch-action: manipulation;
            min-width: 0;
            overflow: hidden;
        }

        .seat:not(.empty):hover {
            box-shadow: 0 12px 28px rgba(3, 4, 94, 0.08);
            border-color: var(--primary);
            z-index: 10;
        }

        .seat.empty {
            border: 1.5px dashed hsl(38, 92%, 60%);
            background: rgba(254, 250, 224, 0.45);
            box-shadow: inset 0 2px 4px rgba(233, 196, 106, 0.03);
            cursor: default;
            opacity: 0.8;
        }

        .seat.present {
            border: 2px solid var(--primary);
            background: linear-gradient(135deg, hsl(204, 100%, 96%) 0%, hsl(200, 95%, 90%) 100%);
            box-shadow: 0 4px 12px rgba(0, 119, 182, 0.12), inset 0 1px 2px rgba(255, 255, 255, 0.8);
            color: var(--primary-dark);
            font-weight: 800;
        }

        .seat.present::after {
            display: none;
        }

        .seat.not-in-period {
            background: hsl(210, 40%, 96.1%) !important;
            border: 1px dashed hsl(214, 32%, 91%) !important;
            opacity: 0.35;
            cursor: not-allowed;
            pointer-events: none;
        }

        .seat.not-in-period .student-name {
            color: hsl(215, 16%, 65%);
        }

        .seat.not-in-period::after {
            content: 'N/A';
            position: absolute;
            top: 6px;
            right: 10px;
            font-size: 0.65rem;
            font-weight: 700;
            color: hsl(215, 16%, 65%);
        }

        .seat.drag-over {
            background: var(--secondary);
            border-color: var(--primary);
            border-style: solid;
            transform: scale(1.05);
            box-shadow: 0 8px 24px rgba(0, 119, 182, 0.15);
        }

        .teacher-desk {
            width: 50%;
            height: 48px;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 16px;
            margin: 24px auto 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-dark);
            font-weight: 850;
            letter-spacing: 0.65em;
            font-size: 1.15rem;
            box-shadow: var(--shadow-sm);
            position: relative;
            transition: all 0.25s ease;
        }

        .teacher-desk::before {
            content: '⛱️';
            margin-right: 12px;
            font-size: 1.25rem;
            letter-spacing: normal;
        }

        /* 좌석 칸 왼쪽 위 자리 번호 */
        .seat-no {
            position: absolute;
            top: 6px;
            left: 9px;
            font-size: 0.7rem;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -0.02em;
            color: hsl(215, 14%, 60%);
            pointer-events: none;
            z-index: 4;
        }

        .seat.present .seat-no {
            color: var(--primary);
        }

        .seat.empty .seat-no {
            color: hsl(38, 55%, 52%);
        }

        .seat.not-in-period .seat-no {
            color: hsl(215, 16%, 72%);
        }

        /* 좁은 화면: 번호를 작게 줄이고, 칸 위쪽에 번호 자리를 비워
           학번·이름과 겹치지 않게 한다. (기본 규칙 뒤에 와야 적용됨) */
        @media (max-width: 768px) {
            .seat-no {
                top: 3px;
                left: 5px;
                font-size: 0.6rem;
            }

            .seat {
                padding-top: 11px;
            }
        }

        @media (max-width: 480px) {
            .seat-no {
                top: 2px;
                left: 4px;
                font-size: 0.55rem;
            }

            .seat {
                padding-top: 9px;
            }
        }

        .student-id {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 3px;
            pointer-events: none;
        }

        .student-name {
            font-weight: 850;
            font-size: 1.2rem;
            color: var(--text-main);
            pointer-events: none;
            letter-spacing: -0.05em;
        }

        /* 긴 이름 크기.
           넓은 화면은 칸이 넉넉하므로 4글자도 줄이지 않는다.
           (칸 177px / 4글자 이름 74px) */
        .student-name.len4 { font-size: 1.2rem; letter-spacing: -0.06em; }
        .student-name.len5 { font-size: 1.05rem; letter-spacing: -0.07em; }
        .student-name.len6 { font-size: 0.9rem; letter-spacing: -0.08em; }

        /* 태블릿~작은 노트북: 칸이 68px 이상이라 4글자도 줄이지 않는다 */
        @media (max-width: 768px) {
            .student-name.len4 { font-size: 0.82rem; letter-spacing: -0.07em; }
            .student-name.len5 { font-size: 0.7rem; }
            .student-name.len6 { font-size: 0.58rem; }
        }

        /* 휴대폰: 칸이 40~49px 이라 4글자는 줄여야 들어간다 */
        @media (max-width: 480px) {
            .student-name.len4 { font-size: 0.68rem; letter-spacing: -0.08em; }
            .student-name.len5 { font-size: 0.52rem; }
            .student-name.len6 { font-size: 0.43rem; }
        }

        /* Toast notification */
        #toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--primary-dark);
            color: white;
            padding: 14px 24px;
            border-radius: 12px;
            font-weight: 700;
            box-shadow: var(--shadow-lg);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10000;
            display: flex;
            align-items: center;
            gap: 12px;
            width: fit-content;
            max-width: 90vw;
            white-space: normal;
            word-break: keep-all;
            text-align: center;
            pointer-events: none;
            user-select: none;
        }

        #toast.show {
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 600px) {
            #toast {
                padding: 12px 20px;
                bottom: 30px;
                font-size: 0.9rem;
            }
        }

        .spacer {
            pointer-events: none;
        }

        /* Info text */
        .info-text {
            font-size: 0.88rem;
            color: var(--text-sub);
            background: rgba(224, 242, 254, 0.6);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            padding: 10px 20px;
            border-radius: 50px;
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(255, 255, 255, 0.4);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .info-text {
            flex-wrap: wrap;
            width: 100%;
            justify-content: space-between;
        }

        .info-tips {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .info-tips .tip-text {
            word-break: keep-all;
            overflow-wrap: break-word;
        }

        .btn-mini {
            padding: 4px 12px !important;
            font-size: 0.8rem !important;
            height: 28px;
            line-height: 1;
            flex: 0 0 auto !important;
            min-width: 0 !important;
            white-space: nowrap;
        }

        .info-user {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-left: auto;
            font-weight: 700;
            color: var(--primary);
            white-space: nowrap;
        }

        .btn-logout {
            background: white;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 0.8rem;
            cursor: pointer;
            color: var(--text-main);
            font-weight: 600;
            box-shadow: var(--shadow-sm);
            transition: all 0.2s;
            white-space: nowrap;
            flex: 0 0 auto;
        }

        /* Attendance List */
        .attendance-container {
            max-width: 1000px;
            margin: 0 auto;
            display: none;
            flex-direction: column;
            gap: 36px;
        }

        .attendance-section {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 32px;
            border-radius: 28px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
        }

        .attendance-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin-top: 16px;
            font-size: 0.95rem;
        }

        .attendance-table th,
        .attendance-table td {
            padding: 14px 16px;
            text-align: center;
            border-bottom: 1px solid var(--table-border);
        }

        .attendance-table th {
            background-color: var(--table-header);
            font-weight: 700;
            color: var(--text-sub);
        }

        .attendance-table tr:last-child td {
            border-bottom: none;
        }

        .attendance-table tr:hover td {
            background-color: var(--table-row-hover);
        }

        .attendance-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: var(--primary);
        }

        .col-num {
            width: 50px;
        }

        .col-id {
            width: 90px;
        }

        .col-name {
            width: 80px;
        }

        .col-check {
            width: 100px;
            white-space: nowrap;
        }

        .col-remark {
            width: auto;
        }

        .attendance-remark {
            width: 100%;
            padding: 10px 12px;
            border: 1.5px solid var(--border);
            border-radius: 20px;
            font-size: 0.95rem;
            transition: all 0.2s;
            background: #FFFBF8;
            color: var(--text-main);
        }

        .attendance-remark:focus {
            border-color: var(--primary);
            background: white;
            outline: none;
            box-shadow: 0 0 0 3px rgba(17, 138, 142, 0.15);
        }

        .view-toggle {
            display: flex;
            gap: 4px;
            margin-bottom: 20px;
            background: var(--primary);
            padding: 6px;
            border-radius: 50px;
            border: none;
            box-shadow: inset 0 2px 6px rgba(11, 110, 113, 0.2);
        }

        .toggle-btn {
            padding: 10px 24px;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            background: transparent;
            color: rgba(255, 255, 255, 0.85);
            transition: all 0.2s;
        }

        .toggle-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: white;
            transform: none;
        }

        .toggle-btn.active {
            background: white;
            color: var(--primary-dark);
            box-shadow: 0 2px 8px rgba(11, 110, 113, 0.3);
            font-weight: 800;
        }

        .gas-config {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 600px;
        }

        .gas-config input {
            flex: 1;
            padding: 8px 16px;
            border-radius: 20px;
            border: 1.5px solid var(--border);
            font-size: 0.9rem;
            background: #FFFBF8;
        }

        .btn-save-sheet {
            margin-top: 20px;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, hsl(175, 80%, 40%) 0%, hsl(175, 80%, 32%) 100%);
            color: white;
            border: none;
            border-radius: 50px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.28s ease;
            box-shadow: 0 4px 14px rgba(93, 196, 170, 0.2);
        }

        .btn-save-sheet:hover {
            filter: brightness(1.08);
            box-shadow: 0 6px 20px rgba(93, 196, 170, 0.35);
        }

        .btn-save-sheet:disabled {
            background: hsl(210, 16%, 82%);
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .classroom-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            gap: 12px;
            flex-wrap: wrap;
        }

        .header-right-btns {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .header-right-btns .btn {
            padding: 6px 12px;
            font-size: 0.85rem;
            white-space: nowrap;
            min-width: auto;
        }

        .btn-past-memo {
            background: #F59E0B !important;
            color: white !important;
            border: none !important;
        }

        .btn-refresh {
            background: var(--card-bg) !important;
            border: 1px solid var(--border) !important;
        }

        .btn-submit {
            background: var(--primary) !important;
            color: white !important;
            border: none !important;
        }

        .header-left {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .room-title {
            font-size: 2.1rem;
            font-weight: 900;
            color: var(--text-main);
            letter-spacing: -0.04em;
            line-height: 1.1;
        }

        .room-notice {
            font-size: 0.82rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .room-period {
            display: inline-block;
            margin-left: 10px;
            padding: 3px 11px;
            border-radius: 999px;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            vertical-align: 0.18em;
            background: var(--room-accent, var(--primary));

        /* Floating Bubbles Animation */
        .bubble-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }

        .bubble {
            position: absolute;
            bottom: -50px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.25);
            pointer-events: none;
            animation: rise linear infinite;
        }

        @keyframes rise {
            0% {
                transform: translateY(0) translateX(0);
                opacity: 0;
            }

            10% {
                opacity: 0.6;
            }

            90% {
                opacity: 0.6;
            }

            100% {
                transform: translateY(-110vh) translateX(100px);
                opacity: 0;
            }
        }

            min-width: 36px;
            box-shadow: 0 2px 6px rgba(17, 138, 142, 0.25);

        .seat-chip.period-1 {

        .seat-chip.period-2 {

        .seat-chip-wrap {

        .seat-empty-cell {

        }

        .card-print-btn {

        /* 일괄 인쇄용 숨긴 컨테이너 */
        #printAllContainer {
            display: none;

        /* 인쇄 스타일 — 개인 자리표 전용 */
        @media print {

            html,
            body {
                height: auto !important;
                overflow: visible !important;
            }

            body.printing-personal-cards #mainApp {
                display: none !important;

            body.printing-personal-cards #printAllContainer * {

            body.printing-personal-cards #printAllContainer {
                display: block !important;
                position: relative;
                width: 100%;
                background: white;
                margin: 0;
                padding: 0;

            @page {
                size: A4;
                margin: 10mm;
            }

            body.printing-personal-cards .print-card-page {
                break-inside: avoid-page;
                break-after: page;
                width: fit-content;
                /* 내부 표에 맞춰 너비 조정 */
                height: auto;
                margin: 0 auto;
                border: none;
                /* 외부 테두리는 표의 검정 테두리로 대체 */
                border-radius: 0;
                font-family: 'Pretendard', sans-serif;
                background: white;
                box-sizing: border-box;
                display: flex;
                flex-direction: column;
                overflow: visible;
            }

            body.printing-personal-cards .print-card-header {
                background: #118A8E !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                color: white !important;
                padding: 10px 18px;
                display: flex;
                justify-content: space-between;
                align-items: center;

            body.printing-personal-cards .print-card-subtitle {

            body.printing-personal-cards .print-seat-table {

            body.printing-personal-cards .print-seat-table th,
            body.printing-personal-cards .print-seat-table td {
                border: 3px solid #000;
                padding: 0;
                text-align: center;
                font-weight: 900;
                font-size: 38px;
                /* 45px -> 38px로 축소 */
                width: 32mm;
                /* 38mm -> 32mm로 축소 */
                height: 32mm;
                /* 38mm -> 32mm로 축소 */

                box-sizing: border-box;
                line-height: 1;
            }

            body.printing-personal-cards .print-seat-table th {
                background: #f0f9f9 !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                font-weight: 900;
                color: #036;
                font-size: 36px;
                /* 요일이 짤리지 않게 약간 작게 조정 */
                white-space: nowrap;
            }

            body.printing-personal-cards .print-seat-table .room-col {
                background: #f0f9f9 !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                font-weight: 950;
                color: #118A8E;
                font-size: 22px;
                /* 한 줄에 들어오도록 조정 */

            body.printing-personal-cards .print-seat-num {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 92%;
                height: 92%;
                margin: 0 auto;
                background: #118A8E !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                color: white !important;
                border-radius: 6px;
                font-weight: 950;
                font-size: 44px;
                /* 50px -> 44px로 축소 */
            }

            body.printing-personal-cards .print-seat-num.p2 {

            }

            body.printing-personal-cards .print-card-footer {
                padding: 8px 16px;
                font-size: 9px;
                color: #888;
                text-align: center;
                border-top: 1px solid #eee;
            }
        }

        /* ====== Memo (Long Press) Feature ====== */
        #memoModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(29, 45, 46, 0.6);
            backdrop-filter: blur(5px);
            z-index: 25000;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            padding-top: 15vh;

        }

        @keyframes modalSlideDown {
            from {

            }

                opacity: 1;
                transform: translateY(0);
            }
        }

        .memo-modal-content {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            padding: 28px 24px;
            border-radius: 24px;
            max-width: 380px;
            width: 100%;
            box-shadow: var(--shadow-lg);
            animation: modalSlideDown 0.3s ease-out;
        }

        .memo-modal-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .memo-modal-header .memo-icon {
            font-size: 1.5rem;
        }

        .memo-modal-header .memo-title {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.03em;
        }

        .memo-student-info {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
            padding: 10px 14px;
            background: var(--secondary);
            border-radius: 14px;

        .memo-student-info .memo-student-name {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--primary-dark);
        }

        .memo-student-info .memo-student-id {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .memo-textarea {
            width: 100%;
            min-height: 100px;
            padding: 14px 16px;
            border: 1px solid var(--border);
            border-radius: 16px;
            font-size: 1rem;
            font-family: inherit;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s, background-color 0.2s;
            background: rgba(255, 255, 255, 0.5);
            color: var(--text-main);
            line-height: 1.5;
        }

        .memo-textarea:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.8);
        }

        .memo-textarea::placeholder {
            color: var(--text-muted);
        }

        .memo-modal-btns {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        .memo-modal-btns button {
            flex: 1;
            padding: 12px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            font-family: inherit;
        }

        .memo-btn-save {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(17, 138, 142, 0.3);
        }

        .memo-btn-save:hover {
            background: var(--primary-dark);
        }

        .memo-btn-cancel {
            background: var(--secondary);
            color: var(--primary);
        }

        .memo-btn-cancel:hover {
            background: #D1E5E6;
        }

        .memo-btn-clear {
            background: #FFF5F5;
            color: #E07070;
            flex: 0.6;
        }

        .memo-btn-clear:hover {
            background: #FFE8E8;
            color: #C05050;
        }

        /* Student memo text under name */
        .student-memo {
            color: #E63946;
            /* Vibrant Red */
            font-weight: 600;
            margin-top: 4px;
            width: 90%;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.2;
        }

        .seat {
            -webkit-touch-callout: none;
            user-select: none;
            -webkit-user-select: none;
        }

        @media (max-width: 768px) {
            #memoModal {
                align-items: flex-start;
                padding-top: 40px;
                /* 키보드가 올라와도 고정된 위치 유지 */
            }

            .memo-modal-content {
                max-width: 340px;
                padding: 24px 20px;
            }

            .memo-textarea {
                min-height: 80px;
                font-size: 16px;
            }
        }

        @media print {

            .seat-memo-badge,
            #memoModal {
                display: none !important;
            }
        }

        .is-exporting-pdf .seat-memo-badge {
            display: none !important;
        }

        /* 🔄 Background Sync Floating Container & Cards */
        #sync-status-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }

        .sync-toast {
            pointer-events: auto;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            padding: 12px 18px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 250px;
            transform: translateY(20px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .sync-toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .sync-toast.fade-out {
            transform: translateY(-20px);
            opacity: 0;
        }

        .sync-toast .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid var(--border);
            border-top: 2px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .sync-toast .icon-success {
            color: #10B981;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .sync-toast .icon-error {
            color: #EF4444;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .sync-toast .text {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-main);
        }

        /* 💾 Temporary Success Button style */
        .btn-success-temp {
            background: #10B981 !important;
            color: white !important;
            border-color: #10B981 !important;
        }

        /* =====================================================
           📱 모바일 최적화 (2학기)
           - 대부분 휴대폰으로 사용하므로 이 블록이 최종 기준
           ===================================================== */
        @media (max-width: 768px) {

            /* 한글이 단어 중간에서 끊기지 않게 (예: "로그인" -> "로그/인" 방지) */
            h1, h2, h3, p, span, div, button, td, th, label {
                word-break: keep-all;
                overflow-wrap: break-word;
            }

            /* ---- 로그인 화면 ---- */
            .login-overlay {
                padding: 20px;
            }

            .login-box {
                padding: 28px 20px;
                width: 100%;
                max-width: 360px;
            }

            .login-box h2 {
                font-size: 1.3rem;
                line-height: 1.45;
                margin-bottom: 12px;
                word-break: keep-all;
            }

            .login-box input,
            .login-box button {
                padding: 14px;
                font-size: 1rem;
            }

            /* ---- 헤더 제목 ---- */
            h1 {
                font-size: 1.25rem;
                line-height: 1.4;
            }

            h1 small {
                display: block;
                margin-top: 6px;
            }

            /* ---- 요일 / 교시 버튼: 한 줄에 고르게 ---- */
            #dayButtons {
                display: grid;
                grid-template-columns: repeat(5, minmax(0, 1fr));
                gap: 5px;
                width: 100%;
            }

            #periodButtons {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 6px;
                width: 100%;
            }

            #dayButtons .btn,
            #periodButtons .btn {
                flex: none;
                min-width: 0;
                padding: 11px 2px;
                font-size: 0.88rem;
                white-space: nowrap;
            }

            /* ---- 상단 안내 바 ---- */
            .info-text {
                flex-direction: column;
                align-items: stretch !important;
                gap: 10px;
                padding: 12px 14px;
                border-radius: 14px;
                font-size: 0.82rem;
                line-height: 1.5;
            }

            .info-tips {
                flex-wrap: wrap;
                gap: 8px;
                align-items: flex-start;
            }

            .info-tips .tip-icon {
                flex: 0 0 auto;
            }

            .info-tips .tip-text {
                flex: 1 1 200px;
                min-width: 0;
            }

            .btn-mini {
                width: 100%;
                height: 34px;
                font-size: 0.85rem !important;
            }

            .info-user {
                margin-left: 0;
                justify-content: space-between;
                width: 100%;
            }

            /* ---- 교실 카드 헤더 ---- */
            .classroom-header {
                gap: 10px;
            }

            .room-title {
                font-size: 1.3rem;
            }

            .header-right-btns {
                flex-wrap: wrap;
                width: 100%;
            }

            .header-right-btns .btn {
                flex: 1 1 45%;
                min-width: 0;
                white-space: nowrap;
            }

            .room-meta {
                flex: 1 1 100%;
                text-align: center;
            }

            /* ---- 좌석 ---- */
            .seat {
                padding: 2px;
            }

            .student-name {
                font-size: 0.82rem;
                line-height: 1.15;
                white-space: nowrap;
                max-width: 100%;
            }

            .student-id {
                font-size: 0.62rem;
                line-height: 1.1;
            }

            .student-memo {
                line-height: 1.1;
                max-width: 100%;
                overflow: hidden;
            }

            /* ---- 모달 ---- */
            .modal-content,
            .memo-modal-content {
                width: calc(100% - 32px);
                max-width: 380px;
                padding: 22px 18px;
                box-sizing: border-box;
            }

            .modal-message {
                font-size: 0.95rem;
                line-height: 1.6;
            }

            .modal-btn,
            .memo-btn-cancel,
            .memo-btn-clear,
            .memo-btn-save {
                flex: 1;
                padding: 12px 8px;
                font-size: 0.95rem;
            }

            .memo-textarea {
                font-size: 16px;
                /* iOS 자동 확대 방지 */
            }

            /* ---- 동기화 토스트 ---- */
            .sync-toast {
                max-width: calc(100vw - 24px);
            }

            .sync-toast .text {
                font-size: 0.82rem;
                word-break: keep-all;
            }

            /* 요일 버튼: 좁으면 '요일' 떼고 한 글자만 */
            .d-suffix {
                display: none;
            }

            #dayButtons .btn {
                font-size: 1.02rem;
                letter-spacing: 0;
                padding: 12px 0;
            }

            /* 손가락으로 누르는 버튼은 최소 44px */
            .controls .btn,
            .header-right-btns .btn,
            .btn-mini,
            .btn-logout,
            #periodButtons .btn,
            .modal-btn,
            .memo-btn-cancel,
            .memo-btn-clear,
            .memo-btn-save {
                min-height: 44px;
            }

            .btn-mini {
                height: 44px !important;
            }

            .btn-logout {
                padding: 10px 16px;
            }

            /* 교실 이름 옆 교시 배지 */
            .room-period {
                margin-left: 8px;
                padding: 3px 10px;
                font-size: 0.86rem;
                vertical-align: 0.2em;
            }
        }

        /* 아주 좁은 화면 (아이폰 SE 등) */
        @media (max-width: 380px) {
            h1 {
                font-size: 1.12rem;
            }

            .login-box h2 {
                font-size: 1.18rem;
            }

            #dayButtons .btn,
            #periodButtons .btn {
                font-size: 0.8rem;
                padding: 10px 0;
            }

            .room-title {
                font-size: 1.15rem;
            }

            .room-period {
                font-size: 0.8rem;
                padding: 2px 8px;
                margin-left: 6px;
            }

            .pm-full {
                display: none;
            }

            .student-name {
                font-size: 0.75rem;
            }

            .student-id {
                font-size: 0.58rem;
            }

            .grid-6x5 {
                gap: 3px;
            }
        }

        /* ── 성능 보정 ─────────────────────────────────────────────
         * backdrop-filter(유리 블러)는 스크롤할 때마다 뒤 배경을 다시
         * 읽어 흐리므로 휴대폰에서 가장 비싼 효과다. 항상 떠 있는
         * 요소에서는 걷어내고, 잠깐만 뜨는 모달·토스트에는 남겨 둔다.
         * ------------------------------------------------------- */
        /* 휴대폰에서는 토스트를 위쪽에 띄운다.
           브라우저 주소창이 화면 아래에 있는 경우(삼성 인터넷 등)
           bottom 기준으로 띄우면 그 아래에 깔려 잘린다. */
        @media (max-width: 768px) {
            #toast {
                bottom: auto;
                top: calc(12px + env(safe-area-inset-top, 0px));
                transform: translateX(-50%) translateY(-180px);
                width: auto;
                min-width: min(320px, 92vw);
                max-width: 92vw;
                text-align: left;
                line-height: 1.45;
            }

            #toast.show {
                transform: translateX(-50%) translateY(0);
            }
        }

        @media (max-width: 900px) {
            header,
            #periodButtons,
            #dayButtons,
            .btn-group,
            .classroom-section,
            .teacher-desk,
            .info-text,
            .attendance-section {
                backdrop-filter: none;
                -webkit-backdrop-filter: none;
            }

            /* 좌석 90칸에 걸린 그림자는 그리기 비용이 큰 데 비해
               테두리만으로도 충분히 구분된다 */
            .seat,
            .seat.present,
            .seat.empty {
                box-shadow: none;
            }

            /* 배경 물결: background-position 을 계속 옮기면 화면 전체를
               매 프레임 다시 그린다. 휴대폰에서는 정지 그라데이션으로 */
            body {
                animation: none;
                background-size: 100% 100%;
                background-attachment: fixed;
            }

            /* 떠다니는 거품 20개도 쉬지 않고 합성 비용을 쓴다 */
            .bubble-container {
                display: none;
            }
        }

        /* 사용자가 기기에서 '동작 줄이기'를 켠 경우 존중 */
        @media (prefers-reduced-motion: reduce) {
            body {
                animation: none;
                background-size: 100% 100%;
            }

            .bubble-container {
                display: none;
            }

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

    <div id="memoModal" onclick="if(event.target===this) closeMemoModal()">
        <div class="memo-modal-content">

                    value="https://script.google.com/macros/s/AKfycby4opXfNbOGVjC0rnBPg2XoiJiDllGbnrabI-DZ7kqc7qi0IqxNI2mB-lqlIo6APWTM/exec">

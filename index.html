    <div id="loadingOverlay">
        <div class="loader"></div>
        <div id="loadingText">출석 정보를 동기화하고 있습니다...</div>
    </div>

    <script>
        let supervisorName = sessionStorage.getItem('yajaSupervisor2') || '';
        let allowedTeachers = []; // 구글 시트에서 받아올 동적 명단 (v20)
        let teacherListPromise = null;
        let studentListPromise = null;

        function showLoading(type = 'init', text) {
            const overlay = document.getElementById('loadingOverlay');
            if (!overlay) return;

            if (text) {
                document.getElementById('loadingText').innerText = text;
            } else {
                const messages = type === 'upload' ? uploadLoadingMessages : initLoadingMessages;
                const randomMsg = messages[Math.floor(Math.random() * messages.length)];
                document.getElementById('loadingText').innerText = randomMsg;
            }
            overlay.style.display = 'flex';
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').style.display = 'none';
        }

        function cleanupOldCache() {
            const todayStr = getTodayDateString();
            const keysToRemove = [];
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && (key.startsWith('att_') || key.startsWith('rem_') || key.startsWith('sup_') || key.startsWith('synced_') || key.startsWith('initial_att_') || key.startsWith('initial_rem_'))) {
                    if (!key.includes(todayStr)) {
                        keysToRemove.push(key);
                    }
                }
            }
            keysToRemove.forEach(k => localStorage.removeItem(k));
        }

        function loadGlobalDataFromCache() {
            const cached = localStorage.getItem('yajaStudentList2');
            if (cached) {
                try {
                    globalData = JSON.parse(cached);
                    if (Array.isArray(globalData) && globalData.length > 0) return true;
                } catch (e) {
                    localStorage.removeItem('yajaStudentList2');
                }
            }
            return false;
        }

        function loadTeacherListFromCache() {
            const cached = localStorage.getItem('yajaTeacherList2');
            if (cached) {
                try {
                    allowedTeachers = JSON.parse(cached);
                    if (Array.isArray(allowedTeachers) && allowedTeachers.length > 0) return true;
                } catch (e) {
                    localStorage.removeItem('yajaTeacherList2');
                }
            }
            return false;
        }

        async function revalidateDataInBackground() {
            try {
                await Promise.all([fetchTeacherList(), fetchGlobalData(true)]);
                if (supervisorName && document.getElementById('mainApp').style.display === 'block') {
                    renderSeating();
                }
            } catch (e) {
                console.error("백그라운드 동기화 실패:", e);
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            cleanupOldCache();
            const hasStudents = loadGlobalDataFromCache();
            loadTeacherListFromCache();
            SyncManager.init();
            createBubbles();

            if (supervisorName) {
                if (hasStudents) {
                    await startAppSession(supervisorName);
                } else {
                    showLoading('init', "학생 명단을 불러오는 중...");
                    await fetchGlobalData(true);
                    await startAppSession(supervisorName);
                }
            } else {
                hideLoading();
            }

            revalidateDataInBackground();
        });

        async function startAppSession(name) {
            supervisorName = name;
            sessionStorage.setItem('yajaSupervisor2', supervisorName);
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            document.getElementById('displaySupervisorName').innerText = supervisorName;

            // 이미 초기 로딩(DOMContentLoaded)에서 데이터를 다 가져왔으므로
            // 여기서는 별도의 로딩 없이 즉시 렌더링만 진행합니다.
            renderSeating();

            // 로딩창 닫기
            hideLoading();
        }

        async function handleLogin() {
            const nameInput = document.getElementById('teacherNameInput').value.trim();

            if (!nameInput) {
                showAlert('감독 교사 성함을 입력해주세요.');
                return;
            }

            // 교사 명단이 아직 로드 안됐으면 대기
            if (allowedTeachers.length === 0) {
                showLoading('init', "교사 명단을 확인하는 중...");
                await fetchTeacherList();
                hideLoading();
            }

            if (allowedTeachers.length === 0) {
                showAlert('인터넷 연결이 원활하지 않거나 구글 시트 주소가 올바르지 않아 교사 명단을 불러올 수 없습니다.\n인터넷 연결을 확인한 후 다시 시도해 주세요.');
                return;
            }

            if (!allowedTeachers.includes(nameInput)) {
                showAlert('등록되지 않은 선생님입니다. 입력하신 성함을 다시 한 번 확인해주세요.');
                return;
            }

            // 학생 데이터가 아직 없는 경우에만 로딩 (보통은 초기화에서 이미 로드 완료)
            if (globalData.length === 0) {
                showLoading('init', "학생 명단을 불러오는 중...");
                const success = await fetchGlobalData(true);
                if (!success) {
                    hideLoading();
                    showAlert('구글 시트에서 학생 명단을 가져오는 데 실패했습니다.');
                    return;
                }
            }

            await startAppSession(nameInput);
        }


        async function fetchTeacherList() {
            if (teacherListPromise) return teacherListPromise;

            const gasUrl = document.getElementById('gasUrl').value.trim();
            if (!gasUrl) return;

            teacherListPromise = (async () => {
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 20000); // 20초 제한

                    const response = await fetch(`${gasUrl}?action=getTeachers`, { signal: controller.signal });
                    clearTimeout(timeoutId);

                    const names = await response.json();
                    if (Array.isArray(names)) {
                        allowedTeachers = names;
                        localStorage.setItem('yajaTeacherList2', JSON.stringify(allowedTeachers));
                        console.log("감독 교사 명단 로드 완료:", allowedTeachers.length, "명");
                    }
                } catch (e) {
                    console.error("Fetch teachers error:", e);
                } finally {
                    teacherListPromise = null;
                }
            })();

            return teacherListPromise;
        }

        async function handleLogout() {
            showConfirm('로그아웃 하시겠습니까?', () => {
                sessionStorage.removeItem('yajaSupervisor2');
                // 로그아웃 시 보안을 위해 학생 명단 캐시도 삭제할 수 있지만, 
                // 속도를 위해 남겨두는 편이 좋습니다. (필요 시 아래 주석 해제)
                // localStorage.removeItem('yajaStudentList2');
                supervisorName = '';
                document.getElementById('teacherNameInput').value = '';
                document.getElementById('loginOverlay').style.display = 'flex';
                document.getElementById('mainApp').style.display = 'none';
            });
        }

        async function refreshStudentList() {
            showLoading('init', "최신 데이터를 불러오고 있습니다...");
            const success = await fetchGlobalData(true); // 강제 새로고침
            await fetchAllTodayAttendance(true, true); // 출결 데이터도 서버에서 새로 동기화
            hideLoading();
            if (success) {
                showToast("데이터가 성공적으로 갱신되었습니다.");
                renderSeating();
            } else {
                showAlert("명단 갱신에 실패했습니다. 인터넷 연결을 확인해주세요.");
            }
        }
        // 시트 데이터 캐싱 로직
        let globalData = [];

        async function fetchGlobalData(force = false) {
            // 강제 갱신이 아니고 캐시가 존재하면 캐시 데이터 사용 (속도 향상)
            if (!force) {
                const cached = localStorage.getItem('yajaStudentList2');
                if (cached) {
                    try {
                        globalData = JSON.parse(cached);
                        if (Array.isArray(globalData) && globalData.length > 0) {
                            console.log("캐시된 학생 명단 로드 완료:", globalData.length, "명");
                            return true;
                        }
                    } catch (e) {
                        localStorage.removeItem('yajaStudentList2');
                    }
                }
            }

            if (studentListPromise) return studentListPromise;

            const gasUrl = document.getElementById('gasUrl').value.trim();
            if (!gasUrl) return false;

            studentListPromise = (async () => {
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 20000); // 20초 제한

                    const response = await fetch(`${gasUrl}?action=getSecondStudents`, { signal: controller.signal });
                    clearTimeout(timeoutId);

                    const data = await response.json();
                    if (Array.isArray(data)) {
                        if (data.length === 0) {
                            console.warn("서버에서 빈 명단을 반환했습니다.");
                            return false;
                        }

                        globalData = data.map(s => {
                            const obj = {};
                            for (let key in s) {
                                const cleanKey = String(key).trim();
                                obj[cleanKey] = (s[key] === null || s[key] === undefined) ? "" : String(s[key]).trim();
                            }
                            return obj;
                        });

                        localStorage.setItem('yajaStudentList2', JSON.stringify(globalData));
                        console.log("학생 명단 서버 로드 완료:", globalData.length, "명");

                        return true;
                    }
                } catch (e) {
                    console.error("Fetch students error:", e);
                    if (!localStorage.getItem('yajaStudentList2')) {
                        showAlert("서버에서 학생 명단을 가져오는 데 실패했습니다.");
                    }
                } finally {
                    studentListPromise = null;
                }
                return false;
            })();

            return studentListPromise;
        }

        // 오늘 요일 자동 감지 및 초기값 설정
        const daysMap = ['일', '월', '화', '수', '목', '금', '토'];
        const todayIdx = new Date().getDay();
        const initialDay = (todayIdx >= 1 && todayIdx <= 5) ? daysMap[todayIdx] : '월';

        let currentDay = initialDay;

        /**
         * 지금 시각으로 볼 교시를 정한다.
         *   1교시  ~ 18:20        -> 1교시
         *   19:00 ~ 21:00        -> 2교시
         *   그 밖의 시간          -> 1교시 (기본값)
         */
        function periodByClock(now = new Date()) {
            const mins = now.getHours() * 60 + now.getMinutes();
            if (mins >= 19 * 60 && mins < 21 * 60) return '2';   // 19:00 ~ 20:59
            return '1';
        }

        let currentPeriod = periodByClock();

        function selectPeriod(btn) {
            document.querySelectorAll('#periodButtons [data-period]').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentPeriod = btn.dataset.period;
            renderSeating();
        }

        document.querySelectorAll('#dayButtons .day-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('#dayButtons .day-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentDay = btn.dataset.day;
                renderSeating();
            });
        });

        /** 교실명을 "2-3, 2-4 ... " 처럼 자연스러운 순서로 정렬 */
        function sortRoomNames(rooms) {
            return rooms.slice().sort((a, b) => {
                const na = a.match(/^(\d+)\s*-\s*(\d+)/);
                const nb = b.match(/^(\d+)\s*-\s*(\d+)/);
                if (na && nb) {
                    if (Number(na[1]) !== Number(nb[1])) return Number(na[1]) - Number(nb[1]);
                    return Number(na[2]) - Number(nb[2]);
                }
                if (na) return -1;      // 숫자형 교실(2-3)을 앞으로
                if (nb) return 1;
                return a.localeCompare(b, 'ko');
            });
        }

        /**
         * 해당 요일의 교실별 학생 명단.
         * [2학기 정책] 자동 배정을 하지 않는다. 오직 구글 시트의 [요일_배정] 칸에 적힌 교실만 따른다.
         *  - 그 요일에 신청(요일1/요일2 칸에 값)이 있고 + 배정 칸에 교실명이 있으면 그 교실에 넣는다.
         *  - 배정 칸이 비어 있으면 어느 교실에도 나타나지 않는다. (배정 전에는 화면이 비어 있는 게 정상)
         *  - 교실 목록은 배정 칸에 실제로 적힌 값에서 자동으로 만든다. (2-3, 2-7, 도서관 … 무엇이든 가능)
         */
        function getRoomStudents(day, period) {
            const per = String(period || currentPeriod);
            const col1 = `${day}1`;
            const col2 = `${day}2`;
            const thisCol = `${day}${per}`;
            const overrideCol = `${day}_배정`;

            const roomLists = {};
            let appliedCount = 0;      // 그 교시에 신청한 학생 수
            let unassignedCount = 0;   // 신청했지만 아직 교실 배정이 안 된 학생 수

            globalData.forEach(s => {
                const hasP1 = s[col1] && String(s[col1]).trim() !== '';
                const hasP2 = s[col2] && String(s[col2]).trim() !== '';
                if (!hasP1 && !hasP2) return;   // 그 요일 신청 자체가 없음

                // [교대방 지원] 그 교시에 참여하는 학생만 표시한다.
                //  - 2-5처럼 1교시엔 1교시조, 2교시엔 2교시조가 쓰는 교실에서
                //    교시를 넘길 때 명단이 통째로 바뀌도록 하기 위함
                const inThisPeriod = s[thisCol] && String(s[thisCol]).trim() !== '';
                if (!inThisPeriod) return;

                appliedCount++;

                const room = (s[overrideCol] || '').toString().trim();
                if (!room) { unassignedCount++; return; }   // 배정 전 → 표시하지 않음

                if (!roomLists[room]) roomLists[room] = [];
                roomLists[room].push(s);
            });

            Object.keys(roomLists).forEach(room => {
                roomLists[room].sort((a, b) => Number(a.학번) - Number(b.학번));
            });

            return {
                roomLists: roomLists,
                rooms: sortRoomNames(Object.keys(roomLists)),
                appliedCount: appliedCount,
                unassignedCount: unassignedCount
            };
        }

        /**
         * 시트에 적힌 좌석 번호(1~30)를 읽는다. 이번 교시 칸이 비었으면 그 요일의 다른 교시 칸을 본다.
         * 신청 API가 넣는 값도 '1'이라 그 자체로는 좌석번호인지 알 수 없다.
         * → 실제 유효성(중복 여부)은 호출부에서 판단한다.
         */
        /**
         * 좌석 칸에 들어갈 이름 HTML.
         * 이름이 길면(4자 이상) 글자 크기를 줄여서 잘리지 않게 한다. (모바일 대응)
         */
        function studentNameHtml(name) {
            const len = (name || '').trim().length;
            const cls = len >= 6 ? ' len6' : (len === 5 ? ' len5' : (len === 4 ? ' len4' : ''));
            return `<div class="student-name${cls}">${name}</div>`;
        }

        function readSeatNumber(student, day) {
            // 이 교시에 참여하는 학생만 그리므로 이번 교시 칸만 본다.
            // (전각 숫자 '１' 같은 입력도 반각으로 바꿔서 읽는다)
            let raw = String(student[`${day}${currentPeriod}`] || '').trim()
                .replace(/[０-９]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0));
            const num = parseInt(raw, 10);
            return (!isNaN(num) && num >= 1 && num <= 30) ? num : 0;
        }

        /* ── 좌석 번호 규칙 (시험 좌석과 동일) ───────────────────────────
         * 교탁에서 바라볼 때 '창가쪽' 맨 앞이 1번.
         * 거기서 뒤로 내려가며 2·3·4·5 → 그다음 열이 6번부터 …
         * (창가쪽 = 학생이 교탁을 바라볼 때 오른쪽 열)
         *
         *      30 25   20 15   10  5   ← 맨 뒤
         *      29 24   19 14    9  4
         *      28 23   18 13    8  3
         *      27 22   17 12    7  2
         *      26 21   16 11    6  1   ← 맨 앞
         *              [ 교 탁 ]
         *
         * 격자 인덱스 i = row*6 + col (row 0 = 맨 뒤, col 0 = 맨 왼쪽)
         * 짝꿍 없는 자리는 모두 짝수 번호가 된다.
         * ------------------------------------------------------------- */

        /** 좌석 번호(1~30) → [row, col] */
        function seatToPos(seat) {
            const k = Math.floor((seat - 1) / 5);   // 오른쪽에서 몇 번째 열
            const d = (seat - 1) % 5;               // 앞에서 몇 번째 줄
            return [4 - d, 5 - k];
        }

        /** 격자 인덱스 → 좌석 번호(1~30) */
        function posToSeat(i) {
            const row = Math.floor(i / 6), col = i % 6;
            return (5 - col) * 5 + (4 - row) + 1;
        }

        const PERIODS_ALL = ['1', '2'];

        /** 교실별 색/이모지 (교실 목록이 동적이라 순번으로 배정) */
        const ROOM_PALETTE = ['#4A90E2', '#12b886', '#f59e0b', '#e8739a', '#7c4dff', '#0d9488', '#d0021b', '#0ea5e9'];
        const ROOM_EMOJIS = ['📘', '📗', '📙', '📕', '📒', '📓', '📔', '📚'];

        /** "2-3" 형태면 "2-3반", "도서관" 같은 이름은 그대로 */
        function roomLabelOf(roomName) {
            return /^\d+\s*-\s*\d+$/.test(String(roomName || '').trim()) ? roomName + '반' : roomName;
        }


        // ====== Background Sync Manager (v23) ======
        const SyncManager = {
            queue: [],
            isProcessing: false,
            beforeUnloadHandlerBound: false,

            init() {
                // 1. localStorage에서 저장된 미전송 큐 로드
                const stored = localStorage.getItem('yajaSyncQueue2');
                if (stored) {
                    try {
                        this.queue = JSON.parse(stored);
                        // 혹시 남아있을 수 있는 'processing' 상태를 'pending'으로 복구
                        this.queue.forEach(item => {
                            if (item.status === 'processing') {
                                item.status = 'pending';
                            }
                        });
                        console.log("미전송 백그라운드 큐 로드 완료:", this.queue.length, "건");
                    } catch (e) {
                        localStorage.removeItem('yajaSyncQueue2');
                    }
                }

                // 2. UI 초기화 및 프로세스 시작
                this.updateUI();
                if (this.queue.length > 0) {
                    this.processQueue();
                }
            },

            saveQueue() {
                localStorage.setItem('yajaSyncQueue2', JSON.stringify(this.queue));
                this.checkBeforeUnload();
            },

            checkBeforeUnload() {
                const hasPending = this.queue.some(item => item.status === 'pending' || item.status === 'processing');
                if (hasPending && !this.beforeUnloadHandlerBound) {
                    window.addEventListener('beforeunload', this.beforeUnloadListener);
                    this.beforeUnloadHandlerBound = true;
                } else if (!hasPending && this.beforeUnloadHandlerBound) {
                    window.removeEventListener('beforeunload', this.beforeUnloadListener);
                    this.beforeUnloadHandlerBound = false;
                }
            },

            beforeUnloadListener(e) {
                const message = "현재 출결 시트 전송이 백그라운드에서 진행 중입니다. 페이지를 닫으시면 전송이 중단될 수 있습니다.";
                e.returnValue = message;
                return message;
            },

            add(roomName, payload) {
                const id = Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                const item = {
                    id,
                    roomName,
                    payload,
                    status: 'pending',
                    retries: 0
                };

                // 동일 학급/교시의 이전 요청이 있다면 상태에 관계없이 제거하고 최신 것으로 대체 (중복 전송 방지)
                this.queue = this.queue.filter(q => !(q.roomName === roomName && q.payload.period === payload.period));

                this.queue.push(item);
                this.saveQueue();
                this.updateUI();
                this.processQueue();
            },

            async processQueue() {
                if (this.isProcessing) return;
                this.isProcessing = true;

                while (this.queue.some(item => item.status === 'pending')) {
                    const item = this.queue.find(item => item.status === 'pending');
                    if (!item) break;

                    item.status = 'processing';
                    this.saveQueue();
                    this.updateUI();

                    try {
                        const gasUrl = document.getElementById('gasUrl').value.trim();
                        if (!gasUrl) throw new Error("GAS URL이 비어있습니다.");

                        const controller = new AbortController();
                        const timeoutId = setTimeout(() => controller.abort(), 15000); // 15초 제한

                        await fetch(gasUrl, {
                            method: 'POST',
                            mode: 'no-cors',
                            body: JSON.stringify(item.payload),
                            signal: controller.signal
                        });

                        clearTimeout(timeoutId);

                        // 전송 성공 처리
                        item.status = 'success';
                        const dateStr = getTodayDateString();
                        const periodNum = item.payload.period.replace('교시', '');
                        localStorage.setItem(`synced_${dateStr}_${item.payload.day}_${periodNum}_${item.roomName}`, 'true');

                        // 동기화 완료 토스트 업데이트 후 3초 뒤에 제거
                        this.saveQueue();
                        this.updateUI();

                        const toastId = item.id;
                        setTimeout(() => {
                            this.queue = this.queue.filter(q => q.id !== toastId);
                            this.saveQueue();
                            this.updateUI();
                        }, 3000);

                    } catch (e) {
                        console.error("Sync failed for room:", item.roomName, e);
                        item.retries++;
                        if (item.retries >= 3) {
                            item.status = 'failed';
                            this.saveQueue();
                            this.updateUI();
                            showAlert(`${roomLabelOf(item.roomName)} 출결 시트 전송에 실패했습니다.\n네트워크 연결을 확인한 후 다시 시도해 주세요.`);

                            // 8초 후 큐에서 제거
                            const toastId = item.id;
                            setTimeout(() => {
                                this.queue = this.queue.filter(q => q.id !== toastId);
                                this.saveQueue();
                                this.updateUI();
                            }, 8000);
                        } else {
                            // 대기 상태로 되돌려 다음 루프에서 재시도 하도록 유도
                            item.status = 'pending';
                            this.saveQueue();
                            this.updateUI();
                            // 재시도 대기 (2초 후)
                            await new Promise(resolve => setTimeout(resolve, 2000));
                        }
                    }
                }

                this.isProcessing = false;
                this.checkBeforeUnload();
            },

            updateUI() {
                let container = document.getElementById('sync-status-container');
                if (!container) {
                    container = document.createElement('div');
                    container.id = 'sync-status-container';
                    document.body.appendChild(container);
                }

                const activeItems = this.queue.filter(item => ['pending', 'processing', 'success', 'failed'].includes(item.status));

                container.innerHTML = '';
                activeItems.forEach(item => {
                    const toast = document.createElement('div');
                    toast.className = 'sync-toast show';
                    toast.id = `toast_${item.id}`;

                    let iconHtml = '';
                    let textHtml = '';

                    if (item.status === 'pending' || item.status === 'processing') {
                        iconHtml = '<div class="spinner"></div>';
                        textHtml = `<span class="text">${roomLabelOf(item.roomName)} 전송 중...</span>`;
                    } else if (item.status === 'success') {
                        iconHtml = '<span class="icon-success">✓</span>';
                        textHtml = `<span class="text" style="color: #10B981;">${roomLabelOf(item.roomName)} 전송 완료!</span>`;
                    } else if (item.status === 'failed') {
                        iconHtml = '<span class="icon-error">✗</span>';
                        textHtml = `<span class="text" style="color: #EF4444;">${roomLabelOf(item.roomName)} 전송 실패 (다시 시도)</span>`;
                    }

                    toast.innerHTML = `${iconHtml}${textHtml}`;
                    container.appendChild(toast);
                });

                // 각 자습실의 시트 전송 버튼 상태 동기화 (화면에 실제로 그려진 교실 기준)
                document.querySelectorAll('.classroom-section').forEach(section => {
                    const roomName = section.getAttribute('data-room');
                    const submitBtn = section.querySelector('.btn-submit');
                    if (submitBtn) {
                        const isSyncing = this.queue.some(item => item.roomName === roomName && (item.status === 'pending' || item.status === 'processing'));
                        if (isSyncing) {
                            submitBtn.disabled = true;
                            submitBtn.classList.add('btn-success-temp');
                            submitBtn.innerHTML = '✅ 전송 요청됨';
                        } else {
                            submitBtn.disabled = false;
                            submitBtn.classList.remove('btn-success-temp');
                            submitBtn.innerHTML = '💾 시트 전송';
                        }
                    }
                });
            }
        };

        async function saveRoomAttendanceToSheet(roomName) {
            const gasUrl = document.getElementById('gasUrl').value.trim();
            if (!gasUrl) return;

            const dMap = ['일', '월', '화', '수', '목', '금', '토'];
            const actualToday = dMap[new Date().getDay()];

            if (currentDay !== actualToday) {
                showAlert(`${actualToday}요일 데이터만 시트 전송이 가능합니다.\n현재 선택된 요일(${currentDay}요일)은 전송할 수 없습니다.`);
                return;
            }

            const roomStudents = getRoomStudents(currentDay, currentPeriod).roomLists[roomName] || [];
            const activeStudents = roomStudents.filter(s => s[`${currentDay}${currentPeriod}`] && String(s[`${currentDay}${currentPeriod}`]).trim() !== '');

            if (activeStudents.length === 0) {
                showAlert(`${roomLabelOf(roomName)}에 ${currentPeriod}교시 참여 학생이 없습니다.`);
                return;
            }

            const dateStr = getTodayDateString();

            /* 누르자마자 잠근다.
               예전에는 시트 조회(await)가 끝난 뒤에야 버튼이 바뀌어서,
               반응이 없다고 여러 번 누르게 되고 그만큼 요청이 겹쳤다. */
            const submitBtn0 = document.querySelector(`.classroom-section[data-room="${roomName}"] .btn-submit`);
            if (submitBtn0) {
                if (submitBtn0.disabled) return;          // 이미 보내는 중이면 무시
                submitBtn0.disabled = true;
                submitBtn0.innerHTML = '⏳ 전송 준비 중...';
            }
            const unlock = () => {
                if (submitBtn0 && !submitBtn0.classList.contains('btn-success-temp')) {
                    submitBtn0.disabled = false;
                    submitBtn0.innerHTML = '💾 시트 전송';
                }
            };

            /* ── 안전장치 ────────────────────────────────────────────────
             * 이 기기에 이 교실·교시의 출결 정보가 하나도 없으면,
             * 아래 로직은 전원을 '결석'으로 만들어 보낸다.
             * (localStorage 에 값이 없으면 null -> false -> 결석)
             *
             * 감독이 아닌 선생님이 메모만 남기고 전송하는 경우가 이에 해당하며,
             * 시트에 이미 기록된 출석이 통째로 결석으로 덮어써진다.
             * 그래서 한 번 확인을 받는다.
             *
             * att_        : 이 기기에서 직접 체크한 값
             * initial_att_: 시트에서 불러온 값
             * 둘 다 하나도 없으면 "아는 게 없는 상태" 로 본다.
             * ------------------------------------------------------- */
            const hasAnyAttInfo = activeStudents.some(s =>
                localStorage.getItem(`att_${dateStr}_${currentDay}_${currentPeriod}_${s.학번}`) !== null ||
                localStorage.getItem(`initial_att_${dateStr}_${currentDay}_${currentPeriod}_${s.학번}`) !== null
            );

            if (!hasAnyAttInfo) {
                showConfirm(
                    `${roomLabelOf(roomName)} ${currentPeriod}교시의 출결 정보를 아직 불러오지 못했습니다.

` +
                    `지금 전송하면 ${activeStudents.length}명 전원이 '결석'으로 기록되어,
` +
                    `다른 선생님이 이미 체크한 출결이 지워질 수 있습니다.

` +
                    `먼저 [출결 새로고침]을 눌러 주세요.
` +
                    `메모만 남기려면 전송하지 않아도 저장되어 있습니다.

` +
                    `그래도 전원 결석으로 전송할까요?`,
                    () => sendRoomAttendancePayload(roomName, activeStudents, dateStr, submitBtn0),
                    unlock            // 취소하면 버튼을 되돌린다
                );
                return;
            }

            sendRoomAttendancePayload(roomName, activeStudents, dateStr, submitBtn0);
        }

        /**
         * 전송 직전에 '비고'만 시트와 맞춰 둔다. (출결은 절대 건드리지 않는다)
         *
         * 다른 선생님이 남긴 메모를 이 기기가 모르면 빈 값으로 덮어써 버린다.
         * 그래서 보내기 전에 시트를 한 번 읽어,
         *   - 이 기기에서 직접 고친 메모(rem_ !== initial_rem_)는 내 값을 유지하고
         *   - 손대지 않은 메모는 시트 값으로 채운다.
         *
         * 조회에 실패하면 갖고 있는 값 그대로 진행한다(출결 전송을 막지 않는다).
         * @returns {boolean} 시트와 맞추는 데 성공했으면 true
         */
        async function mergeRemarksFromSheet(roomName, day, period, dateStr) {
            const gasUrl = document.getElementById('gasUrl').value.trim();
            if (!gasUrl) return false;

            try {
                const url = `${gasUrl}${gasUrl.includes('?') ? '&' : '?'}sheetTarget=second`
                    + `&date=${encodeURIComponent(dateStr)}&day=${encodeURIComponent(day)}`
                    + `&period=${encodeURIComponent(period + '교시')}&room=${encodeURIComponent(roomName)}`;

                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 15000);
                const res = await fetch(url, { signal: controller.signal });
                clearTimeout(timeoutId);

                const results = await res.json();
                if (!results || typeof results !== 'object' || results.error) return false;

                Object.keys(results).forEach(key => {
                    const data = results[key];
                    if (!data || typeof data !== 'object') return;
                    const sid = (data['학번'] || key || '').toString().trim();
                    if (!sid || sid === 'error' || sid === 'supervisor') return;

                    const remKey = `rem_${dateStr}_${day}_${period}_${sid}`;
                    const initKey = `initial_rem_${dateStr}_${day}_${period}_${sid}`;
                    const localRem = localStorage.getItem(remKey);
                    const initialRem = localStorage.getItem(initKey);
                    const sheetRem = (data['비고'] || data.remark || '').trim();

                    // 이 기기에서 고친 메모라면 내 값을 지킨다
                    const editedHere = (localRem !== null) && (localRem !== (initialRem === null ? '' : initialRem));
                    if (editedHere) return;

                    localStorage.setItem(remKey, sheetRem);
                    localStorage.setItem(initKey, sheetRem);
                });
                return true;
            } catch (e) {
                console.error('메모 동기화 실패:', e);
                return false;
            }
        }

        /** 실제 전송 페이로드를 만들어 SyncManager 에 넘긴다. */
        async function sendRoomAttendancePayload(roomName, activeStudents, dateStr, submitBtn0) {
            // 다른 선생님의 메모를 지우지 않도록 비고만 먼저 맞춘다
            const merged = await mergeRemarksFromSheet(roomName, currentDay, currentPeriod, dateStr);
            if (!merged) {
                showToast('⚠️ 메모를 시트와 맞추지 못했습니다. 출결은 그대로 전송됩니다.');
            }

            let isAnyStatusChanged = false;
            activeStudents.forEach(s => {
                const attKey = `att_${dateStr}_${currentDay}_${currentPeriod}_${s.학번}`;
                const attVal = localStorage.getItem(attKey);
                const isPresent = (attVal === 'true' || attVal === 'TRUE' || attVal === true || attVal === '출석');
                const initialStatus = localStorage.getItem(`initial_att_${dateStr}_${currentDay}_${currentPeriod}_${s.학번}`);

                if (initialStatus !== null) {
                    const currentStatusStr = isPresent ? 'true' : 'false';
                    const initialStatusStr = (initialStatus === 'true' || initialStatus === '출석') ? 'true' : 'false';
                    if (currentStatusStr !== initialStatusStr) isAnyStatusChanged = true;
                }
            });

            const currentSup = (typeof supervisorName !== 'undefined' && supervisorName) ? supervisorName : "선생님";
            const existingRoomSup = localStorage.getItem(`sup_${dateStr}_${currentDay}_${currentPeriod}_${roomName}`);
            const batchSupervisor = (isAnyStatusChanged || !existingRoomSup || existingRoomSup === "선생님") ? currentSup : existingRoomSup;

            const studentsData = activeStudents.map(s => {
                const attKey = `att_${dateStr}_${currentDay}_${currentPeriod}_${s.학번}`;
                const attVal = localStorage.getItem(attKey);
                const isPresent = (attVal === 'true' || attVal === 'TRUE' || attVal === true || attVal === '출석');
                const remark = localStorage.getItem(`rem_${dateStr}_${currentDay}_${currentPeriod}_${s.학번}`) || "";

                return {
                    id: s.학번,
                    name: s.이름,
                    status: isPresent,
                    remark: remark,
                    supervisor: batchSupervisor
                };
            });

            const payload = {
                type: "bulk",
                sheetTarget: "second",
                date: dateStr,
                day: currentDay,
                period: currentPeriod + '교시',
                room: roomName,
                supervisor: batchSupervisor,
                students: studentsData
            };

            // 전송 요청 완료 표시
            const submitBtn = submitBtn0 || document.querySelector(`.classroom-section[data-room="${roomName}"] .btn-submit`);
            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.classList.add('btn-success-temp');
                submitBtn.innerHTML = '✅ 전송 요청됨';
            }

            // SyncManager에 위임하여 백그라운드 전송 실행
            SyncManager.add(roomName, payload);
        }

        // ====== Memo (Long Press) Feature ======

        let memoCurrentDay = null;
        let memoCurrentPeriod = null;

        function saveMemo() {

            const text = document.getElementById('memoTextarea').value.trim();

            const remarkKey = `rem_${dateStr}_${memoCurrentDay}_${memoCurrentPeriod}_${memoCurrentStudentId}`;

            const dMap = ['일', '월', '화', '수', '목', '금', '토'];

                if (text) {

                } else {
                    localStorage.removeItem(pastDateKey);

                localStorage.setItem(remarkKey, text);
            } else {
                localStorage.removeItem(remarkKey);
            }

            // closeMemoModal() 이 memoCurrentStudentId 를 비우므로 먼저 붙잡아 둔다
            const sid = memoCurrentStudentId;

                showToast(text ? '📝 메모가 임시 저장되었습니다.' : '🗑️ 메모가 삭제되었습니다.');
                return;
            }

            // 오늘 메모는 바로 시트에 보낸다.
            //   past_memos 경로는 '비고'만 고치고 출결·감독교사는 건드리지 않으므로,
            //   감독이 아닌 선생님이 써도 다른 사람의 출결을 덮어쓸 일이 없다.
            sendTodayMemo(sid, sDay, sPeriod, sRoom, text);

        /**
         * 오늘 날짜 메모 한 건을 시트에 반영한다. (출결은 건드리지 않음)
         * 실패해도 로컬에는 남아 있으므로 [시트 전송] 때 다시 올라간다.
         */
        async function sendTodayMemo(studentId, day, period, roomName, text) {
            const gasUrl = document.getElementById('gasUrl').value.trim();
            const student = globalData.find(s => String(s['학번']) === String(studentId));
            if (!gasUrl || !student || !roomName) {
                showToast(text ? '📝 메모가 임시 저장되었습니다.' : '🗑️ 메모가 삭제되었습니다.');
                return;
            }

            const payload = {
                type: "past_memos",
                sheetTarget: "second",
                memos: [{
                    date: getTodayDateString(),
                    day: day,
                    period: period + '교시',
                    room: roomName,
                    supervisor: (typeof supervisorName !== 'undefined' && supervisorName) ? supervisorName : "선생님",
                    student: {
                        id: studentId,
                        name: student['이름'],
                        remark: text,
                        status: false
                    }
                }]
            };

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 20000);
                await fetch(gasUrl, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify(payload),
                    signal: controller.signal
                });
                clearTimeout(timeoutId);
                showToast(text ? '📝 메모를 시트에 기록했습니다.' : '🗑️ 메모를 시트에서 지웠습니다.');
            } catch (error) {
                console.error('메모 전송 실패:', error);
                showToast('📝 메모는 저장했지만 시트 전송에 실패했습니다. 나중에 다시 시도됩니다.');
            }
        }

        function clearMemo() {
            document.getElementById('memoTextarea').value = '';
        }

        async function sendBulkPastMemos(roomName) {
            const dMap = ['일', '월', '화', '수', '목', '금', '토'];
            const actualToday = dMap[new Date().getDay()];
            if (currentDay === actualToday) return;

            const dateStr = getTodayDateString();
            const prefix = `rem_${dateStr}_${currentDay}_${currentPeriod}_`;
            const datePrefix = `past_date_${currentDay}_${currentPeriod}_`;

            const memosToSend = [];

            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.startsWith(prefix)) {
                    const studentId = key.split('_').pop();
                    const text = localStorage.getItem(key);
                    const pastDate = localStorage.getItem(datePrefix + studentId);

                    if (text && pastDate) {
                        const studentObj = globalData.find(s => String(s['학번']) === String(studentId));
                        if (!studentObj) continue;

                        const attKey = `att_${dateStr}_${currentDay}_${currentPeriod}_${studentId}`;
                        const isChecked = (localStorage.getItem(attKey) === 'true');
                        if (isChecked) {
                            showAlert(`${studentObj['이름']} 학생의 출결 기록이 변경되어 있습니다.\n지난 과거의 출결 기록은 앱에서 변경할 수 없습니다.\n체크를 해제하고 시트에서 직접 변경해주세요.`);
                            return;
                        }

                        memosToSend.push({
                            date: pastDate,
                            day: currentDay,
                            period: currentPeriod + '교시',
                            room: roomName,
                            supervisor: (typeof supervisorName !== 'undefined' && supervisorName) ? supervisorName : "선생님",
                            student: {
                                id: studentId,
                                name: studentObj['이름'],
                                remark: text,
                                status: false
                            }
                        });
                    }
                }
            }

            if (memosToSend.length === 0) {
                showAlert("전송할 과거 메모가 없습니다. 먼저 학생을 꾹 눌러 메모를 저장해주세요.");
                return;
            }

            const gasUrl = document.getElementById('gasUrl').value.trim();
            if (!gasUrl) return;

            const payload = {
                type: "past_memos",
                sheetTarget: "second",
                memos: memosToSend
            };

            showLoading('upload', "과거 메모 일괄 전송 중...");
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 20000); // 20초 제한

                await fetch(gasUrl, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify(payload),
                    signal: controller.signal
                });

                clearTimeout(timeoutId);
                showToast(`총 ${memosToSend.length}건의 과거 메모가 시트로 안전하게 전송되었습니다.`);
                // 성공 후에도 로컬 데이터를 냅두어 시각적으로 유지되도록 함
            } catch (error) {
                console.error(error);
                if (error.name === 'AbortError') {
                    showAlert("과거 메모 전송 시간이 초과되었습니다. 네트워크 연결을 확인한 후 다시 시도해 주세요.");
                } else {
                    showAlert("전송 중 오류가 발생했습니다. 다시 시도해 주세요.");
                }
            } finally {
                hideLoading();
            }
        }

        /**
         * 좌석에 롱프레스(꾹 누르기) 이벤트를 설정합니다.
         * - 짧게 누르면: 출석/결석 토글 (기존 기능)
         * - 길게 누르면 (500ms): 메모 입력 모달 표시
         */
        function setupLongPress(seatElement, studentId, studentName, attKey) {
            let pressTimer = null;
            let isLong = false;
            let isMoved = false;
            let startX = 0, startY = 0;

            seatElement.addEventListener('pointerdown', (e) => {
                if (e.button !== 0) return; // Only trigger for primary click / tap
                isLong = false;
                isMoved = false;
                startX = e.clientX;
                startY = e.clientY;

                if (pressTimer) clearTimeout(pressTimer);
                pressTimer = setTimeout(() => {
                    if (isMoved) return;
                    isLong = true;
                    if (navigator.vibrate) navigator.vibrate(50);
                    const roomName = seatElement.closest('.classroom-section').dataset.room;
                    openMemoModal(studentId, studentName, currentDay, currentPeriod, roomName);
                }, 600); // 500ms -> 600ms로 약간 여유있게
            });

            seatElement.addEventListener('pointermove', (e) => {
                if (!pressTimer) return;
                const dx = Math.abs(e.clientX - startX);
                const dy = Math.abs(e.clientY - startY);
                if (dx > 20 || dy > 20) {
                    isMoved = true;
                    clearTimeout(pressTimer);
                }
            });

            seatElement.addEventListener('pointerup', (e) => {
                if (e.button !== 0) return;
                clearTimeout(pressTimer);

                if (!isLong && !isMoved) {
                    const attVal = localStorage.getItem(attKey);
                    const nowPresent = (attVal === 'true' || attVal === 'TRUE' || attVal === true);
                    localStorage.setItem(attKey, !nowPresent);
                    seatElement.classList.toggle('present', !nowPresent);
                }
                isLong = false;
                isMoved = false;
            });

            seatElement.addEventListener('pointerleave', () => {
                clearTimeout(pressTimer);
                isMoved = false;
            });

            seatElement.addEventListener('pointercancel', () => {
                clearTimeout(pressTimer);
            });

            seatElement.addEventListener('contextmenu', (e) => e.preventDefault());
        }

                               구글 시트 [2학기 학생명단] 탭의 <b>[${currentDay}_배정]</b> 칸에 교실명(예: 2-3)을 적으면 이 화면에 나타납니다.<br>
                               <span style="color:var(--text-muted); font-size:0.9rem;">※ 좌석 번호를 따로 적지 않으면 학번 순으로 자동 배치됩니다.</span>`
            : `💡 <b>도움말</b><br>
                               1. 구글 시트 [2학기 학생명단] 탭의 [${currentDay}1], [${currentDay}2] 칸에 값이 있나요?<br>
                               2. 상단 [명단 갱신] 버튼으로 최신 명단을 불러와 보세요.`}
                    </span>
                </div>`;
                return;

            // 실제 오늘 요일 확인 (동기화 제한용)
            const dMap = ['일', '월', '화', '수', '목', '금', '토'];
            const actualToday = dMap[new Date().getDay()];

            rooms.forEach((roomName, roomIdx) => {
                const students = roomLists[roomName];
                if (students.length === 0) return;

                // 좌석 배치
                //  - 시트에 1~30 좌석번호가 적혀 있고 그 교실 안에서 겹치지 않으면 그 자리를 그대로 사용
                //  - 번호가 없거나(신청 표시 '1'만 있는 경우 포함) 서로 겹치면 학번 순으로 남은 자리에 자동 배치
                let gridSeats = new Array(30).fill(null).map(() => []);
                const seatTaken = new Array(31).fill(false);
                const seatUseCount = {};
                students.forEach(st => {
                    const num = readSeatNumber(st, currentDay);
                    if (num) seatUseCount[num] = (seatUseCount[num] || 0) + 1;
                });

                const placed = [];
                const needAutoSeat = [];
                students.forEach(st => {
                    const num = readSeatNumber(st, currentDay);
                    if (num && seatUseCount[num] === 1 && !seatTaken[num]) {
                        seatTaken[num] = true;
                        placed.push({ student: st, seat: num });
                    } else {
                        needAutoSeat.push(st);   // 번호 없음 or 중복 → 자동 배치 대상
                    }
                });

                let seatCursor = 1;
                needAutoSeat.forEach(st => {
                    while (seatCursor <= 30 && seatTaken[seatCursor]) seatCursor++;
                    const seat = (seatCursor <= 30) ? seatCursor : 30;   // 30명 초과분은 마지막 자리에 겹쳐 표시(중복 경고 마크)
                    if (seatCursor <= 30) seatTaken[seatCursor] = true;
                    placed.push({ student: st, seat: seat });
                });

                placed.forEach(p => {

                    gridSeats[row * 6 + col].push(p.student);

                // Calculate unique students for the whole day in this room
                const uniqueStudentsForDay = students;   // 이미 이 교시 참여자만 담겨 있다

                const roomEmoji = ROOM_EMOJIS[roomIdx % ROOM_EMOJIS.length];
                const roomLabel = roomLabelOf(roomName);
                section.innerHTML = `

                            <span class="sync-loading-indicator" style="color: #2e7d32; font-size: 0.8rem; font-weight: bold; display: none; align-items: center; gap: 4px;">
                                <span class="spinner-small" style="display:inline-block; width:10px; height:10px; border:2px solid #2e7d32; border-radius:50%; border-top-color:transparent; animation:spin 1s linear infinite; vertical-align: middle;"></span>
                                불러오는 중...

                            <button class="btn btn-refresh" onclick="fetchAttendanceFromSheet('${roomName}', { force: true })">🔄 출결 새로고침</button>
                            <button class="btn btn-primary btn-submit" onclick="saveRoomAttendanceToSheet('${roomName}')">💾 시트 전송</button>
                            <span class="room-meta">${currentDay}요일 | ${uniqueStudentsForDay.length}명</span>
                        </div>
                    </div>
                    <div class="grid-6x5"></div>
                    <div class="teacher-desk">교탁</div>

                const dateStr = getTodayDateString();
                const syncCacheKey = `synced_${dateStr}_${currentDay}_${currentPeriod}_${roomName}`;
                if (!localStorage.getItem(syncCacheKey)) {
                    // 렌더링 시에는 항상 silent 옵션을 주어 로딩창이 뜨지 않게 함
                    fetchAttendanceFromSheet(roomName, { silent: true });
                }

                const grid = section.querySelector('.grid-6x5');
                gridSeats.forEach((inSeat, i) => {
                    const col = i % 6;
                    if (col === 2 || col === 4) grid.appendChild(Object.assign(document.createElement('div'), { className: 'spacer' }));

                    const seatNo = posToSeat(i);
                    const seat = document.createElement('div');
                    seat.className = 'seat';
                    seat.setAttribute('data-index', i);
                    seat.setAttribute('data-seat', seatNo);

                    if (inSeat.length === 0) {
                        seat.classList.add('empty');
                    } else {
                        // 기존처럼 마지막 배정 학생을 기본으로 표시하되
                        const student = inSeat[inSeat.length - 1];

                        const periodVal = student[`${currentDay}${currentPeriod}`];
                        const isStudentInPeriod = periodVal && String(periodVal).trim() !== '';
                        if (!isStudentInPeriod) {
                            seat.classList.add('not-in-period');
                            seat.innerHTML = `<div class="student-id">${student.학번}</div>${studentNameHtml(student.이름)}`;
                        } else {
                            const attKey = `att_${dateStr}_${currentDay}_${currentPeriod}_${student.학번}`;

                                const memoLen = hasMemo.length;

                    seat.insertAdjacentHTML('afterbegin', `<div class="seat-no">${seatNo}</div>`);

        function getTodayDateString() {
            // "2026. 3. 19." 형식으로 통일 (끝에 점 포함)

        const fetchingRooms = new Set();
        /**
         * 시트에서 출석 데이터를 가져오는 함수
         * @param {string} roomName - 반 이름
         * @param {Object} options - { silent: 로딩창 숨김 여부, day: 명시적 요일, period: 명시적 교시 }
         */
        async function fetchAttendanceFromSheet(roomName, options = {}) {
            const { silent = false, day = currentDay, period = currentPeriod, force = false } = options;
            const gasUrl = document.getElementById('gasUrl').value.trim();
            if (!gasUrl) return;

            const dateStr = getTodayDateString();
            const fetchId = `${dateStr}_${day}_${period}_${roomName}`;

            // 이미 요청 중이면 중복 방지
            if (fetchingRooms.has(fetchId)) return;

            const cacheKey = `synced_${fetchId}`;
            if (!force && localStorage.getItem(cacheKey)) return;

            fetchingRooms.add(fetchId);
            const refreshBtn = document.querySelector(`.classroom-section[data-room="${roomName}"] .btn-refresh`);
            if (refreshBtn && force) {
                refreshBtn.disabled = true;
                refreshBtn.innerHTML = '🔄 로딩 중...';
            }

            // 🟢 초록색 불러오는 중 표시 활성화 (자동으로 구글 시트에서 가져올 때만 표시)
            const indicator = document.querySelector(`.classroom-section[data-room="${roomName}"] .sync-loading-indicator`);
            if (indicator && !force) {
                indicator.style.display = 'inline-flex';
            }

            try {
                const url = `${gasUrl}${gasUrl.includes('?') ? '&' : '?'}sheetTarget=second&date=${encodeURIComponent(dateStr)}&day=${encodeURIComponent(day)}&period=${encodeURIComponent(period + '교시')}&room=${encodeURIComponent(roomName)}`;

                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 20000); // 20초 제한

                const response = await fetch(url, { signal: controller.signal });
                clearTimeout(timeoutId);

                const results = await response.json();

                if (results && typeof results === 'object' && !results.error) {
                    let hasData = false;
                    let existingSup = "";
                    Object.keys(results).forEach(key => {
                        const data = results[key];
                        if (!data || typeof data !== 'object') return;

                        // 학번 식별 (키값 자체가 학번이거나, 데이터 내부에 '학번' 필드가 있는 경우 모두 대응)
                        const studentId = (data['학번'] || key || "").toString().trim();
                        if (!studentId || studentId === "error" || studentId === "supervisor") return;

                        hasData = true;
                        // '상태' 열 확인
                        const rawStatus = String(data['상태'] || data.status || "").trim();
                        const statusStr = (rawStatus === '출석' || rawStatus.toLowerCase() === 'true') ? 'true' : 'false';

                        localStorage.setItem(`att_${dateStr}_${day}_${period}_${studentId}`, statusStr);
                        localStorage.setItem(`rem_${dateStr}_${day}_${period}_${studentId}`, (data['비고'] || data.remark || "").trim());

                        // '감독교사' 열 확인
                        const rawSup = (data['감독교사'] || data.supervisor || data['감독'] || data.teacher || "").trim();
                        localStorage.setItem(`sup_val_${dateStr}_${day}_${period}_${studentId}`, rawSup);

                        // v22: 변동 감지를 위한 초기 상태 별도 보관
                        localStorage.setItem(`initial_att_${dateStr}_${day}_${period}_${studentId}`, statusStr);
                        localStorage.setItem(`initial_rem_${dateStr}_${day}_${period}_${studentId}`, (data['비고'] || data.remark || "").trim());

                        // 반 전체 대표 감독교사 정보 업데이트
                        if (rawSup && !existingSup && rawSup !== "선생님") {
                            existingSup = rawSup;
                        }
                    });

                    if (hasData) {
                        if (existingSup) {
                            localStorage.setItem(`sup_${dateStr}_${day}_${period}_${roomName}`, existingSup);
                        }
                        localStorage.setItem(cacheKey, 'true');
                        if (force) showToast(`${roomLabelOf(roomName)} 출결 정보를 업데이트했습니다.`);
                    } else if (force) {
                        showToast(`${roomLabelOf(roomName)}의 기존 출결 정보가 없습니다.`);
                    }

                    // 현재 보고 있는 화면과 데이터가 일치하면 UI 갱신
                    if (currentDay === day && currentPeriod === period) {
                        renderSeating();
                    }
                } else if (force && results && results.error) {
                    showAlert(`오류 발생: ${results.error}`);
                }
            } catch (error) {
                console.error('Fetch error:', error);
                if (force) {
                    if (error.name === 'AbortError') {
                        showAlert(`${roomLabelOf(roomName)} 출결 조회 시간이 초과되었습니다. 네트워크 상태를 확인 후 다시 시도해 주세요.`);
                    } else {
                        showAlert(`${roomLabelOf(roomName)} 출결 정보를 가져오는 데 실패했습니다. 다시 시도해 주세요.`);
                    }
                }
            } finally {
                fetchingRooms.delete(fetchId);
                // 🟢 초록색 불러오는 중 표시 비활성화
                const cleanIndicator = document.querySelector(`.classroom-section[data-room="${roomName}"] .sync-loading-indicator`);
                if (cleanIndicator) {
                    cleanIndicator.style.display = 'none';
                }
                if (refreshBtn && force) {
                    refreshBtn.disabled = false;
                    refreshBtn.innerHTML = '🔄 출결 새로고침';
                }
            }
        }

        // 실제 오늘 날짜(현지 시간 기준)의 모든 반/모든 교시 데이터를 한꺼번에 로드 (모달)
        async function fetchAllTodayAttendance(silent = false, force = false) {
            const periods = ['1', '2'];

            // 실제 오늘 요일 감지
            const dMap = ['일', '월', '화', '수', '목', '금', '토'];
            const actualToday = dMap[new Date().getDay()];
            if (actualToday === '일' || actualToday === '토') return;

            // 오늘 실제로 배정된 교실만 조회 (배정 전이면 조회할 것이 없음)
            const rooms = sortRoomNames([...new Set(
                PERIODS_ALL.flatMap(p => getRoomStudents(actualToday, p).rooms))]);
            if (rooms.length === 0) return;

            if (!silent) showLoading("데이터를 빠르게 동기화하는 중입니다..."); // 모든 데이터 로드 시 로딩창 표시

            try {
                // v19 개선: 병렬 실행(Promise.all)으로 속도 대폭 향상 (기존 10초+ -> 약 2초)
                const fetchPromises = [];
                for (const p of periods) {
                    for (const r of rooms) {
                        fetchPromises.push(fetchAttendanceFromSheet(r, { silent: true, day: actualToday, period: p, force: force }));
                    }
                }
                await Promise.all(fetchPromises);
            } catch (error) {
                console.error("전체 동기화 중 일부 오류 발생:", error);
            } finally {
                if (!silent) hideLoading();
            }
        }




        // 요일 버튼 초기 활성화 (교시 버튼에 영향을 주지 않도록 선택자 한정)
        const activeDayBtn = document.querySelector(`#dayButtons .day-btn[data-day="${currentDay}"]`);
        if (activeDayBtn) {
            document.querySelectorAll('#dayButtons .day-btn').forEach(b => b.classList.remove('active'));
            activeDayBtn.classList.add('active');
        }

        // 교시 버튼 초기 활성화
        const activePeriodBtn = document.querySelector(`#periodButtons .day-btn[data-period="${currentPeriod}"]`);
        if (activePeriodBtn) {
            document.querySelectorAll('#periodButtons .day-btn').forEach(b => b.classList.remove('active'));
            activePeriodBtn.classList.add('active');
        }

        // Floating Bubbles dynamic creation
        function createBubbles() {
            const container = document.createElement('div');
            container.className = 'bubble-container';
            document.body.appendChild(container);

            const bubbleCount = 20;
            for (let i = 0; i < bubbleCount; i++) {
                const bubble = document.createElement('div');
                bubble.className = 'bubble';

                // Randomize bubble size (5px to 20px)
                const size = Math.random() * 15 + 5;
                bubble.style.width = `${size}px`;
                bubble.style.height = `${size}px`;

                // Randomize horizontal position
                bubble.style.left = `${Math.random() * 100}vw`;

                // Randomize animation delay and duration
                bubble.style.animationDelay = `${Math.random() * 8}s`;
                bubble.style.animationDuration = `${Math.random() * 12 + 8}s`; // 8s to 20s

                container.appendChild(bubble);
            }
        }


        async function downloadPDF() {
            const element = document.getElementById('seatingDisplay');
            if (!element || element.innerHTML.trim() === "") {
                showAlert("저장할 자리 배치도 데이터가 없습니다.");
                return;
            }

            const opt = {
                margin: 0,
                filename: `2학기_야자배치도_${currentDay}_${currentPeriod}교시.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: {
                    scale: 2,
                    useCORS: true,
                    logging: false,
                    letterRendering: true
                },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
                pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
            };

            showLoading();
            const exportDataDay = currentDay;
            document.body.classList.add('is-exporting-pdf');
            document.body.classList.add(`is-exporting-pdf-${exportDataDay}`);

            try {
                // html2pdf는 전역 객체로 로드됨
                await html2pdf().set(opt).from(element).save();
            } catch (error) {
                console.error("PDF Export Error:", error);
                showAlert("PDF 저장 중 오류가 발생했습니다.");
            } finally {
                document.body.classList.remove('is-exporting-pdf');
                document.body.classList.remove(`is-exporting-pdf-${exportDataDay}`);
                hideLoading();
            }
        }

        renderSeating();



    </script>

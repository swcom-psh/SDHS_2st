<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>야자 자리 배치 프로그램</title>

    <!-- Pretendard Font -->
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            /* 🌊 Summer Ocean Color Theme */
            --primary: #0077b6;
            /* Deep Ocean Blue */
            --primary-dark: #03045e;
            /* Navy Sea */
            --secondary: #e0f2fe;
            /* Foam Blue */

            --bg-canvas: #e0f2fe;
            --card-bg: rgba(255, 255, 255, 0.7);
            /* Glassmorphism translucent */

            --text-main: #0f172a;
            /* Dark slate */
            --text-sub: #334155;
            /* Slate 700 */
            --text-muted: #64748b;
            /* Slate 500 */

            --border: rgba(255, 255, 255, 0.4);
            --border-focus: #0284c7;

            --shadow-sm: 0 4px 12px rgba(3, 4, 94, 0.04);
            --shadow-md: 0 8px 32px rgba(3, 4, 94, 0.08);
            --shadow-lg: 0 16px 40px rgba(3, 4, 94, 0.12);

            --drag-over: rgba(224, 242, 254, 0.8);

            /* Room Summer point colors */
            --room-2-3: #0096c7;
            /* Ocean Blue */
            --room-2-4: #ee9b00;
            /* Sand Gold */
            --room-2-5: #ca6702;
            /* Coral Orange/Pink */
            --room-2-6: #0a9396;
            /* Bright Mint */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Helvetica Neue", "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
            background: linear-gradient(-45deg, #e0f2fe, #bae6fd, #e0f7fa, #b2ebf2, #e0f2fe);
            background-size: 400% 400%;
            animation: oceanWaves 15s ease infinite;
            color: var(--text-main);
            line-height: 1.6;
            padding: 40px 20px;
            letter-spacing: -0.01em;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        @keyframes oceanWaves {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        header {
            max-width: 1300px;
            margin: 0 auto 40px;
            text-align: center;
            padding: 40px 40px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 28px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
            color: var(--text-main);
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            letter-spacing: -0.04em;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        #dayButtons,
        #periodButtons {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            padding: 6px;
            border-radius: 50px;
            gap: 4px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        /* Turn day/period buttons into segment toggles */
        #dayButtons .day-btn,
        #periodButtons .day-btn {
            background: transparent;
            color: var(--text-sub);
            border: none;
            box-shadow: none;
            padding: 10px 20px;
        }

        #dayButtons .day-btn:hover,
        #periodButtons .day-btn:hover {
            color: var(--primary-dark);
            transform: none;
            border-color: transparent;
        }

        #dayButtons .day-btn.active,
        #periodButtons .day-btn.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 10px rgba(0, 119, 182, 0.2);
            font-weight: 800;
            border: none;
        }

        .btn {
            padding: 11px 20px;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            border: 1px solid rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.6);
            color: var(--text-sub);
            font-size: 0.93rem;
            box-shadow: var(--shadow-sm);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.9);
            color: var(--primary-dark);
            border-color: var(--primary);
            transform: translateY(-1px);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            box-shadow: 0 4px 12px rgba(0, 119, 182, 0.2);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, var(--primary-dark) 0%, #02022e 100%);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(3, 4, 94, 0.3);
        }

        .btn-danger {
            background: #FFF5F5;
            color: #E07070;
            border: 1px solid #F5D0D0;
        }

        .btn-danger:hover {
            background: #FFE8E8;
            color: #C05050;
        }

        /* Layout Grid */
        .seating-container {
            max-width: 1300px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 50px;
        }

        .classroom-section {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 36px 40px;
            border-radius: 28px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            transition: all 0.3s ease;
        }

        .classroom-section:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }

        .grid-6x5 {
            display: grid;
            grid-template-columns: 1fr 1fr 40px 1fr 1fr 40px 1fr 1fr;
            row-gap: 14px;
            margin: 28px 0;
        }

        /* 모바일 대응 미디어 쿼리 */
        @media (max-width: 768px) {
            .classroom-section {
                padding: 20px 15px;
                border-radius: 20px;
            }

            .grid-6x5 {
                grid-template-columns: 1fr 1fr 15px 1fr 1fr 15px 1fr 1fr;
                row-gap: 8px;
            }

            .seat {
                border-radius: 12px;
                font-size: 0.75rem;
            }

            .student-id {
                font-size: 0.6rem;
            }

            .student-name {
                font-size: 0.85rem;
                font-weight: 700;
            }

            .room-title {
                font-size: 1.5rem !important;
            }

            .header-left {
                width: 100%;
                margin-bottom: 5px;
            }
        }

        @media (max-width: 480px) {
            .grid-6x5 {
                grid-template-columns: 1fr 1fr 8px 1fr 1fr 8px 1fr 1fr;
                row-gap: 6px;
            }

            .seat {
                border-radius: 8px;
            }
        }

        .seat {
            aspect-ratio: 1 / 1.15;
            border: 1.5px solid rgba(0, 119, 182, 0.15);
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(255, 255, 255, 0.85);
            font-size: 0.85rem;
            position: relative;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
            box-shadow: 0 4px 10px rgba(3, 4, 94, 0.03);
        }

        .seat:not(.empty):hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 8px 20px rgba(3, 4, 94, 0.1);
            border-color: var(--primary);
            z-index: 10;
        }

        .seat.empty {
            border: 1.5px dashed #e9c46a;
            background: rgba(254, 250, 224, 0.55);
            box-shadow: inset 0 2px 4px rgba(233, 196, 106, 0.05);
            cursor: default;
            opacity: 0.85;
        }

        .seat.present {
            border: 2px solid var(--primary);
            background: rgba(224, 242, 254, 0.9);
            box-shadow: 0 4px 12px rgba(0, 119, 182, 0.12);
            color: var(--primary-dark);
            font-weight: 800;
        }

        .seat.present::after {
            display: none;
        }

        .seat.not-in-period {
            background: #f1f5f9 !important;
            border: 1px dashed #cbd5e1 !important;
            opacity: 0.4;
            cursor: not-allowed;
            pointer-events: none;
        }

        .seat.not-in-period .student-name {
            color: #94a3b8;
        }

        .seat.not-in-period::after {
            content: 'N/A';
            position: absolute;
            top: 5px;
            right: 8px;
            font-size: 0.65rem;
            font-weight: 700;
            color: #94a3b8;
        }

        .seat.drag-over {
            background: var(--secondary);
            border-color: var(--primary);
            border-style: solid;
            transform: scale(1.04);
        }

        .teacher-desk {
            width: 55%;
            height: 44px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 12px;
            margin: 20px auto 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-dark);
            font-weight: 800;
            letter-spacing: 0.5em;
            font-size: 1.1rem;
            box-shadow: var(--shadow-sm);
            position: relative;
        }

        .teacher-desk::before {
            content: '⛱️';
            margin-right: 8px;
            font-size: 1.2rem;
            letter-spacing: normal;
        }

        .student-id {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 2px;
            pointer-events: none;
        }

        .student-name {
            font-weight: 800;
            font-size: 1.15rem;
            color: var(--text-main);
            pointer-events: none;
            letter-spacing: -0.04em;
        }

        /* Toast notification */
        #toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--primary-dark);
            color: white;
            padding: 14px 24px;
            border-radius: 12px;
            font-weight: 700;
            box-shadow: var(--shadow-lg);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10000;
            display: flex;
            align-items: center;
            gap: 12px;
            width: fit-content;
            max-width: 90vw;
            white-space: normal;
            word-break: keep-all;
            text-align: center;
            pointer-events: none;
            user-select: none;
        }

        #toast.show {
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 600px) {
            #toast {
                padding: 12px 20px;
                bottom: 30px;
                font-size: 0.9rem;
            }
        }

        .spacer {
            pointer-events: none;
        }

        /* Info text */
        .info-text {
            font-size: 0.88rem;
            color: var(--text-sub);
            background: rgba(224, 242, 254, 0.6);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            padding: 10px 20px;
            border-radius: 50px;
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(255, 255, 255, 0.4);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Attendance List */
        .attendance-container {
            max-width: 1000px;
            margin: 0 auto;
            display: none;
            flex-direction: column;
            gap: 36px;
        }

        .attendance-section {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 32px;
            border-radius: 28px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
        }

        .attendance-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin-top: 16px;
            font-size: 0.95rem;
        }

        .attendance-table th,
        .attendance-table td {
            padding: 14px 16px;
            text-align: center;
            border-bottom: 1px solid var(--table-border);
        }

        .attendance-table th {
            background-color: var(--table-header);
            font-weight: 700;
            color: var(--text-sub);
        }

        .attendance-table tr:last-child td {
            border-bottom: none;
        }

        .attendance-table tr:hover td {
            background-color: var(--table-row-hover);
        }

        .attendance-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: var(--primary);
        }

        .col-num {
            width: 50px;
        }

        .col-id {
            width: 90px;
        }

        .col-name {
            width: 80px;
        }

        .col-check {
            width: 100px;
            white-space: nowrap;
        }

        .col-remark {
            width: auto;
        }

        .attendance-remark {
            width: 100%;
            padding: 10px 12px;
            border: 1.5px solid var(--border);
            border-radius: 20px;
            font-size: 0.95rem;
            transition: all 0.2s;
            background: #FFFBF8;
            color: var(--text-main);
        }

        .attendance-remark:focus {
            border-color: var(--primary);
            background: white;
            outline: none;
            box-shadow: 0 0 0 3px rgba(17, 138, 142, 0.15);
        }

        .view-toggle {
            display: flex;
            gap: 4px;
            margin-bottom: 20px;
            background: var(--primary);
            padding: 6px;
            border-radius: 50px;
            border: none;
            box-shadow: inset 0 2px 6px rgba(11, 110, 113, 0.2);
        }

        .toggle-btn {
            padding: 10px 24px;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            background: transparent;
            color: rgba(255, 255, 255, 0.85);
            transition: all 0.2s;
        }

        .toggle-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: white;
            transform: none;
        }

        .toggle-btn.active {
            background: white;
            color: var(--primary-dark);
            box-shadow: 0 2px 8px rgba(11, 110, 113, 0.3);
            font-weight: 800;
        }

        .gas-config {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 600px;
        }

        .gas-config input {
            flex: 1;
            padding: 8px 16px;
            border-radius: 20px;
            border: 1.5px solid var(--border);
            font-size: 0.9rem;
            background: #FFFBF8;
        }

        .btn-save-sheet {
            margin-top: 20px;
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #7DD9C0 0%, #5CC4AB 100%);
            color: white;
            border: none;
            border-radius: 50px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 14px rgba(93, 196, 170, 0.3);
        }

        .btn-save-sheet:hover {
            filter: brightness(1.05);
            transform: translateY(-1px);
        }

        .btn-save-sheet:disabled {
            background: #D0C8C2;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .classroom-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            gap: 12px;
            flex-wrap: wrap;
        }

        .header-right-btns {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .header-right-btns .btn {
            padding: 6px 12px;
            font-size: 0.85rem;
            white-space: nowrap;
            min-width: auto;
        }

        .btn-past-memo {
            background: #F59E0B !important;
            color: white !important;
            border: none !important;
        }

        .btn-refresh {
            background: var(--card-bg) !important;
            border: 1px solid var(--border) !important;
        }

        .btn-submit {
            background: var(--primary) !important;
            color: white !important;
            border: none !important;
        }

        .header-left {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .room-title {
            font-size: 2.1rem;
            font-weight: 900;
            color: var(--text-main);
            letter-spacing: -0.04em;
            line-height: 1.1;
        }

        .room-notice {
            font-size: 0.82rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .room-meta {
            font-size: 0.92rem;
            font-weight: 700;
            color: white;
            background: linear-gradient(135deg, var(--primary) 0%, #0D6F72 100%);
            padding: 6px 18px;
            border-radius: 50px;
            letter-spacing: -0.01em;
            white-space: nowrap;
            align-self: flex-start;
            box-shadow: 0 3px 10px rgba(232, 115, 154, 0.3);
        }

        /* Room color top-bar accent */
        .classroom-section[data-room="2-3"] {
            border-top: 5px solid var(--room-2-3);
        }

        .classroom-section[data-room="2-4"] {
            border-top: 5px solid var(--room-2-4);
        }

        .classroom-section[data-room="2-5"] {
            border-top: 5px solid var(--room-2-5);
        }

        .classroom-section[data-room="2-6"] {
            border-top: 5px solid var(--room-2-6);
        }

        .room-title.color-2-3 {
            color: var(--room-2-3);
        }

        .room-title.color-2-4 {
            color: var(--room-2-4);
        }

        .room-title.color-2-5 {
            color: var(--room-2-5);
        }

        .room-title.color-2-6 {
            color: var(--room-2-6);
        }

        .print-title {
            display: none;
        }

        /* Loading Overlay */
        #loadingOverlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.85);
            z-index: 10000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 5px solid var(--secondary);
            border-bottom-color: var(--primary);
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
        }

        @keyframes rotation {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        #loadingText {
            margin-top: 20px;
            font-weight: 800;
            color: var(--text-main);
            font-size: 1.1rem;
            letter-spacing: -0.02em;
        }

        /* Custom Modal Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(224, 242, 254, 0.4);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            z-index: 20000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            padding: 32px;
            border-radius: 28px;
            max-width: 450px;
            width: 100%;
            box-shadow: var(--shadow-lg);
            text-align: center;
            animation: modalPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes modalPop {
            0% {
                transform: scale(0.9);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal-message {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 28px;
            line-height: 1.5;
            word-break: keep-all;
        }

        .modal-btns {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .modal-btn {
            padding: 12px 28px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            min-width: 100px;
        }

        .modal-btn-confirm {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(17, 138, 142, 0.3);
        }

        .modal-btn-confirm:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }

        .modal-btn-cancel {
            background: var(--secondary);
            color: var(--primary);
        }

        .modal-btn-cancel:hover {
            background: #D1E5E6;
        }

        /* Print Styles */
        @media print {
            @page {
                size: A4 portrait;
                margin: 0;
            }

            body {
                background: white !important;
                padding: 0 !important;
                margin: 0 !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            #mainApp {
                display: block !important;
                opacity: 1 !important;
                visibility: visible !important;
            }

            header,
            button,
            .controls,
            .view-toggle,
            #toast,
            .info-text,
            .bubble-container,
            .tree-bg,
            .login-overlay,
            .gas-config {
                display: none !important;
            }

            .seating-container {
                gap: 0 !important;
                margin: 0 !important;
                max-width: none !important;
                display: block !important;
            }

            .classroom-section {
                box-shadow: none !important;
                border-radius: 0 !important;
                margin: 0 !important;
                padding: 8mm !important;
                page-break-after: always !important;
                width: 210mm !important;
                height: 297mm !important;
                box-sizing: border-box !important;
                display: flex !important;
                flex-direction: column !important;
                background: white !important;
                border: none !important;

        /* Floating Bubbles Animation */
        .bubble-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }

        .bubble {
            position: absolute;
            bottom: -50px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.25);
            pointer-events: none;
            animation: rise linear infinite;
        }

        @keyframes rise {
            0% {
                transform: translateY(0) translateX(0);
                opacity: 0;
            }

            10% {
                opacity: 0.6;
            }

            90% {
                opacity: 0.6;
            }

            100% {
                transform: translateY(-110vh) translateX(100px);
                opacity: 0;
            }
        }

        /* ====== Memo (Long Press) Feature ====== */
        #memoModal {
            display: none;

            background: rgba(29, 45, 46, 0.6);

        @keyframes modalSlideDown {

        .memo-modal-header {

        .memo-student-info .memo-student-id {

        .memo-textarea {

        @media (max-width: 768px) {
            #memoModal {

        /* 🔄 Background Sync Floating Container & Cards */
        #sync-status-container {
            position: fixed;

        .sync-toast {

            border-radius: 12px;

            transform: translateY(0);
            opacity: 1;

        .sync-toast.fade-out {
            transform: translateY(-20px);
            opacity: 0;
        }

        .sync-toast .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid var(--border);
            border-top: 2px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;

        .sync-toast .icon-success {
            color: #10B981;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .sync-toast .icon-error {
            color: #EF4444;
            font-weight: bold;
            font-size: 1.1rem;
        }

            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-main);
        }

        /* 💾 Temporary Success Button style */
        .btn-success-temp {
            background: #10B981 !important;
            color: white !important;
            border-color: #10B981 !important;
        }
    </style>
</head>

<body>
    <div id="loginOverlay" class="login-overlay">
        <div class="login-box">
            <h2>🌴 야자 감독 교사 로그인 🛟</h2>
            <div style="color: var(--text-sub); font-size: 0.95rem; margin-bottom: 10px; word-break: keep-all;">
                출석부에 기록될 감독 선생님 성함을 입력해주세요.
            </div>
            <input type="text" id="teacherNameInput" placeholder="이름 입력 (예: 홍길동)"
                onkeypress="if(event.key==='Enter') handleLogin()">
            <button class="btn btn-primary" onclick="handleLogin()">출석부 시작하기</button>
        </div>
    </div>

    <div id="customModal" class="modal-overlay">
        <div class="modal-content">
            <div id="modalMessage" class="modal-message"></div>
            <div id="modalBtns" class="modal-btns">
                <button id="modalCancel" class="modal-btn modal-btn-cancel">취소</button>
                <button id="modalConfirm" class="modal-btn modal-btn-confirm">확인</button>
            </div>
        </div>
    </div>

    <!-- Memo Modal for Long Press -->
    <div id="memoModal" onclick="if(event.target===this) closeMemoModal()">
        <div class="memo-modal-content">
            <div class="memo-modal-header">
                <span class="memo-icon">📝</span>
                <span class="memo-title">결석 사유 메모</span>
            </div>
            <div class="memo-student-info">
                <span class="memo-student-name" id="memoStudentName"></span>
                <span class="memo-student-id" id="memoStudentId"></span>
            </div>
            <div id="memoDateContainer" style="display: none; margin-bottom: 10px; width: 100%;">
                <label for="memoDatePicker"
                    style="font-size: 0.85rem; color: var(--text-sub); font-weight: 700; margin-bottom: 4px; display: block;">과거
                    메모 날짜 선택 (구글 시트 기록용)</label>
                <input type="date" id="memoDatePicker"
                    style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); font-family: inherit; font-size: 1rem; color: var(--text-main);">
            </div>
            <textarea class="memo-textarea" id="memoTextarea" placeholder="결석 사유를 입력하세요 (예: 체험학습, 병결 등)"></textarea>
            <div class="memo-modal-btns">
                <button class="memo-btn-cancel" onclick="closeMemoModal()">취소</button>
                <button class="memo-btn-clear" id="memoBtnClear" onclick="clearMemo()">삭제</button>
                <button class="memo-btn-save" id="memoBtnSave" onclick="saveMemo()">저장</button>
            </div>
        </div>
    </div>

    <div id="mainApp" style="display: none;">

        <header>
            <h1>🌊 2026학년도 2학년 1학기 자기주도적 학습 자리 배치도 🏖️ <small
                    style="font-size: 0.6rem; opacity: 0.7; vertical-align: middle;">MadeBy 박상현T</small></h1>
            <div class="controls">
                <div class="btn-group" id="dayButtons">
                    <button class="btn day-btn active" data-day="월">월요일</button>
                    <button class="btn day-btn" data-day="화">화요일</button>
                    <button class="btn day-btn" data-day="수">수요일</button>
                    <button class="btn day-btn" data-day="목">목요일</button>
                    <button class="btn day-btn" data-day="금">금요일</button>
                </div>
                <div class="btn-group" id="periodButtons">
                    <button class="btn day-btn active" data-period="1" onclick="selectPeriod(this)">1교시</button>
                    <button class="btn day-btn" data-period="2" onclick="selectPeriod(this)">2교시</button>
                </div>
                <div class="btn-group">
                    <button class="btn btn-primary" onclick="downloadPDF()">📄 PDF 저장하기</button>
                    <!-- 배치 및 출석 초기화 버튼 제거됨 (사용자 요청) -->
                </div>

                <input type="hidden" id="gasUrl"
                    value="https://script.google.com/macros/s/AKfycby4opXfNbOGVjC0rnBPg2XoiJiDllGbnrabI-DZ7kqc7qi0IqxNI2mB-lqlIo6APWTM/exec">
                <input type="hidden" id="gasBackupUrl"
                    value="https://script.google.com/macros/s/AKfycby4opXfNbOGVjC0rnBPg2XoiJiDllGbnrabI-DZ7kqc7qi0IqxNI2mB-lqlIo6APWTM/exec">
                <div class="info-text"
                    style="display: flex; flex-wrap: wrap; justify-content: space-between; width: 100%;">
                    <div style="display: flex; gap: 8px;">
                        <span>💡</span>
                        <span>학생 출결 체크 후 반드시 '출결 결과 시트 전송' 버튼을 눌러주세요.</span>
                        <span>학생을 선택하는 것이 출석입니다</span>
                        <button class="btn" style="padding:4px 12px; font-size:0.8rem; height: 28px; line-height: 1;"
                            onclick="refreshStudentList()">명단 갱신</button>
                    </div>
                    <div
                        style="font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 10px; margin-left: auto;">
                        👤 <span id="displaySupervisorName"></span> 선생님
                        <button onclick="handleLogout()"
                            style="background: white; border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; font-size: 0.8rem; cursor: pointer; color: var(--text-main); font-weight: 600; box-shadow: var(--shadow-sm); transition: all 0.2s;">로그아웃</button>
                    </div>
                </div>
            </div>
        </header>

        <div class="seating-container active" id="seatingDisplay"></div>
        <div id="toast"><span>✅</span> 배치 정보가 자동 저장되었습니다.</div>
    </div> <!-- Close mainApp -->

    <div id="loadingOverlay">
        <div class="loader"></div>
        <div id="loadingText">출석 정보를 동기화하고 있습니다...</div>
    </div>

    <script>
        let supervisorName = sessionStorage.getItem('yajaSupervisor') || '';
        let allowedTeachers = []; // 구글 시트에서 받아올 동적 명단 (v20)
        let teacherListPromise = null;
        let studentListPromise = null;

        function showLoading(type = 'init', text) {
            const overlay = document.getElementById('loadingOverlay');
            if (!overlay) return;

            if (text) {
                document.getElementById('loadingText').innerText = text;
            } else {
                const messages = type === 'upload' ? uploadLoadingMessages : initLoadingMessages;
                const randomMsg = messages[Math.floor(Math.random() * messages.length)];
                document.getElementById('loadingText').innerText = randomMsg;
            }
            overlay.style.display = 'flex';
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').style.display = 'none';
        }

        function cleanupOldCache() {
            const todayStr = getTodayDateString();
            const keysToRemove = [];
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && (key.startsWith('att_') || key.startsWith('rem_') || key.startsWith('sup_') || key.startsWith('synced_') || key.startsWith('initial_att_') || key.startsWith('initial_rem_'))) {
                    if (!key.includes(todayStr)) {
                        keysToRemove.push(key);
                    }
                }
            }
            keysToRemove.forEach(k => localStorage.removeItem(k));
        }

        function loadGlobalDataFromCache() {
            const cached = localStorage.getItem('yajaStudentList');
            if (cached) {
                try {
                    globalData = JSON.parse(cached);
                    if (Array.isArray(globalData) && globalData.length > 0) return true;
                } catch (e) {
                    localStorage.removeItem('yajaStudentList');
                }
            }
            return false;
        }

        function loadTeacherListFromCache() {
            const cached = localStorage.getItem('yajaTeacherList');
            if (cached) {
                try {
                    allowedTeachers = JSON.parse(cached);
                    if (Array.isArray(allowedTeachers) && allowedTeachers.length > 0) return true;
                } catch (e) {
                    localStorage.removeItem('yajaTeacherList');
                }
            }
            return false;
        }

        async function revalidateDataInBackground() {
            try {
                await Promise.all([fetchTeacherList(), fetchGlobalData(true)]);
                if (supervisorName && document.getElementById('mainApp').style.display === 'block') {
                    renderSeating();
                }
            } catch (e) {
                console.error("백그라운드 동기화 실패:", e);
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            cleanupOldCache();
            const hasStudents = loadGlobalDataFromCache();
            loadTeacherListFromCache();
            SyncManager.init();
            createBubbles();

            if (supervisorName) {
                if (hasStudents) {
                    await startAppSession(supervisorName, false);
                } else {
                    showLoading('init', "학생 명단을 불러오는 중...");
                    await fetchGlobalData(true);
                    await startAppSession(supervisorName, true);
                }
            } else {
                hideLoading();
            }

            revalidateDataInBackground();
        });

        async function startAppSession(name) {
            supervisorName = name;
            sessionStorage.setItem('yajaSupervisor', supervisorName);
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            document.getElementById('displaySupervisorName').innerText = supervisorName;

            // 이미 초기 로딩(DOMContentLoaded)에서 데이터를 다 가져왔으므로
            // 여기서는 별도의 로딩 없이 즉시 렌더링만 진행합니다.
            renderSeating();

            // 로딩창 닫기
            hideLoading();
        }

        async function handleLogin() {
            const nameInput = document.getElementById('teacherNameInput').value.trim();

            if (!nameInput) {
                showAlert('감독 교사 성함을 입력해주세요.');
                return;
            }

            // 교사 명단이 아직 로드 안됐으면 대기
            if (allowedTeachers.length === 0) {
                showLoading('init', "교사 명단을 확인하는 중...");
                await fetchTeacherList();
                hideLoading();
            }

            if (allowedTeachers.length === 0) {
                showAlert('인터넷 연결이 원활하지 않거나 구글 시트 주소가 올바르지 않아 교사 명단을 불러올 수 없습니다.\n인터넷 연결을 확인한 후 다시 시도해 주세요.');
                return;
            }

            if (!allowedTeachers.includes(nameInput)) {
                showAlert('등록되지 않은 선생님입니다. 입력하신 성함을 다시 한 번 확인해주세요.');
                return;
            }

            // 학생 데이터가 아직 없는 경우에만 로딩 (보통은 초기화에서 이미 로드 완료)
            if (globalData.length === 0) {
                showLoading('init', "학생 명단을 불러오는 중...");
                const success = await fetchGlobalData(true);
                if (!success) {
                    hideLoading();
                    showAlert('구글 시트에서 학생 명단을 가져오는 데 실패했습니다.');
                    return;
                }
            }

            await startAppSession(nameInput, true);
        }


        async function fetchTeacherList() {
            if (teacherListPromise) return teacherListPromise;

            const gasUrl = document.getElementById('gasUrl').value.trim();
            if (!gasUrl) return;

            teacherListPromise = (async () => {
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 20000); // 20초 제한

                    const response = await fetch(`${gasUrl}?action=getTeachers`, { signal: controller.signal });
                    clearTimeout(timeoutId);

                    const names = await response.json();
                    if (Array.isArray(names)) {
                        allowedTeachers = names;
                        localStorage.setItem('yajaTeacherList', JSON.stringify(allowedTeachers));
                        console.log("감독 교사 명단 로드 완료:", allowedTeachers.length, "명");
                    }
                } catch (e) {
                    console.error("Fetch teachers error:", e);
                } finally {
                    teacherListPromise = null;
                }
            })();

            return teacherListPromise;
        }

        async function handleLogout() {
            showConfirm('로그아웃 하시겠습니까?', () => {
                sessionStorage.removeItem('yajaSupervisor');
                // 로그아웃 시 보안을 위해 학생 명단 캐시도 삭제할 수 있지만, 
                // 속도를 위해 남겨두는 편이 좋습니다. (필요 시 아래 주석 해제)
                // localStorage.removeItem('yajaStudentList');
                supervisorName = '';
                document.getElementById('teacherNameInput').value = '';
                document.getElementById('loginOverlay').style.display = 'flex';
                document.getElementById('mainApp').style.display = 'none';
            });
        }

        async function refreshStudentList() {
            showLoading('init', "최신 데이터를 불러오고 있습니다...");
            const success = await fetchGlobalData(true); // 강제 새로고침
            await fetchAllTodayAttendance(true, true); // 출결 데이터도 서버에서 새로 동기화
            hideLoading();
            if (success) {
                showToast("데이터가 성공적으로 갱신되었습니다.");
                renderSeating();
            } else {
                showAlert("명단 갱신에 실패했습니다. 인터넷 연결을 확인해주세요.");
            }
        }
        // 시트 데이터 캐싱 로직
        let globalData = [];

        async function fetchGlobalData(force = false) {
            // 강제 갱신이 아니고 캐시가 존재하면 캐시 데이터 사용 (속도 향상)
            if (!force) {
                const cached = localStorage.getItem('yajaStudentList');
                if (cached) {
                    try {
                        globalData = JSON.parse(cached);
                        if (Array.isArray(globalData) && globalData.length > 0) {
                            console.log("캐시된 학생 명단 로드 완료:", globalData.length, "명");
                            return true;
                        }
                    } catch (e) {
                        localStorage.removeItem('yajaStudentList');
                    }
                }
            }

            if (studentListPromise) return studentListPromise;

            const gasUrl = document.getElementById('gasUrl').value.trim();
            if (!gasUrl) return false;

            studentListPromise = (async () => {
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 20000); // 20초 제한

                    const response = await fetch(`${gasUrl}?action=getStudents`, { signal: controller.signal });
                    clearTimeout(timeoutId);

                    const data = await response.json();
                    if (Array.isArray(data)) {
                        if (data.length === 0) {
                            print("서버에서 빈 명단을 반환했습니다.")
                            return false;
                        }

                        globalData = data.map(s => {
                            const obj = {};
                            for (let key in s) {
                                const cleanKey = String(key).trim();
                                obj[cleanKey] = (s[key] === null || s[key] === undefined) ? "" : String(s[key]).trim();
                            }
                            return obj;
                        });

                        localStorage.setItem('yajaStudentList', JSON.stringify(globalData));
                        console.log("학생 명단 서버 로드 완료:", globalData.length, "명");

                        return true;
                    }
                } catch (e) {
                    console.error("Fetch students error:", e);
                    if (!localStorage.getItem('yajaStudentList')) {
                        showAlert("서버에서 학생 명단을 가져오는 데 실패했습니다.");
                    }
                } finally {
                    studentListPromise = null;
                }
                return false;
            })();

            return studentListPromise;
        }

        // 오늘 요일 자동 감지 및 초기값 설정
        const daysMap = ['일', '월', '화', '수', '목', '금', '토'];
        const todayIdx = new Date().getDay();
        const initialDay = (todayIdx >= 1 && todayIdx <= 5) ? daysMap[todayIdx] : '월';

        let currentDay = initialDay;
        let currentPeriod = '1';

        function selectPeriod(btn) {
            document.querySelectorAll('#periodButtons [data-period]').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentPeriod = btn.dataset.period;
            renderSeating();
        }

        document.querySelectorAll('#dayButtons .day-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('#dayButtons .day-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentDay = btn.dataset.day;
                renderSeating();
            });
        });

        function getRoomStudents(day) {
            const col1 = `${day}1`;
            const col2 = `${day}2`;
            const overrideCol = `${day}_배정`;

            // 1. 방 리스트 초기화
            const roomLists = { '2-3': [], '2-4': [], '2-5': [], '2-6': [] };
            const unassignedStudents = [];

            // 2. 수동 배정(Override) 우선 처리
            globalData.forEach(s => {
                const manualRoom = s[overrideCol];
                const hasP1 = s[col1] && String(s[col1]).trim() !== '';
                const hasP2 = s[col2] && String(s[col2]).trim() !== '';

                if (manualRoom && roomLists[manualRoom]) {
                    roomLists[manualRoom].push(s);
                } else {
                    // 수동 배정이 없는 경우, 1/2교시 중 하나라도 출석 번호가 있으면 미배정 목록에 추가
                    if (hasP1 || hasP2) {
                        unassignedStudents.push(s);
                    }
                }
            });

            // 3. 미배정 학생들을 참여 시간(P1/P2/Both)에 따라 기본 그룹화
            // (1 대신 실제 번호 값이 있으면 참여하는 것으로 간주)
            let bothP = unassignedStudents.filter(s => (s[col1] && String(s[col1]).trim() !== '') && (s[col2] && String(s[col2]).trim() !== '')).sort((a, b) => Number(a.학번) - Number(b.학번));
            let p1Only = unassignedStudents.filter(s => (s[col1] && String(s[col1]).trim() !== '') && !(s[col2] && String(s[col2]).trim() !== '')).sort((a, b) => Number(a.학번) - Number(b.학번));
            let p2Only = unassignedStudents.filter(s => !(s[col1] && String(s[col1]).trim() !== '') && (s[col2] && String(s[col2]).trim() !== '')).sort((a, b) => Number(a.학번) - Number(b.학번));

            // 4. 일반 자동 배정 (피리오드에 따라 반 할당)
            roomLists['2-5'].push(...p1Only);
            roomLists['2-6'].push(...p2Only);

            // 5. 양쪽 시간대(bothP) 학생들을 2-3, 2-4반에 균등 분할
            const half = Math.ceil(bothP.length / 2);
            roomLists['2-3'].push(...bothP.slice(0, half));
            roomLists['2-4'].push(...bothP.slice(half));

            // 6. 모든 방 명단 학번 순 정렬 마무리
            Object.keys(roomLists).forEach(room => {
                roomLists[room].sort((a, b) => Number(a.학번) - Number(b.학번));
            });

            return roomLists;
        }

        // ====== Background Sync Manager (v23) ======
        const SyncManager = {
            queue: [],
            isProcessing: false,
            beforeUnloadHandlerBound: false,

            init() {
                // 1. localStorage에서 저장된 미전송 큐 로드
                const stored = localStorage.getItem('yajaSyncQueue');
                if (stored) {
                    try {
                        this.queue = JSON.parse(stored);
                        // 혹시 남아있을 수 있는 'processing' 상태를 'pending'으로 복구
                        this.queue.forEach(item => {
                            if (item.status === 'processing') {
                                item.status = 'pending';
                            }
                        });
                        console.log("미전송 백그라운드 큐 로드 완료:", this.queue.length, "건");
                    } catch (e) {
                        localStorage.removeItem('yajaSyncQueue');
                    }
                }

                // 2. UI 초기화 및 프로세스 시작
                this.updateUI();
                if (this.queue.length > 0) {
                    this.processQueue();
                }
            },

            saveQueue() {
                localStorage.setItem('yajaSyncQueue', JSON.stringify(this.queue));
                this.checkBeforeUnload();
            },

            checkBeforeUnload() {
                const hasPending = this.queue.some(item => item.status === 'pending' || item.status === 'processing');
                if (hasPending && !this.beforeUnloadHandlerBound) {
                    window.addEventListener('beforeunload', this.beforeUnloadListener);
                    this.beforeUnloadHandlerBound = true;
                } else if (!hasPending && this.beforeUnloadHandlerBound) {
                    window.removeEventListener('beforeunload', this.beforeUnloadListener);
                    this.beforeUnloadHandlerBound = false;
                }
            },

            beforeUnloadListener(e) {
                const message = "현재 출결 시트 전송이 백그라운드에서 진행 중입니다. 페이지를 닫으시면 전송이 중단될 수 있습니다.";
                e.returnValue = message;
                return message;
            },

            add(roomName, payload) {
                const id = Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                const item = {
                    id,
                    roomName,
                    payload,
                    status: 'pending',
                    retries: 0
                };

                // 동일 학급/교시의 이전 요청이 있다면 상태에 관계없이 제거하고 최신 것으로 대체 (중복 전송 방지)
                this.queue = this.queue.filter(q => !(q.roomName === roomName && q.payload.period === payload.period));

                this.queue.push(item);
                this.saveQueue();
                this.updateUI();
                this.processQueue();
            },

            async processQueue() {
                if (this.isProcessing) return;
                this.isProcessing = true;

                while (this.queue.some(item => item.status === 'pending')) {
                    const item = this.queue.find(item => item.status === 'pending');
                    if (!item) break;

                    item.status = 'processing';
                    this.saveQueue();
                    this.updateUI();

                    try {
                        const gasUrl = document.getElementById('gasUrl').value.trim();
                        if (!gasUrl) throw new Error("GAS URL이 비어있습니다.");

                        const controller = new AbortController();
                        const timeoutId = setTimeout(() => controller.abort(), 15000); // 15초 제한

                        await fetch(gasUrl, {
                            method: 'POST',
                            mode: 'no-cors',
                            body: JSON.stringify(item.payload),
                            signal: controller.signal
                        });

                        clearTimeout(timeoutId);

                        // 전송 성공 처리
                        item.status = 'success';
                        const dateStr = getTodayDateString();
                        const periodNum = item.payload.period.replace('교시', '');
                        localStorage.setItem(`synced_${dateStr}_${item.payload.day}_${periodNum}_${item.roomName}`, 'true');

                        // 동기화 완료 토스트 업데이트 후 3초 뒤에 제거
                        this.saveQueue();
                        this.updateUI();

                        const toastId = item.id;
                        setTimeout(() => {
                            this.queue = this.queue.filter(q => q.id !== toastId);
                            this.saveQueue();
                            this.updateUI();
                        }, 3000);

                    } catch (e) {
                        console.error("Sync failed for room:", item.roomName, e);
                        item.retries++;
                        if (item.retries >= 3) {
                            item.status = 'failed';
                            this.saveQueue();
                            this.updateUI();
                            showAlert(`${item.roomName}반 출결 시트 전송에 실패했습니다.\n네트워크 연결을 확인한 후 다시 시도해 주세요.`);

                            // 8초 후 큐에서 제거
                            const toastId = item.id;
                            setTimeout(() => {
                                this.queue = this.queue.filter(q => q.id !== toastId);
                                this.saveQueue();
                                this.updateUI();
                            }, 8000);
                        } else {
                            // 대기 상태로 되돌려 다음 루프에서 재시도 하도록 유도
                            item.status = 'pending';
                            this.saveQueue();
                            this.updateUI();
                            // 재시도 대기 (2초 후)
                            await new Promise(resolve => setTimeout(resolve, 2000));
                        }
                    }
                }

                this.isProcessing = false;
                this.checkBeforeUnload();
            },

            updateUI() {
                let container = document.getElementById('sync-status-container');
                if (!container) {
                    container = document.createElement('div');
                    container.id = 'sync-status-container';
                    document.body.appendChild(container);
                }

                const activeItems = this.queue.filter(item => ['pending', 'processing', 'success', 'failed'].includes(item.status));

                container.innerHTML = '';
                activeItems.forEach(item => {
                    const toast = document.createElement('div');
                    toast.className = 'sync-toast show';
                    toast.id = `toast_${item.id}`;

                    let iconHtml = '';
                    let textHtml = '';

                    if (item.status === 'pending' || item.status === 'processing') {
                        iconHtml = '<div class="spinner"></div>';
                        textHtml = `<span class="text">${item.roomName}반 전송 중...</span>`;
                    } else if (item.status === 'success') {
                        iconHtml = '<span class="icon-success">✓</span>';
                        textHtml = `<span class="text" style="color: #10B981;">${item.roomName}반 전송 완료!</span>`;
                    } else if (item.status === 'failed') {
                        iconHtml = '<span class="icon-error">✗</span>';
                        textHtml = `<span class="text" style="color: #EF4444;">${item.roomName}반 전송 실패 (다시 시도)</span>`;
                    }

                    toast.innerHTML = `${iconHtml}${textHtml}`;
                    container.appendChild(toast);
                });

                // 각 자습실의 시트 전송 버튼 상태 동기화
                const rooms = ['2-3', '2-4', '2-5', '2-6'];
                rooms.forEach(roomName => {
                    const submitBtn = document.querySelector(`.classroom-section[data-room="${roomName}"] .btn-submit`);
                    if (submitBtn) {
                        const isSyncing = this.queue.some(item => item.roomName === roomName && (item.status === 'pending' || item.status === 'processing'));
                        if (isSyncing) {
                            submitBtn.disabled = true;
                            submitBtn.classList.add('btn-success-temp');
                            submitBtn.innerHTML = '✅ 전송 요청됨';
                        } else {
                            submitBtn.disabled = false;
                            submitBtn.classList.remove('btn-success-temp');
                            submitBtn.innerHTML = '💾 시트 전송';
                        }
                    }
                });
            }
        };

        async function saveRoomAttendanceToSheet(roomName) {
            const gasUrl = document.getElementById('gasUrl').value.trim();
            if (!gasUrl) return;

            const dMap = ['일', '월', '화', '수', '목', '금', '토'];
            const actualToday = dMap[new Date().getDay()];

            if (currentDay !== actualToday) {
                showAlert(`${actualToday}요일 데이터만 시트 전송이 가능합니다.\n현재 선택된 요일(${currentDay}요일)은 전송할 수 없습니다.`);
                return;
            }

            const roomStudents = getRoomStudents(currentDay)[roomName];
            const activeStudents = roomStudents.filter(s => s[`${currentDay}${currentPeriod}`] && String(s[`${currentDay}${currentPeriod}`]).trim() !== '');

            if (activeStudents.length === 0) {
                showAlert(`${roomName}반에 ${currentPeriod}교시 참여 학생이 없습니다.`);
                return;
            }

            const dateStr = getTodayDateString();

            let isAnyStatusChanged = false;
            activeStudents.forEach(s => {
                const attKey = `att_${dateStr}_${currentDay}_${currentPeriod}_${s.학번}`;
                const attVal = localStorage.getItem(attKey);
                const isPresent = (attVal === 'true' || attVal === 'TRUE' || attVal === true || attVal === '출석');
                const initialStatus = localStorage.getItem(`initial_att_${dateStr}_${currentDay}_${currentPeriod}_${s.학번}`);

                if (initialStatus !== null) {
                    const currentStatusStr = isPresent ? 'true' : 'false';
                    const initialStatusStr = (initialStatus === 'true' || initialStatus === '출석') ? 'true' : 'false';
                    if (currentStatusStr !== initialStatusStr) isAnyStatusChanged = true;
                }
            });

            const currentSup = (typeof supervisorName !== 'undefined' && supervisorName) ? supervisorName : "선생님";
            const existingRoomSup = localStorage.getItem(`sup_${dateStr}_${currentDay}_${currentPeriod}_${roomName}`);
            const batchSupervisor = (isAnyStatusChanged || !existingRoomSup || existingRoomSup === "선생님") ? currentSup : existingRoomSup;

            const studentsData = activeStudents.map(s => {
                const attKey = `att_${dateStr}_${currentDay}_${currentPeriod}_${s.학번}`;
                const attVal = localStorage.getItem(attKey);
                const isPresent = (attVal === 'true' || attVal === 'TRUE' || attVal === true || attVal === '출석');
                const remark = localStorage.getItem(`rem_${dateStr}_${currentDay}_${currentPeriod}_${s.학번}`) || "";

                return {
                    id: s.학번,
                    name: s.이름,
                    status: isPresent,
                    remark: remark,
                    supervisor: batchSupervisor
                };
            });

            const payload = {
                type: "bulk",
                date: dateStr,
                day: currentDay,
                period: currentPeriod + '교시',
                room: roomName,
                supervisor: batchSupervisor,
                students: studentsData
            };

            // 버튼 즉시 성공 상태 변경 피드백
            const submitBtn = document.querySelector(`.classroom-section[data-room="${roomName}"] .btn-submit`);
            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.classList.add('btn-success-temp');
                submitBtn.innerHTML = '✅ 전송 요청됨';
            }

            // SyncManager에 위임하여 백그라운드 전송 실행
            SyncManager.add(roomName, payload);
        }

        // ====== Memo (Long Press) Feature ======

        function saveMemo() {

            const text = document.getElementById('memoTextarea').value.trim();
            const dateStr = getTodayDateString();
            const remarkKey = `rem_${dateStr}_${memoCurrentDay}_${memoCurrentPeriod}_${memoCurrentStudentId}`;

        async function sendBulkPastMemos(roomName) {
            const dMap = ['일', '월', '화', '수', '목', '금', '토'];
            const actualToday = dMap[new Date().getDay()];
            if (currentDay === actualToday) return;

            const dateStr = getTodayDateString();
            const prefix = `rem_${dateStr}_${currentDay}_${currentPeriod}_`;
            const datePrefix = `past_date_${currentDay}_${currentPeriod}_`;

            const memosToSend = [];

            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.startsWith(prefix)) {
                    const studentId = key.split('_').pop();
                    const text = localStorage.getItem(key);
                    const pastDate = localStorage.getItem(datePrefix + studentId);

                    if (text && pastDate) {
                        const studentObj = globalData.find(s => String(s['학번']) === String(studentId));
                        if (!studentObj) continue;

                        const attKey = `att_${dateStr}_${currentDay}_${currentPeriod}_${studentId}`;
                        const isChecked = (localStorage.getItem(attKey) === 'true');
                        if (isChecked) {
                            showAlert(`${studentObj['이름']} 학생의 출결 기록이 변경되어 있습니다.\n지난 과거의 출결 기록은 앱에서 변경할 수 없습니다.\n체크를 해제하고 시트에서 직접 변경해주세요.`);
                            return;
                        }

                        memosToSend.push({
                            date: pastDate,
                            day: currentDay,
                            period: currentPeriod + '교시',
                            room: roomName,
                            supervisor: (typeof supervisorName !== 'undefined' && supervisorName) ? supervisorName : "선생님",
                            student: {
                                id: studentId,
                                name: studentObj['이름'],
                                remark: text,
                                status: false
                            }
                        });
                    }
                }
            }

            if (memosToSend.length === 0) {
                showAlert("전송할 과거 메모가 없습니다. 먼저 학생을 꾹 눌러 메모를 저장해주세요.");
                return;
            }

            const gasUrl = document.getElementById('gasUrl').value.trim();
            if (!gasUrl) return;

            const payload = {
                type: "past_memos",
                memos: memosToSend
            };

            showLoading('upload', "과거 메모 일괄 전송 중...");
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 20000); // 20초 제한

                await fetch(gasUrl, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify(payload),
                    signal: controller.signal
                });

                clearTimeout(timeoutId);
                showToast(`총 ${memosToSend.length}건의 과거 메모가 시트로 안전하게 전송되었습니다.`);
                // 성공 후에도 로컬 데이터를 냅두어 시각적으로 유지되도록 함
            } catch (error) {
                console.error(error);
                if (error.name === 'AbortError') {
                    showAlert("과거 메모 전송 시간이 초과되었습니다. 네트워크 연결을 확인한 후 다시 시도해 주세요.");
                } else {
                    showAlert("전송 중 오류가 발생했습니다. 다시 시도해 주세요.");
                }
            } finally {
                hideLoading();
            }
        }

        /**
         * 좌석에 롱프레스(꾹 누르기) 이벤트를 설정합니다.
         * - 짧게 누르면: 출석/결석 토글 (기존 기능)
         * - 길게 누르면 (500ms): 메모 입력 모달 표시
         */
        let lastTouchTime = 0;

        function setupLongPress(seatElement, studentId, studentName, attKey) {
            let pressTimer = null;
            let isLong = false;
            let isMoved = false;
            let startX = 0, startY = 0;

            seatElement.style.touchAction = 'pan-y';

            const startPress = (x, y, isTouch = false) => {
                if (!isTouch && Date.now() - lastTouchTime < 500) return; // 마우스-터치 중복 발화 방지

                isLong = false;
                isMoved = false;
                startX = x;
                startY = y;

                if (pressTimer) clearTimeout(pressTimer);
                pressTimer = setTimeout(() => {
                    if (isMoved) return;
                    isLong = true;
                    if (navigator.vibrate) navigator.vibrate(50);
                    const roomName = seatElement.closest('.classroom-section').dataset.room;
                    openMemoModal(studentId, studentName, currentDay, currentPeriod, roomName);
                }, 600); // 500ms -> 600ms로 약간 여유있게
            };

            const cancelPress = () => {
                clearTimeout(pressTimer);
            };

            const endPress = (isTouch = false) => {
                if (!isTouch && Date.now() - lastTouchTime < 500) return;
                if (isTouch) lastTouchTime = Date.now();

                clearTimeout(pressTimer);

                if (!isLong && !isMoved) {
                    const attVal = localStorage.getItem(attKey);
                    const nowPresent = (attVal === 'true' || attVal === 'TRUE' || attVal === true);
                    localStorage.setItem(attKey, !nowPresent);
                    seatElement.classList.toggle('present', !nowPresent);
                }
                isLong = false;
                isMoved = false;
            };

            // Touch events (mobile)
            seatElement.addEventListener('touchstart', (e) => {
                const touch = e.touches[0];
                startPress(touch.clientX, touch.clientY, true);
            }, { passive: true });

            seatElement.addEventListener('touchmove', (e) => {
                const touch = e.touches[0];
                const dx = Math.abs(touch.clientX - startX);
                const dy = Math.abs(touch.clientY - startY);
                // 판별 임계값을 20px로 상향 (너무 민감하지 않게)
                if (dx > 20 || dy > 20) {
                    isMoved = true;
                    cancelPress();
                }
            }, { passive: true });

            seatElement.addEventListener('touchend', (e) => {
                endPress(true);
            });

            // Mouse events (desktop)
            seatElement.addEventListener('mousedown', (e) => {
                if (e.button !== 0) return;
                startPress(e.clientX, e.clientY, false);
            });

            seatElement.addEventListener('mousemove', (e) => {
                if (!pressTimer && !isMoved) return;
                const dx = Math.abs(e.clientX - startX);
                const dy = Math.abs(e.clientY - startY);
                if (dx > 20 || dy > 20) {
                    isMoved = true;
                    cancelPress();
                }
            });

            seatElement.addEventListener('mouseup', (e) => {
                if (e.button !== 0) return;
                endPress(false);
            });

            seatElement.addEventListener('mouseleave', () => {
                cancelPress();
                isMoved = false;
            });
            seatElement.addEventListener('contextmenu', (e) => e.preventDefault());
        }

        function fillZigzag(grid, students) {
            let sIdx = 0;
            for (let row = 4; row >= 0; row--) {
                for (let col = 0; col < 6; col++) {
                    const idx = row * 6 + col;
                    if (!grid[idx] && (row + col) % 2 === 0 && sIdx < students.length) grid[idx] = students[sIdx++];
                }
            }
            if (sIdx < students.length) {
                for (let row = 4; row >= 0; row--) {
                    for (let col = 0; col < 6; col++) {
                        const idx = row * 6 + col;
                        if (!grid[idx] && sIdx < students.length) grid[idx] = students[sIdx++];
                    }
                }
            }
        }

        function getTodayDateString() {
            // "2026. 3. 19." 형식으로 통일 (끝에 점 포함)
            const d = new Date();
            return `${d.getFullYear()}. ${d.getMonth() + 1}. ${d.getDate()}.`;
        }

        const fetchingRooms = new Set();
        /**
         * 시트에서 출석 데이터를 가져오는 함수
         * @param {string} roomName - 반 이름
         * @param {Object} options - { silent: 로딩창 숨김 여부, day: 명시적 요일, period: 명시적 교시 }
         */
        async function fetchAttendanceFromSheet(roomName, options = {}) {
            const { silent = false, day = currentDay, period = currentPeriod, force = false } = options;
            const gasUrl = document.getElementById('gasUrl').value.trim();
            if (!gasUrl) return;

            const dateStr = getTodayDateString();
            const fetchId = `${dateStr}_${day}_${period}_${roomName}`;

            // 이미 요청 중이면 중복 방지
            if (fetchingRooms.has(fetchId)) return;

            const cacheKey = `synced_${fetchId}`;
            if (!force && localStorage.getItem(cacheKey)) return;

            fetchingRooms.add(fetchId);
            const refreshBtn = document.querySelector(`.classroom-section[data-room="${roomName}"] .btn-refresh`);
            if (refreshBtn && force) {
                refreshBtn.disabled = true;
                refreshBtn.innerHTML = '🔄 로딩 중...';
            }

            // 🟢 초록색 불러오는 중 표시 활성화 (자동으로 구글 시트에서 가져올 때만 표시)
            const indicator = document.querySelector(`.classroom-section[data-room="${roomName}"] .sync-loading-indicator`);
            if (indicator && !force) {
                indicator.style.display = 'inline-flex';
            }

            try {
                const url = `${gasUrl}${gasUrl.includes('?') ? '&' : '?'}date=${encodeURIComponent(dateStr)}&day=${encodeURIComponent(day)}&period=${encodeURIComponent(period + '교시')}&room=${encodeURIComponent(roomName)}`;

                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 20000); // 20초 제한

                const response = await fetch(url, { signal: controller.signal });
                clearTimeout(timeoutId);

                const results = await response.json();

                if (results && typeof results === 'object' && !results.error) {
                    let hasData = false;
                    let existingSup = "";
                    Object.keys(results).forEach(key => {
                        const data = results[key];
                        if (!data || typeof data !== 'object') return;

                        // 학번 식별 (키값 자체가 학번이거나, 데이터 내부에 '학번' 필드가 있는 경우 모두 대응)
                        const studentId = (data['학번'] || key || "").toString().trim();
                        if (!studentId || studentId === "error" || studentId === "supervisor") return;

                        hasData = true;
                        // '상태' 열 확인
                        const rawStatus = String(data['상태'] || data.status || "").trim();
                        const statusStr = (rawStatus === '출석' || rawStatus.toLowerCase() === 'true') ? 'true' : 'false';

                        localStorage.setItem(`att_${dateStr}_${day}_${period}_${studentId}`, statusStr);
                        localStorage.setItem(`rem_${dateStr}_${day}_${period}_${studentId}`, (data['비고'] || data.remark || "").trim());

                        // '감독교사' 열 확인
                        const rawSup = (data['감독교사'] || data.supervisor || data['감독'] || data.teacher || "").trim();
                        localStorage.setItem(`sup_val_${dateStr}_${day}_${period}_${studentId}`, rawSup);

                        // v22: 변동 감지를 위한 초기 상태 별도 보관
                        localStorage.setItem(`initial_att_${dateStr}_${day}_${period}_${studentId}`, statusStr);
                        localStorage.setItem(`initial_rem_${dateStr}_${day}_${period}_${studentId}`, (data['비고'] || data.remark || "").trim());

                        // 반 전체 대표 감독교사 정보 업데이트
                        if (rawSup && !existingSup && rawSup !== "선생님") {
                            existingSup = rawSup;
                        }
                    });

                    if (hasData) {
                        if (existingSup) {
                            localStorage.setItem(`sup_${dateStr}_${day}_${period}_${roomName}`, existingSup);
                        }
                        localStorage.setItem(cacheKey, 'true');
                        if (force) showToast(`${roomName}반 출결 정보를 업데이트했습니다.`);
                    } else if (force) {
                        showToast(`${roomName}반의 기존 출결 정보가 없습니다.`);
                    }

                    // 현재 보고 있는 화면과 데이터가 일치하면 UI 갱신
                    if (currentDay === day && currentPeriod === period) {
                        renderSeating();
                    }
                } else if (force && results && results.error) {
                    showAlert(`오류 발생: ${results.error}`);
                }
            } catch (error) {
                console.error('Fetch error:', error);
                if (force) {
                    if (error.name === 'AbortError') {
                        showAlert(`${roomName}반 출결 조회 시간이 초과되었습니다. 네트워크 상태를 확인 후 다시 시도해 주세요.`);
                    } else {
                        showAlert(`${roomName}반 출결 정보를 가져오는 데 실패했습니다. 다시 시도해 주세요.`);
                    }
                }
            } finally {
                fetchingRooms.delete(fetchId);
                // 🟢 초록색 불러오는 중 표시 비활성화
                const cleanIndicator = document.querySelector(`.classroom-section[data-room="${roomName}"] .sync-loading-indicator`);
                if (cleanIndicator) {
                    cleanIndicator.style.display = 'none';
                }
                if (refreshBtn && force) {
                    refreshBtn.disabled = false;
                    refreshBtn.innerHTML = '🔄 출결 새로고침';
                }
            }
        }

        // 실제 오늘 날짜(현지 시간 기준)의 모든 반/모든 교시 데이터를 한꺼번에 로드 (모달)
        async function fetchAllTodayAttendance(silent = false, force = false) {
            const rooms = ['2-3', '2-4', '2-5', '2-6'];
            const periods = ['1', '2'];

            // 실제 오늘 요일 감지
            const dMap = ['일', '월', '화', '수', '목', '금', '토'];
            const actualToday = dMap[new Date().getDay()];
            if (actualToday === '일' || actualToday === '토') return;

            if (!silent) showLoading("데이터를 빠르게 동기화하는 중입니다..."); // 모든 데이터 로드 시 로딩창 표시

            try {
                // v19 개선: 병렬 실행(Promise.all)으로 속도 대폭 향상 (기존 10초+ -> 약 2초)
                const fetchPromises = [];
                for (const p of periods) {
                    for (const r of rooms) {
                        fetchPromises.push(fetchAttendanceFromSheet(r, { silent: true, day: actualToday, period: p, force: force }));
                    }
                }
                await Promise.all(fetchPromises);
            } catch (error) {
                console.error("전체 동기화 중 일부 오류 발생:", error);
            } finally {
                if (!silent) hideLoading();
            }
        }




        // 요일 버튼 초기 활성화 (교시 버튼에 영향을 주지 않도록 선택자 한정)
        const activeDayBtn = document.querySelector(`#dayButtons .day-btn[data-day="${currentDay}"]`);
        if (activeDayBtn) {
            document.querySelectorAll('#dayButtons .day-btn').forEach(b => b.classList.remove('active'));
            activeDayBtn.classList.add('active');
        }

        // 교시 버튼 초기 활성화
        const activePeriodBtn = document.querySelector(`#periodButtons .day-btn[data-period="${currentPeriod}"]`);
        if (activePeriodBtn) {
            document.querySelectorAll('#periodButtons .day-btn').forEach(b => b.classList.remove('active'));
            activePeriodBtn.classList.add('active');
        }

        // Floating Bubbles dynamic creation
        function createBubbles() {
            const container = document.createElement('div');
            container.className = 'bubble-container';
            document.body.appendChild(container);

            const bubbleCount = 20;
            for (let i = 0; i < bubbleCount; i++) {
                const bubble = document.createElement('div');
                bubble.className = 'bubble';

                // Randomize bubble size (5px to 20px)
                const size = Math.random() * 15 + 5;
                bubble.style.width = `${size}px`;
                bubble.style.height = `${size}px`;

                // Randomize horizontal position
                bubble.style.left = `${Math.random() * 100}vw`;

                // Randomize animation delay and duration
                bubble.style.animationDelay = `${Math.random() * 8}s`;
                bubble.style.animationDuration = `${Math.random() * 12 + 8}s`; // 8s to 20s

                container.appendChild(bubble);
            }
        }


        async function downloadPDF() {
            const element = document.getElementById('seatingDisplay');
            if (!element || element.innerHTML.trim() === "") {
                showAlert("저장할 자리 배치도 데이터가 없습니다.");
                return;
            }

            const opt = {
                margin: 0,
                filename: `야자배치도_${currentDay}_${currentPeriod}교시.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: {
                    scale: 2,
                    useCORS: true,
                    logging: false,
                    letterRendering: true
                },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
                pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
            };

            showLoading();
            const exportDataDay = currentDay;
            document.body.classList.add('is-exporting-pdf');
            document.body.classList.add(`is-exporting-pdf-${exportDataDay}`);

            try {
                // html2pdf는 전역 객체로 로드됨
                await html2pdf().set(opt).from(element).save();
            } catch (error) {
                console.error("PDF Export Error:", error);
                showAlert("PDF 저장 중 오류가 발생했습니다.");
            } finally {
                document.body.classList.remove('is-exporting-pdf');
                document.body.classList.remove(`is-exporting-pdf-${exportDataDay}`);
                hideLoading();
            }
        }

        renderSeating();



    </script>

</body>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2학기 야자 신청</title>
<script src="https://accounts.google.com/gsi/client" async defer onload="onGsiScriptLoad()" onerror="onGsiScriptError()"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root {
    --ink:      #1c2130;   /* 본문 텍스트 */
    --navy:     #202a44;   /* 헤더 남색 (밤) */
    --amber:    #e79429;   /* 등불 앰버 */
    --paper:    #f3efe6;   /* 따뜻한 종이 배경 */
    --line:     #e4ddcf;
    --muted:    #6d7280;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { height: 100%; }
  body {
    font-family: "Pretendard", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background:
      radial-gradient(120% 80% at 85% -10%, #fff6e6 0%, rgba(255,246,230,0) 55%),
      var(--paper);
    margin: 0;
    padding: 20px 14px calc(28px + env(safe-area-inset-bottom));
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
  }

  .card {
    max-width: 460px;
    margin: 0 auto;
    background: #fff;
    border-radius: 18px;
    overflow: hidden;
    border: 1px solid var(--line);
    box-shadow: 0 18px 40px -24px rgba(32,42,68,0.45);
  }

  /* ── 헤더: 밤 하늘 + 등불 ── */
  .head {
    position: relative;
    background:
      radial-gradient(90px 90px at 84% 26%, rgba(231,148,41,0.28), rgba(231,148,41,0) 70%),
      linear-gradient(160deg, var(--navy) 0%, #161d30 100%);
    color: #fff;
    padding: 22px 22px 20px;
  }
  .head .kicker {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 12px; font-weight: 600; letter-spacing: .04em;
    color: #b9c2dd; margin-bottom: 8px;
  }
  .head .kicker .moon {
    width: 15px; height: 15px; display: inline-block;
    color: var(--amber);
  }
  .head h1 {
    font-size: 22px; font-weight: 800; margin: 0;
    letter-spacing: -0.02em;
  }
  .head .lamp {
    position: absolute; right: 20px; top: 18px;
    width: 40px; height: 40px; opacity: .9;
  }
  .head::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--amber) 0%, #f0b45a 100%);
  }

  .body { padding: 20px 22px 24px; }

  .sub { color: var(--muted); font-size: 14px; }

  /* ── 로그인 ── */
  #loginBox { text-align: center; padding: 22px 0 10px; }
  #loginBox .sub { margin-bottom: 18px; }
  #gsiBtn { display: flex; justify-content: center; }
  #loginMsg { margin-top: 14px; font-size: 13px; color: #c0392b; min-height: 16px; }

  /* ── 로그인 후 사용자 ── */
  #who {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 14px; font-weight: 600; color: var(--ink);
    background: #f6f2ea; border: 1px solid var(--line);
    padding: 7px 13px; border-radius: 999px;
    margin-bottom: 16px;
  }
  #who::before {
    content: ""; width: 8px; height: 8px; border-radius: 50%;
    background: #2ea36a; box-shadow: 0 0 0 3px rgba(46,163,106,0.18);
  }

  /* ── 안내 박스 ── */
  .info-box, .closed-box {
    border-radius: 12px;
    padding: 13px 14px 13px 16px;
    font-size: 13.5px;
    margin-bottom: 18px;
    line-height: 1.65;
    border-left: 4px solid;
  }
  .info-box {
    background: #fbf3e3;
    border-left-color: var(--amber);
    color: #7a5417;
  }
  .closed-box {
    background: #fdeeea;
    border-left-color: #e0603f;
    color: #a83b23;
  }

  /* ── 신청 테이블 ── */
  table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    margin-bottom: 20px;
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
  }
  thead th {
    background: #f7f4ee;
    color: #545a6b;
    font-weight: 700;
    font-size: 12.5px;
    letter-spacing: .02em;
    padding: 12px 4px;
    border-bottom: 1px solid var(--line);
  }
  tbody td {
    padding: 0;
    text-align: center;
    border-bottom: 1px solid var(--line);
    font-size: 15px;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody td:first-child {
    font-weight: 700;
    color: var(--ink);
    background: #fbfaf7;
    width: 34%;
  }
  tbody tr:hover td:first-child { background: #f7f4ee; }

  /* 커스텀 체크박스 (탭 영역 크게) */
  .chk {
    display: flex; align-items: center; justify-content: center;
    width: 100%; padding: 15px 0; cursor: pointer;
  }
  .chk input {
    position: absolute; opacity: 0; width: 1px; height: 1px;
  }
  .chk span {
    width: 26px; height: 26px;
    border: 2px solid #cbd0dc;
    border-radius: 8px;
    background: #fff;
    position: relative;
    transition: transform .12s ease, background .12s ease, border-color .12s ease;
  }
  .chk:active span { transform: scale(0.9); }
  .chk input:checked + span {
    background: var(--amber);
    border-color: var(--amber);
    box-shadow: 0 4px 10px -4px rgba(231,148,41,0.7);
  }
  .chk input:checked + span::after {
    content: ""; position: absolute;
    left: 8px; top: 3px; width: 6px; height: 12px;
    border: solid #fff; border-width: 0 3px 3px 0;
    transform: rotate(43deg);
  }
  .chk input:disabled + span {
    background: #f1f0ec; border-color: #e3e1da;
  }
  .chk input:disabled:checked + span {
    background: #d9b98a; border-color: #d9b98a; box-shadow: none; opacity: .85;
  }

  /* ── 저장 버튼 ── */
  button#submitBtn {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 13px;
    background: linear-gradient(180deg, #263252 0%, var(--navy) 100%);
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    font-family: inherit;
    letter-spacing: -0.01em;
    cursor: pointer;
    transition: transform .1s ease, box-shadow .2s ease, opacity .2s;
    box-shadow: 0 10px 22px -12px rgba(32,42,68,0.9);
  }
  button#submitBtn:active { transform: translateY(1px); }
  button#submitBtn:disabled {
    background: #b9bcc6; box-shadow: none; cursor: not-allowed;
  }

  #msg { margin-top: 14px; font-size: 13.5px; text-align: center; min-height: 18px; font-weight: 500; }
  #msg.error { color: #c0392b; }
  #msg.ok { color: #1d8a4c; }

  /* ── 신청 완료 모달 ── */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(20, 26, 42, 0.55);
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    animation: overlayIn .18s ease;
  }
  .modal-card {
    width: 100%; max-width: 340px;
    background: #fff; border-radius: 20px;
    padding: 30px 24px 22px; text-align: center;
    box-shadow: 0 30px 60px -18px rgba(0, 0, 0, 0.5);
    animation: popIn .32s cubic-bezier(.2, .9, .3, 1.25);
  }
  .check-circle {
    width: 66px; height: 66px; margin: 0 auto 16px;
    border-radius: 50%;
    background: #2ea36a;
    box-shadow: 0 8px 20px -6px rgba(46, 163, 106, 0.6);
    display: flex; align-items: center; justify-content: center;
  }
  .check-circle svg { width: 34px; height: 34px; }
  .check-circle path {
    stroke-dasharray: 30; stroke-dashoffset: 30;
    animation: draw .4s .12s ease forwards;
  }
  .modal-title { font-size: 21px; font-weight: 800; margin: 0 0 6px; color: var(--ink); }
  .modal-sub { font-size: 13.5px; color: var(--muted); margin: 0 0 18px; }

  .summary {
    text-align: left;
    background: #f7f4ee; border: 1px solid var(--line);
    border-radius: 12px; padding: 6px 4px; margin-bottom: 20px;
  }
  .summary-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 14px; font-size: 14px;
    border-bottom: 1px solid #ece6d9;
  }
  .summary-row:last-child { border-bottom: none; }
  .summary-row .s-day { font-weight: 700; color: var(--ink); }
  .summary-row .s-per {
    color: #7a5417; font-weight: 600; font-size: 13px;
    background: #fbf0dc; padding: 3px 10px; border-radius: 999px;
  }
  .summary-empty {
    text-align: center; color: var(--muted); font-size: 13.5px;
    padding: 14px 8px; line-height: 1.6;
  }
  .modal-btn {
    width: 100%; padding: 14px; border: none; border-radius: 13px;
    background: linear-gradient(180deg, #263252 0%, var(--navy) 100%);
    color: #fff; font-size: 16px; font-weight: 700; font-family: inherit;
    cursor: pointer;
  }
  .modal-btn:active { transform: translateY(1px); }
  .modal-actions { display: flex; gap: 10px; }
  .modal-actions .modal-btn { flex: 1; padding: 13px; font-size: 15px; }
  .modal-btn.ghost {
    background: #fff; color: var(--navy);
    border: 1.5px solid var(--line);
  }
  .modal-cancel {
    width: 100%; margin-top: 10px; padding: 9px;
    background: none; border: none; cursor: pointer;
    color: #c0392b; font-size: 13px; font-weight: 600; font-family: inherit;
    text-decoration: underline; text-underline-offset: 3px;
  }
  .modal-cancel:disabled { color: #bbb; cursor: not-allowed; text-decoration: none; }

  /* ── 인앱 브라우저 안내 ── */
  .inapp-lock {
    width: 60px; height: 60px; margin: 0 auto 16px; border-radius: 50%;
    background: #fbf0dc; display: flex; align-items: center; justify-content: center;
  }
  .inapp-lock svg { width: 30px; height: 30px; color: var(--amber); }
  .inapp-manual { margin-top: 18px; font-size: 12.5px; color: var(--muted); line-height: 1.75; }
  .inapp-manual b { color: var(--ink); }
  .inapp-url {
    display: block; margin-top: 10px; word-break: break-all;
    font-size: 11.5px; color: #7a7a7a; background: #f3efe6;
    border-radius: 8px; padding: 9px 10px;
  }
  .inapp-copy {
    margin-top: 8px; padding: 8px 14px; border: 1px solid var(--line);
    background: #fff; border-radius: 8px; font-size: 12.5px; font-weight: 600;
    color: var(--navy); cursor: pointer; font-family: inherit;
  }

  @keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes popIn { from { opacity: 0; transform: translateY(12px) scale(.96); } to { opacity: 1; transform: none; } }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  .hidden { display: none; }
</style>
</head>
<body>
  <div class="card">
    <header class="head">
      <span class="kicker">
        <svg class="moon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M20.7 14.9A8.5 8.5 0 1 1 9.1 3.3a7 7 0 1 0 11.6 11.6Z"/>
        </svg>
        야간 자율학습
      </span>
      <h1>2학기 야자 신청</h1>
      <svg class="lamp" viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <path d="M14 10h20l-4 12H18L14 10Z" fill="#e79429"/>
        <path d="M24 22v14" stroke="#c9d0e6" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M16 40h16" stroke="#c9d0e6" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="24" cy="27" r="2.4" fill="#ffd98a"/>
      </svg>
    </header>

    <div class="body">
      <div id="loginBox">
        <div class="sub">학교 구글 계정으로 로그인해 주세요.</div>
        <div id="gsiBtn"></div>
        <div id="loginMsg"></div>
      </div>

      <div id="content" class="hidden">
        <div id="who"></div>
        <div id="periodBox"></div>

        <table>
          <thead>
            <tr><th>요일</th><th>1교시</th><th>2교시</th></tr>
          </thead>
          <tbody id="dayRows"></tbody>
        </table>

        <button id="submitBtn">신청 내용 저장</button>
        <div id="msg"></div>
      </div>
    </div>
  </div>

  <div id="doneModal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="check-circle">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 12.5l5 5L20 6.5" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h2 class="modal-title">신청 완료!</h2>
      <p class="modal-sub" id="doneSub"></p>
      <div class="summary" id="doneSummary"></div>
      <div class="modal-actions">
        <button id="doneEditBtn" class="modal-btn ghost">수정하기</button>
        <button id="doneCloseBtn" class="modal-btn">확인</button>
      </div>
      <button id="doneCancelBtn" class="modal-cancel">신청 전체 취소</button>
    </div>
  </div>

  <div id="inappGuide" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="inapp-lock">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="4" y="10" width="16" height="10" rx="2" stroke="currentColor" stroke-width="2"/>
          <path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="2"/>
        </svg>
      </div>
      <h2 class="modal-title">외부 브라우저로 열어주세요</h2>
      <p class="modal-sub">카카오톡 안에서는 구글 로그인이 막혀 있어요.<br>크롬/Safari로 열면 정상적으로 로그인돼요.</p>
      <button id="openExternalBtn" class="modal-btn">외부 브라우저로 열기</button>
      <div class="inapp-manual">
        버튼이 안 되면 → 우측 상단 <b>⋮ (더보기)</b> → <b>다른 브라우저로 열기</b>
        <span class="inapp-url" id="inappUrl"></span>
        <button id="copyUrlBtn" class="inapp-copy">주소 복사하기</button>
      </div>
    </div>
  </div>

<script>
  // ===== 아래 두 값을 실제 값으로 교체하세요 =====
  var GOOGLE_CLIENT_ID = "783955617247-32toh8t2khrb9l1qj1sbhl5t4it7au54.apps.googleusercontent.com";
  var GAS_URL = "https://script.google.com/macros/s/AKfycby4opXfNbOGVjC0rnBPg2XoiJiDllGbnrabI-DZ7kqc7qi0IqxNI2mB-lqlIo6APWTM/exec";
  // ================================================

  var DAYS = ["월", "화", "수", "목", "금"];
  var isOpen = false;
  var idToken = null;

  // ===== 인앱 브라우저(카카오톡 등) 감지 및 외부 브라우저 유도 =====
  function detectInApp() {
    var ua = (navigator.userAgent || '').toLowerCase();
    if (ua.indexOf('kakaotalk') > -1) return 'kakao';
    if (ua.indexOf('naver') > -1) return 'naver';
    if (ua.indexOf('instagram') > -1) return 'instagram';
    if (ua.indexOf('fban') > -1 || ua.indexOf('fbav') > -1) return 'facebook';
    if (ua.indexOf('line/') > -1) return 'line';
    if (ua.indexOf('daumapps') > -1) return 'daum';
    return null;
  }

  function openExternalBrowser() {
    var url = location.href;
    var ua = (navigator.userAgent || '').toLowerCase();
    var app = detectInApp();

    if (app === 'kakao') {
      // 카카오톡 전용 딥링크 (안드로이드/아이폰 모두 기본 브라우저로 열림)
      location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(url);
    } else if (app === 'line') {
      location.href = url + (url.indexOf('?') > -1 ? '&' : '?') + 'openExternalBrowser=1';
    } else if (ua.indexOf('android') > -1) {
      // 안드로이드 기타 인앱 → 크롬 인텐트로 강제 오픈
      location.href = 'intent://' + url.replace(/^https?:\/\//, '') + '#Intent;scheme=https;package=com.android.chrome;end';
    }
    // iOS 기타 인앱은 자동 탈출 불가 → 아래 수동 안내(주소 복사)로 처리
  }

  function initInAppGuard() {
    if (!detectInApp()) return false;
    var urlEl = document.getElementById('inappUrl');
    if (urlEl) urlEl.textContent = location.href;
    document.getElementById('inappGuide').classList.remove('hidden');
    if (detectInApp() === 'kakao') openExternalBrowser(); // 카카오톡은 자동으로 열기 시도
    return true;
  }

  function onGoogleLogin(response) {
    idToken = response.credential;
    document.getElementById('loginMsg').textContent = '';
    loadStatus();
  }

  var gsiInited = false;

  function showLoginMsg(text) {
    var el = document.getElementById('loginMsg');
    if (el) el.textContent = text;
  }

  // GSI 스크립트가 로드되면 호출 (모바일에서 window.onload 타이밍보다 안전)
  function onGsiScriptLoad() { initGsi(); }

  // GSI 스크립트 자체를 못 불러온 경우 (네트워크 차단/광고차단 등)
  function onGsiScriptError() {
    showLoginMsg('구글 로그인을 불러오지 못했어요. 인터넷 연결을 확인하거나 크롬 앱으로 열어주세요.');
  }

  function initGsi() {
    if (gsiInited) return;
    if (!(window.google && google.accounts && google.accounts.id)) return; // 아직 로드 전
    gsiInited = true;

    try {
      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: onGoogleLogin
      });
      google.accounts.id.renderButton(
        document.getElementById('gsiBtn'),
        { theme: 'outline', size: 'large', text: 'signin_with', shape: 'pill', width: 240 }
      );
    } catch (e) {
      showLoginMsg('구글 로그인 버튼을 표시하지 못했어요: ' + (e && e.message ? e.message : e));
      return;
    }

    // 버튼이 실제로 그려졌는지 확인. 모바일(특히 iOS Safari 추적방지)에서
    // accounts.google.com iframe이 차단되면 버튼이 빈 공간으로 남는다.
    setTimeout(function () {
      var box = document.getElementById('gsiBtn');
      if (!box || box.offsetHeight < 10) {
        showLoginMsg('이 브라우저가 구글 로그인을 차단하고 있어요. iPhone이면 [설정 > Safari > 사이트 간 추적 방지]를 끄거나, 크롬 앱으로 열어 다시 시도해 주세요.');
      }
    }, 2500);
  }

  // 스크립트가 이미 로드된 상태(캐시 등)에서 onload가 안 불릴 경우 대비
  window.addEventListener('load', initGsi);

  // 인앱 안내 버튼
  document.getElementById('openExternalBtn').addEventListener('click', openExternalBrowser);
  document.getElementById('copyUrlBtn').addEventListener('click', function () {
    var btn = this;
    function done() { btn.textContent = '복사됨!'; setTimeout(function () { btn.textContent = '주소 복사하기'; }, 1500); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(location.href).then(done, function () { fallbackCopy(location.href); done(); });
    } else { fallbackCopy(location.href); done(); }
  });
  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
  }

  // 카카오톡 등 인앱 브라우저면 안내 오버레이 표시 (즉시 실행)
  initInAppGuard();

  function callApi(payload) {
    return fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify(payload)
    }).then(function (res) { return res.json(); });
  }

  function renderRows(selection) {
    var tbody = document.getElementById('dayRows');
    tbody.innerHTML = '';
    DAYS.forEach(function (day) {
      var sel = selection[day] || { p1: false, p2: false };
      var tr = document.createElement('tr');
      tr.innerHTML =
        '<td>' + day + '요일</td>' +
        '<td><label class="chk"><input type="checkbox" data-day="' + day + '" data-period="p1" ' + (sel.p1 ? 'checked' : '') + (isOpen ? '' : ' disabled') + '><span></span></label></td>' +
        '<td><label class="chk"><input type="checkbox" data-day="' + day + '" data-period="p2" ' + (sel.p2 ? 'checked' : '') + (isOpen ? '' : ' disabled') + '><span></span></label></td>';
      tbody.appendChild(tr);
    });
  }

  function loadStatus() {
    document.getElementById('loginMsg').textContent = '확인 중...';
    callApi({ type: 'apply_status', idToken: idToken })
      .then(function (data) {
        if (data.result !== 'success') {
          document.getElementById('loginMsg').textContent = data.message || '오류가 발생했습니다.';
          return;
        }
        isOpen = data.isOpen;

        document.getElementById('loginBox').classList.add('hidden');
        document.getElementById('content').classList.remove('hidden');
        document.getElementById('who').textContent = data.studentId + ' ' + data.name + ' 학생';

        var periodBox = document.getElementById('periodBox');
        if (isOpen) {
          periodBox.innerHTML =
            '<div class="info-box">신청 기간: ' + data.periodText + '<br>신청 기간 내에는 자유롭게 수정/취소할 수 있습니다.</div>';
        } else {
          periodBox.innerHTML =
            '<div class="closed-box">신청 기간(' + data.periodText + ')이 아니므로 신청 내용을 변경할 수 없습니다. 아래는 신청 결과 조회입니다.</div>';
          document.getElementById('submitBtn').style.display = 'none';
        }

        renderRows(data.selection);
      })
      .catch(function (err) {
        document.getElementById('loginMsg').textContent = '서버 연결에 실패했습니다: ' + err;
      });
  }

  document.getElementById('submitBtn').addEventListener('click', function () {
    var btn = this;
    var msg = document.getElementById('msg');
    var selection = {};
    DAYS.forEach(function (day) { selection[day] = { p1: false, p2: false }; });

    document.querySelectorAll('#dayRows input[type=checkbox]').forEach(function (cb) {
      selection[cb.getAttribute('data-day')][cb.getAttribute('data-period')] = cb.checked;
    });

    btn.disabled = true;
    msg.className = '';
    msg.textContent = '저장 중...';

    callApi({ type: 'apply_submit', idToken: idToken, selection: selection })
      .then(function (data) {
        btn.disabled = false;
        if (data.result === 'success') {
          msg.className = 'ok';
          msg.textContent = '저장되었습니다.';
          showDoneModal(selection);
        } else {
          msg.className = 'error';
          msg.textContent = data.message || '오류가 발생했습니다.';
        }
      })
      .catch(function (err) {
        btn.disabled = false;
        msg.className = 'error';
        msg.textContent = '서버 연결에 실패했습니다: ' + err;
      });
  });

  function showDoneModal(selection) {
    var rows = [];
    var total = 0;
    DAYS.forEach(function (day) {
      var s = selection[day] || {};
      var ps = [];
      if (s.p1) ps.push('1교시');
      if (s.p2) ps.push('2교시');
      if (ps.length) {
        rows.push({ day: day, periods: ps.join(', ') });
        total += ps.length;
      }
    });

    var sub = document.getElementById('doneSub');
    var summary = document.getElementById('doneSummary');

    if (rows.length === 0) {
      sub.textContent = '신청 내용이 저장되었어요.';
      summary.innerHTML = '<div class="summary-empty">신청한 야자가 없습니다.<br>(전체 미신청 상태로 저장됨)</div>';
    } else {
      sub.textContent = '총 ' + total + '개 교시를 신청했어요.';
      summary.innerHTML = rows.map(function (r) {
        return '<div class="summary-row"><span class="s-day">' + r.day + '요일</span>' +
               '<span class="s-per">' + r.periods + '</span></div>';
      }).join('');
    }

    document.getElementById('doneModal').classList.remove('hidden');
  }

  function hideDoneModal() {
    document.getElementById('doneModal').classList.add('hidden');
  }

  document.getElementById('doneCloseBtn').addEventListener('click', hideDoneModal);
  // 수정하기: 팝업 닫고 폼으로 돌아가 다시 선택/저장
  document.getElementById('doneEditBtn').addEventListener('click', hideDoneModal);
  document.getElementById('doneModal').addEventListener('click', function (e) {
    if (e.target === this) hideDoneModal(); // 바깥 배경 클릭 시 닫기
  });

  // 신청 전체 취소: 재확인 후 빈 신청으로 저장해 철회
  document.getElementById('doneCancelBtn').addEventListener('click', function () {
    if (!confirm('정말 신청을 전체 취소할까요?\n저장된 야자 신청이 모두 해제됩니다.')) return;
    var cancelBtn = this;
    cancelBtn.disabled = true;
    cancelBtn.textContent = '취소 중...';

    var empty = {};
    DAYS.forEach(function (day) { empty[day] = { p1: false, p2: false }; });

    callApi({ type: 'apply_submit', idToken: idToken, selection: empty })
      .then(function (data) {
        cancelBtn.disabled = false;
        cancelBtn.textContent = '신청 전체 취소';
        if (data.result === 'success') {
          document.querySelectorAll('#dayRows input[type=checkbox]').forEach(function (cb) { cb.checked = false; });
          hideDoneModal();
          var msg = document.getElementById('msg');
          msg.className = 'ok';
          msg.textContent = '신청이 취소되었습니다.';
        } else {
          alert(data.message || '취소 중 오류가 발생했습니다.');
        }
      })
      .catch(function (err) {
        cancelBtn.disabled = false;
        cancelBtn.textContent = '신청 전체 취소';
        alert('서버 연결에 실패했습니다: ' + err);
      });
  });
</script>
</body>
</html>

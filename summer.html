<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>여름방학 자기주도학습 출결</title>

    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700,800&display=swap" rel="stylesheet">
    <style>
        :root {
            /* 여름 공부방 — 따뜻한 종이 + 석양 오렌지 + 청록/솔록 */
            --paper: #F1E9D8;
            --paper-soft: #F8F2E6;
            --surface: #FFFDF7;
            --surface-soft: #F6EFE0;
            --ink: #241E18;
            --ink-soft: #6C6154;
            --ink-faint: #A99C87;
            --line: #E7DBC4;
            --line-strong: #D8C7A6;

            --sun: #E07B2E;
            --sun-strong: #BF5D16;
            --sun-soft: #F8E2C9;
            --sun-tint: #FCF1E2;

            --sea: #2B7B78;
            --sea-strong: #1F5E5C;
            --sea-soft: #D8ECEA;

            --present: #2E8054;
            --present-strong: #1E6340;
            --present-soft: #DDEEE0;

            --memo: #E5A417;
            --memo-soft: #FBEDC4;
            --memo-ink: #8A6209;

            --room-a: var(--sun);
            --room-b: var(--sea);

            --shadow-sm: 0 1px 2px rgba(52, 40, 26, 0.06);
            --shadow-md: 0 10px 30px -14px rgba(52, 40, 26, 0.28);
            --shadow-lg: 0 30px 70px -24px rgba(52, 40, 26, 0.45);

            --r-xl: 24px;
            --r-lg: 18px;
            --r-md: 13px;
            --r-sm: 9px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
            background:
                radial-gradient(140% 60% at 100% -5%, rgba(224, 123, 46, 0.10), transparent 55%),
                radial-gradient(120% 55% at -10% 0%, rgba(43, 123, 120, 0.08), transparent 50%),
                var(--paper);
            color: var(--ink);
            line-height: 1.55;
            letter-spacing: -0.01em;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            padding: 28px 20px calc(90px + env(safe-area-inset-bottom));
        }

        .wrap {
            max-width: 1040px;
            margin: 0 auto;
        }

        /* ───────── 헤더 (석양 히어로 + 컨트롤) ───────── */
        header {
            border-radius: var(--r-xl);
            overflow: hidden;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--line);
            margin: 0 auto 26px;
            max-width: 1040px;
        }

        .hero {
            position: relative;
            overflow: hidden;
            padding: 34px 34px 30px;
            color: #FFF7EC;
            background:
                radial-gradient(90% 130% at 84% -30%, #F7B45A 0%, #E9843311 45%, transparent 62%),
                linear-gradient(135deg, #3A2320 0%, #7C3A1E 52%, #C4611D 100%);
        }

        .hero-sun {
            position: absolute;
            right: -28px;
            top: -34px;
            width: 190px;
            height: 190px;
            opacity: 0.9;
            color: #FFCE7A;
            filter: drop-shadow(0 8px 20px rgba(255, 180, 90, 0.35));
            pointer-events: none;
        }

        .eyebrow {
            font-family: 'Nanum Myeongjo', serif;
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 0.06em;
            color: #FFD9A8;
            margin-bottom: 10px;
            position: relative;
        }

        .hero h1 {
            font-size: clamp(1.8rem, 5.5vw, 2.55rem);
            font-weight: 900;
            letter-spacing: -0.035em;
            line-height: 1.05;
            margin-bottom: 12px;
            text-shadow: 0 2px 16px rgba(40, 18, 10, 0.25);
        }

        .hero h1 .accent {
            display: inline-block;
            position: relative;
        }

        .hero h1 .accent::after {
            content: '';
            position: absolute;
            left: -2px;
            right: -2px;
            bottom: 0.08em;
            height: 0.32em;
            background: rgba(255, 206, 122, 0.42);
            border-radius: 3px;
            z-index: -1;
        }

        .hero-sub {
            font-size: 0.95rem;
            color: rgba(255, 240, 224, 0.82);
            font-weight: 500;
            max-width: 40ch;
            line-height: 1.5;
            word-break: keep-all;
        }

        .controls-bar {
            background: var(--surface);
            padding: 18px 22px;
            border-top: 1px solid var(--line);
        }

        .controls-row {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }

        .spacer {
            flex: 1 1 auto;
        }

        #dateInput {
            padding: 10px 14px;
            border-radius: var(--r-md);
            border: 1px solid var(--line-strong);
            font-size: 0.95rem;
            font-family: inherit;
            font-weight: 600;
            background: var(--surface-soft);
            color: var(--ink);
            transition: border-color 0.15s ease, background 0.15s ease;
        }

        #dateInput:focus {
            outline: none;
            border-color: var(--sun);
            background: var(--surface);
        }

        #periodButtons {
            background: var(--surface-soft);
            padding: 4px;
            border-radius: var(--r-md);
            display: inline-flex;
            gap: 3px;
            border: 1px solid var(--line);
        }

        #periodButtons .day-btn {
            background: transparent;
            color: var(--ink-soft);
            border: none;
            padding: 9px 17px;
            border-radius: var(--r-sm);
            font-weight: 700;
            font-size: 0.9rem;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.18s cubic-bezier(0.3, 0.9, 0.4, 1);
        }

        #periodButtons .day-btn:hover {
            color: var(--ink);
        }

        #periodButtons .day-btn.active {
            background: linear-gradient(180deg, var(--sun) 0%, var(--sun-strong) 100%);
            color: #fff;
            box-shadow: 0 6px 14px -6px rgba(191, 93, 22, 0.7);
        }

        .supervisor-chip {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--ink);
            background: var(--sun-tint);
            border: 1px solid var(--sun-soft);
            padding: 7px 8px 7px 15px;
            border-radius: 100px;
        }

        .logout-btn {
            background: var(--surface);
            border: 1px solid var(--line-strong);
            border-radius: 100px;
            padding: 5px 12px;
            font-size: 0.78rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            color: var(--ink-soft);
            transition: all 0.15s ease;
        }

        .logout-btn:hover {
            color: var(--sun-strong);
            border-color: var(--sun-soft);
        }

        .info-text {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            font-size: 0.83rem;
            color: var(--ink-soft);
        }

        .info-text .hint {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--sea-soft);
            color: var(--sea-strong);
            padding: 8px 14px;
            border-radius: 100px;
            font-weight: 600;
        }

        .info-text .hint::before {
            content: '';
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--sea);
            flex: none;
        }

        /* ───────── 버튼 ───────── */
        .btn {
            padding: 9px 16px;
            border-radius: var(--r-md);
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.15s ease;
            border: 1px solid var(--line-strong);
            background: var(--surface);
            color: var(--ink-soft);
            font-size: 0.85rem;
        }

        .btn:hover {
            background: var(--surface-soft);
            color: var(--ink);
            border-color: var(--ink-faint);
        }

        .ghost-btn {
            background: transparent;
            border-style: dashed;
            padding: 7px 14px;
            font-size: 0.8rem;
        }

        .btn-primary {
            background: linear-gradient(180deg, var(--sun) 0%, var(--sun-strong) 100%);
            color: white;
            border: none;
            box-shadow: 0 8px 18px -8px rgba(191, 93, 22, 0.75);
        }

        .btn-primary:hover {
            filter: brightness(1.05);
            color: white;
        }

        .btn-primary:active {
            transform: translateY(1px);
        }

        .btn-primary:disabled {
            background: var(--ink-faint);
            box-shadow: none;
            cursor: not-allowed;
            filter: none;
        }

        /* ───────── 교실 섹션 ───────── */
        .seating-container {
            max-width: 1040px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .classroom-section {
            position: relative;
            background: var(--surface);
            padding: 26px 28px 28px;
            border-radius: var(--r-xl);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--line);
            overflow: hidden;
        }

        .classroom-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: var(--line);
        }

        .classroom-section[data-room="2-3"]::before {
            background: linear-gradient(90deg, var(--room-a), #F0A45A);
        }

        .classroom-section[data-room="2-4"]::before {
            background: linear-gradient(90deg, var(--room-b), #4FA9A5);
        }

        .classroom-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 12px;
            flex-wrap: wrap;
        }

        .room-title {
            font-size: 1.4rem;
            font-weight: 900;
            letter-spacing: -0.03em;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .room-title::before {
            content: '';
            width: 12px;
            height: 12px;
            border-radius: 4px;
            transform: rotate(45deg);
        }

        .room-title.color-2-3 {
            color: var(--sun-strong);
        }

        .room-title.color-2-3::before {
            background: var(--room-a);
        }

        .room-title.color-2-4 {
            color: var(--sea-strong);
        }

        .room-title.color-2-4::before {
            background: var(--room-b);
        }

        .room-meta {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--ink-soft);
            background: var(--surface-soft);
            border: 1px solid var(--line);
            padding: 6px 14px;
            border-radius: 100px;
            white-space: nowrap;
        }

        .header-right-btns {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .seat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(132px, 1fr));
            gap: 11px;
        }

        /* ───────── 좌석 ───────── */
        .seat {
            position: relative;
            border: 1px solid var(--line);
            border-radius: var(--r-md);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: var(--surface-soft);
            padding: 17px 10px 15px;
            cursor: pointer;
            user-select: none;
            transition: transform 0.14s cubic-bezier(0.3, 0.9, 0.4, 1), box-shadow 0.14s ease, border-color 0.14s ease, background 0.14s ease;
        }

        .seat:hover {
            border-color: var(--ink-faint);
            background: var(--surface);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .seat:active {
            transform: translateY(0) scale(0.98);
        }

        .student-id {
            font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
            font-size: 0.68rem;
            font-weight: 600;
            color: var(--ink-faint);
            background: rgba(0, 0, 0, 0.03);
            padding: 1px 7px;
            border-radius: 100px;
            margin-bottom: 7px;
            letter-spacing: 0.02em;
        }

        .student-name {
            font-weight: 800;
            font-size: 1.05rem;
            letter-spacing: -0.02em;
        }

        /* 출석 = 초록 스탬프 */
        .seat.present {
            border: 1.5px solid var(--present);
            background: var(--present-soft);
            color: var(--present-strong);
        }

        .seat.present .student-id {
            color: var(--present);
            background: rgba(46, 128, 84, 0.12);
        }

        .seat.present::after {
            content: '✓';
            position: absolute;
            top: 8px;
            right: 8px;
            width: 19px;
            height: 19px;
            border-radius: 50%;
            background: var(--present);
            color: #fff;
            font-size: 0.68rem;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 7px -2px rgba(30, 99, 64, 0.6);
        }

        /* 비고 = 포스트잇 태그 */
        .seat-memo {
            margin-top: 8px;
            font-size: 0.72rem;
            font-weight: 700;
            line-height: 1.35;
            color: var(--memo-ink);
            background: var(--memo-soft);
            border: 1px solid #F1DDA0;
            border-radius: 7px;
            padding: 3px 8px;
            max-width: 100%;
            word-break: break-word;
            text-align: center;
            box-shadow: 0 1px 0 #E7CE86;
        }

        .empty-room-msg {
            text-align: center;
            color: var(--ink-faint);
            padding: 30px 0;
            font-size: 0.9rem;
            font-weight: 500;
        }

        /* ───────── 로그인 ───────── */
        .login-overlay {
            position: fixed;
            inset: 0;
            background: radial-gradient(120% 90% at 80% 0%, rgba(224, 123, 46, 0.28), transparent 55%), rgba(36, 30, 24, 0.5);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 22px;
        }

        .login-box {
            background: var(--surface);
            padding: 34px 32px 30px;
            border-radius: var(--r-xl);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 390px;
            border: 1px solid var(--line);
            text-align: left;
            position: relative;
            overflow: hidden;
        }

        .login-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--sun), var(--memo));
        }

        .login-badge {
            width: 52px;
            height: 52px;
            border-radius: 15px;
            background: linear-gradient(150deg, #FBE1C2, #F6C98A);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--sun-strong);
            margin-bottom: 18px;
            box-shadow: 0 8px 18px -8px rgba(224, 123, 46, 0.6);
        }

        .login-badge svg {
            width: 30px;
            height: 30px;
        }

        .login-eyebrow {
            font-family: 'Nanum Myeongjo', serif;
            font-weight: 700;
            font-size: 0.82rem;
            letter-spacing: 0.05em;
            color: var(--sun-strong);
            margin-bottom: 5px;
        }

        .login-box h2 {
            font-size: 1.45rem;
            font-weight: 900;
            letter-spacing: -0.03em;
            margin-bottom: 8px;
        }

        .login-desc {
            color: var(--ink-soft);
            font-size: 0.9rem;
            word-break: keep-all;
        }

        .login-box input {
            width: 100%;
            padding: 14px 15px;
            border-radius: var(--r-md);
            border: 1px solid var(--line-strong);
            background: var(--surface-soft);
            font-size: 1rem;
            outline: none;
            margin-top: 18px;
            font-family: inherit;
            font-weight: 600;
            color: var(--ink);
            transition: border-color 0.15s ease, background 0.15s ease;
        }

        .login-box input:focus {
            border-color: var(--sun);
            background: var(--surface);
        }

        .login-box input::placeholder {
            color: var(--ink-faint);
            font-weight: 500;
        }

        .login-box button {
            width: 100%;
            margin-top: 12px;
            padding: 14px;
            font-size: 1rem;
            font-weight: 800;
            border-radius: var(--r-md);
        }

        /* ───────── 비고 모달 ───────── */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(36, 30, 24, 0.5);
            backdrop-filter: blur(4px);
            z-index: 20000;
            justify-content: center;
            align-items: center;
            padding: 22px;
        }

        .modal-content {
            background: var(--surface);
            border: 1px solid var(--line);
            padding: 24px 22px;
            border-radius: var(--r-xl);
            max-width: 380px;
            width: 100%;
            box-shadow: var(--shadow-lg);
            text-align: left;
        }

        .modal-content h3 {
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 15px;
            color: var(--ink-soft);
        }

        .modal-content h3 span {
            color: var(--ink);
            font-weight: 900;
        }

        .modal-content textarea {
            width: 100%;
            min-height: 96px;
            padding: 13px 14px;
            border: 1px solid var(--line-strong);
            border-radius: var(--r-md);
            font-size: 0.96rem;
            font-family: inherit;
            resize: vertical;
            outline: none;
            background: var(--surface-soft);
            margin-bottom: 15px;
            color: var(--ink);
            transition: border-color 0.15s ease, background 0.15s ease;
        }

        .modal-content textarea:focus {
            border-color: var(--sun);
            background: var(--surface);
        }

        .modal-btns {
            display: flex;
            gap: 9px;
        }

        .modal-btns button {
            flex: 1;
            padding: 12px;
            border-radius: var(--r-md);
            font-weight: 800;
            font-size: 0.9rem;
            font-family: inherit;
            cursor: pointer;
            border: none;
        }

        .btn-cancel {
            background: var(--surface-soft);
            color: var(--ink-soft);
            border: 1px solid var(--line);
        }

        .btn-cancel:hover {
            background: var(--paper-soft);
        }

        .btn-save {
            background: linear-gradient(180deg, var(--sun) 0%, var(--sun-strong) 100%);
            color: white;
        }

        .btn-save:hover {
            filter: brightness(1.05);
        }

        /* ───────── 토스트 ───────── */
        #toast {
            position: fixed;
            bottom: calc(28px + env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%) translateY(120px);
            background: var(--ink);
            color: #FFF7EC;
            padding: 14px 24px;
            border-radius: 100px;
            font-weight: 700;
            font-size: 0.9rem;
            box-shadow: var(--shadow-lg);
            transition: transform 0.36s cubic-bezier(0.2, 0.9, 0.3, 1.2);
            z-index: 10000;
            max-width: 90vw;
            text-align: center;
            display: inline-flex;
            align-items: center;
            gap: 9px;
        }

        #toast::before {
            content: '';
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--sun);
        }

        #toast.show {
            transform: translateX(-50%) translateY(0);
        }

        /* ───────── 로딩 ───────── */
        #loadingOverlay {
            position: fixed;
            inset: 0;
            background: radial-gradient(100% 70% at 50% 30%, rgba(248, 242, 230, 0.96), rgba(241, 233, 216, 0.96));
            z-index: 10000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
        }

        .loader {
            width: 38px;
            height: 38px;
            border: 4px solid var(--sun-soft);
            border-top-color: var(--sun);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #loadingText {
            font-weight: 700;
            color: var(--ink-soft);
            font-size: 0.95rem;
        }

        /* ───────── 반응형 ───────── */
        @media (max-width: 768px) {
            body {
                padding: 14px 12px calc(80px + env(safe-area-inset-bottom));
            }

            .hero {
                padding: 26px 22px 24px;
            }

            .hero-sun {
                width: 140px;
                height: 140px;
                right: -22px;
                top: -26px;
            }

            .controls-bar {
                padding: 16px 16px;
            }

            .controls-row {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }

            #dateInput {
                width: 100%;
                text-align: center;
            }

            #periodButtons {
                width: 100%;
            }

            #periodButtons .day-btn {
                flex: 1;
                padding: 11px 8px;
                white-space: nowrap;
            }

            .spacer {
                display: none;
            }

            .supervisor-chip {
                width: 100%;
                justify-content: space-between;
            }

            .classroom-section {
                padding: 20px 16px 22px;
            }

            .room-title {
                font-size: 1.22rem;
            }

            .seat-grid {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
                gap: 9px;
            }

            .student-name {
                font-size: 0.98rem;
            }
        }
    </style>
</head>

<body>
    <div id="loginOverlay" class="login-overlay">
        <div class="login-box">
            <div class="login-badge">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    aria-hidden="true">
                    <circle cx="12" cy="12" r="4.4" fill="currentColor" stroke="none" />
                    <path
                        d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M19.4 4.6l-1.8 1.8M6.4 17.6l-1.8 1.8" />
                </svg>
            </div>
            <div class="login-eyebrow">여름방학 · 자기주도학습</div>
            <h2>출결 시작하기</h2>
            <p class="login-desc">출석부에 기록될 감독 선생님 성함을 입력해 주세요.</p>
            <input type="text" id="teacherNameInput" placeholder="이름 입력 (예: 홍길동)"
                onkeypress="if(event.key==='Enter') handleLogin()">
            <button class="btn btn-primary" onclick="handleLogin()">시작하기</button>
        </div>
    </div>

    <div id="memoModal" class="modal-overlay" onclick="if(event.target===this) closeMemoModal()">
        <div class="modal-content">
            <h3>비고 입력 — <span id="memoStudentName"></span></h3>
            <textarea id="memoTextarea" placeholder="결석 사유 등을 입력하세요 (예: 병결, 체험학습)"></textarea>
            <div class="modal-btns">
                <button class="btn-cancel" onclick="closeMemoModal()">취소</button>
                <button class="btn-save" onclick="saveMemo()">저장</button>
            </div>
        </div>
    </div>

    <div id="mainApp" style="display: none;">
        <header>
            <div class="hero">
                <svg class="hero-sun" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="3.5"
                    stroke-linecap="round" aria-hidden="true">
                    <circle cx="50" cy="50" r="20" fill="currentColor" stroke="none" opacity="0.95" />
                    <g opacity="0.85">
                        <path d="M50 12V2M50 98V88M12 50H2M98 50H88M23 23l-7-7M84 84l-7-7M77 23l7-7M16 84l7-7" />
                    </g>
                </svg>
                <div class="eyebrow">여름방학 · 자기주도학습</div>
                <h1><span class="accent">자기주도학습</span> 출결</h1>
                <p class="hero-sub">학생 선택하는 것이 '출석'입니다!! 체크하신 후, 전송 버튼 눌러주세요!</p>
            </div>
            <div class="controls-bar">
                <div class="controls-row">
                    <input type="date" id="dateInput">
                    <div id="periodButtons">
                        <button class="day-btn active" data-period="1" onclick="selectPeriod(this)">1교시</button>
                        <button class="day-btn" data-period="2" onclick="selectPeriod(this)">2교시</button>
                        <button class="day-btn" data-period="3" onclick="selectPeriod(this)">3교시</button>
                    </div>
                    <div class="spacer"></div>
                    <div class="supervisor-chip">
                        <span id="displaySupervisorName"></span> 선생님
                        <button class="logout-btn" onclick="handleLogout()">로그아웃</button>
                    </div>
                </div>
                <div class="info-text">
                    <span class="hint">클릭 = 출석 · 길게 누르거나 우클릭 = 비고</span>
                    <button class="btn ghost-btn" onclick="refreshStudentList()">명단 갱신</button>
                </div>
            </div>
            <input type="hidden" id="gasUrl"
                value="https://script.google.com/macros/s/AKfycby4opXfNbOGVjC0rnBPg2XoiJiDllGbnrabI-DZ7kqc7qi0IqxNI2mB-lqlIo6APWTM/exec">
        </header>

        <div class="seating-container" id="seatingDisplay"></div>
        <div id="toast">전송되었습니다.</div>
    </div>

    <div id="loadingOverlay">
        <div class="loader"></div>
        <div id="loadingText">불러오는 중...</div>
    </div>

    <script>
        let supervisorName = sessionStorage.getItem('summerSupervisor') || '';
        let allowedTeachers = [];
        let globalData = [];
        let currentPeriod = '1';
        // attendance[room][studentId] = { status: bool, remark: string }
        let attendance = { '2-3': {}, '2-4': {} };
        let memoTargetId = null;

        const ROOMS = ['2-3', '2-4'];
        const DAY_MAP = ['일', '월', '화', '수', '목', '금', '토'];

        function showLoading(text) {
            document.getElementById('loadingText').innerText = text || '불러오는 중...';
            document.getElementById('loadingOverlay').style.display = 'flex';
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').style.display = 'none';
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        function escapeHtml(str) {
            return String(str == null ? '' : str)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function getTodayDateString() {
            const d = new Date();
            const pad = n => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
        }

        function loadTeacherListFromCache() {
            const cached = localStorage.getItem('summerTeacherList');
            if (!cached) return false;
            try {
                allowedTeachers = JSON.parse(cached);
                return Array.isArray(allowedTeachers) && allowedTeachers.length > 0;
            } catch (e) {
                localStorage.removeItem('summerTeacherList');
                return false;
            }
        }

        function loadStudentListFromCache() {
            const cached = localStorage.getItem('summerStudentList');
            if (!cached) return false;
            try {
                globalData = JSON.parse(cached);
                return Array.isArray(globalData) && globalData.length > 0;
            } catch (e) {
                localStorage.removeItem('summerStudentList');
                return false;
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            document.getElementById('dateInput').value = getTodayDateString();
            document.getElementById('dateInput').addEventListener('change', onDateOrPeriodChange);

            const hasTeachers = loadTeacherListFromCache();
            const hasStudents = loadStudentListFromCache();

            if (supervisorName && hasStudents) {
                // 캐시가 있으면 네트워크 응답을 기다리지 않고 즉시 화면을 띄움
                await startAppSession(supervisorName, { skipFetch: true });
            } else if (supervisorName) {
                showLoading('학생 명단을 불러오는 중...');
                await fetchTeacherList(true);
                await fetchSummerStudents(true);
                await startAppSession(supervisorName, { skipFetch: true });
            }

            // 캐시로 먼저 띄운 경우에도 최신 데이터로 백그라운드 갱신
            if (supervisorName) {
                revalidateDataInBackground();
            }
        });

        async function revalidateDataInBackground() {
            try {
                const [teacherResult, studentResult] = await Promise.all([
                    fetchTeacherList(true),
                    fetchSummerStudents(true)
                ]);
                if (studentResult.changed && document.getElementById('mainApp').style.display === 'block') {
                    onDateOrPeriodChange();
                }
            } catch (e) {
                console.error('백그라운드 동기화 실패', e);
            }
        }

        async function startAppSession(name, opts) {
            supervisorName = name;
            sessionStorage.setItem('summerSupervisor', supervisorName);
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            document.getElementById('displaySupervisorName').innerText = supervisorName;
            hideLoading();
            await onDateOrPeriodChange();
        }

        async function handleLogin() {
            const nameInput = document.getElementById('teacherNameInput').value.trim();
            if (!nameInput) {
                alert('감독 교사 성함을 입력해주세요.');
                return;
            }

            // 교사 명단 / 학생 명단을 동시에(병렬로) 요청해서 GAS 콜드스타트 대기 시간을 한 번만 겪도록 함
            const needTeachers = allowedTeachers.length === 0;
            const needStudents = globalData.length === 0;
            if (needTeachers || needStudents) {
                showLoading('명단을 불러오는 중...');
                const [teacherResult, studentResult] = await Promise.all([
                    needTeachers ? fetchTeacherList(true) : Promise.resolve({ success: true }),
                    needStudents ? fetchSummerStudents(true) : Promise.resolve({ success: true })
                ]);
                hideLoading();

                if (!teacherResult.success) {
                    alert('인터넷 연결이 원활하지 않거나 구글 시트 주소가 올바르지 않아 교사 명단을 불러올 수 없습니다.');
                    return;
                }
                if (!studentResult.success) {
                    alert('구글 시트에서 자기주도학습 명단을 가져오는 데 실패했습니다.');
                    return;
                }
            }

            if (!allowedTeachers.includes(nameInput)) {
                alert('등록되지 않은 선생님입니다. 입력하신 성함을 다시 한 번 확인해주세요.');
                return;
            }

            await startAppSession(nameInput);
        }

        function handleLogout() {
            if (!confirm('로그아웃 하시겠습니까?')) return;
            sessionStorage.removeItem('summerSupervisor');
            supervisorName = '';
            document.getElementById('teacherNameInput').value = '';
            document.getElementById('loginOverlay').style.display = 'flex';
            document.getElementById('mainApp').style.display = 'none';
        }

        // force가 false면 캐시가 있으면 캐시만 쓰고 네트워크 요청을 하지 않음 (즉시 로딩용)
        // 반환값: { success: 데이터를 확보했는지, changed: 이전 값과 달라졌는지 }
        async function fetchTeacherList(force = false) {
            if (!force && loadTeacherListFromCache()) return { success: true, changed: false };
            const gasUrl = document.getElementById('gasUrl').value.trim();
            try {
                const res = await fetch(`${gasUrl}?action=getTeachers`);
                const names = await res.json();
                if (Array.isArray(names)) {
                    const changed = JSON.stringify(names) !== JSON.stringify(allowedTeachers);
                    allowedTeachers = names;
                    localStorage.setItem('summerTeacherList', JSON.stringify(allowedTeachers));
                    return { success: true, changed };
                }
            } catch (e) {
                console.error('교사 명단 로드 실패', e);
            }
            return { success: allowedTeachers.length > 0, changed: false };
        }

        async function fetchSummerStudents(force = false) {
            if (!force && loadStudentListFromCache()) return { success: true, changed: false };
            const gasUrl = document.getElementById('gasUrl').value.trim();
            try {
                const res = await fetch(`${gasUrl}?action=getSummerStudents`);
                const data = await res.json();
                if (Array.isArray(data)) {
                    const mapped = data.map(s => {
                        const obj = {};
                        for (const key in s) {
                            obj[String(key).trim()] = (s[key] === null || s[key] === undefined) ? '' : String(s[key]).trim();
                        }
                        return obj;
                    }).filter(s => s['학번']);
                    const changed = JSON.stringify(mapped) !== JSON.stringify(globalData);
                    globalData = mapped;
                    localStorage.setItem('summerStudentList', JSON.stringify(globalData));
                    return { success: true, changed };
                }
            } catch (e) {
                console.error('자기주도학습 명단 로드 실패', e);
            }
            return { success: globalData.length > 0, changed: false };
        }

        async function refreshStudentList() {
            showLoading('최신 데이터를 불러오고 있습니다...');
            const { success } = await fetchSummerStudents(true);
            hideLoading();
            if (!success) {
                alert('명단 갱신에 실패했습니다. 인터넷 연결을 확인해주세요.');
                return;
            }
            showToast('명단이 갱신되었습니다.');
            await onDateOrPeriodChange();
        }

        function selectPeriod(btn) {
            document.querySelectorAll('#periodButtons .day-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentPeriod = btn.dataset.period;
            onDateOrPeriodChange();
        }

        function getSelectedDayInfo() {
            const dateVal = document.getElementById('dateInput').value;
            const d = new Date(dateVal + 'T00:00:00');
            const day = DAY_MAP[d.getDay()];
            return { dateVal, day, isWeekend: (day === '일' || day === '토') };
        }

        function getRoomLists(day) {
            const lists = { '2-3': [], '2-4': [] };
            const periodKey = `${day}${currentPeriod}`; // 예: "월1" = 월요일 1교시 신청 여부
            globalData.forEach(s => {
                // 해당 교시 신청 컬럼이 있으면, 신청한(값이 있는) 학생만 포함
                if (Object.prototype.hasOwnProperty.call(s, periodKey)) {
                    if (!(s[periodKey] || '').trim()) return;
                }
                const room = (s[`${day}_배정`] || '').trim();
                if (lists[room]) lists[room].push(s);
            });
            ROOMS.forEach(r => lists[r].sort((a, b) => Number(a['학번']) - Number(b['학번'])));
            return lists;
        }

        async function onDateOrPeriodChange() {
            const { day, isWeekend } = getSelectedDayInfo();
            const display = document.getElementById('seatingDisplay');

            if (isWeekend) {
                display.innerHTML = `<div class="classroom-section"><div class="empty-room-msg">주말(${day}요일)에는 여름방학 자기주도학습이 운영되지 않습니다.</div></div>`;
                return;
            }

            if (!globalData.length) {
                display.innerHTML = `<div class="classroom-section"><div class="empty-room-msg">여름방학 자기주도학습 명단을 불러오지 못했습니다. [명단 갱신]을 눌러주세요.</div></div>`;
                return;
            }

            // 출결 데이터가 도착하기 전에도 명단부터 먼저 그려서 "오래 걸린다"는 느낌을 줄임
            attendance = { '2-3': {}, '2-4': {} };
            renderSeating(day, true);

            await fetchAllAttendance(day);
            renderSeating(day, false);
        }

        // 2-3반/2-4반을 따로 조회하지 않고 한 번의 요청으로 합쳐서 가져와 GAS 콜드스타트 지연을 절반으로 줄임
        async function fetchAllAttendance(day) {
            const { dateVal } = getSelectedDayInfo();
            const gasUrl = document.getElementById('gasUrl').value.trim();
            const roomLists = getRoomLists(day);
            const idToRoom = {};
            ROOMS.forEach(r => roomLists[r].forEach(s => { idToRoom[s['학번']] = r; }));

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 12000);
                const url = `${gasUrl}?sheetTarget=summer&date=${encodeURIComponent(dateVal)}&day=${encodeURIComponent(day)}&period=${currentPeriod}교시`;
                const res = await fetch(url, { signal: controller.signal });
                clearTimeout(timeoutId);
                const data = await res.json();

                attendance = { '2-3': {}, '2-4': {} };
                Object.keys(data || {}).forEach(id => {
                    const room = idToRoom[id];
                    if (room) attendance[room][id] = data[id];
                });
            } catch (e) {
                console.error('출결 정보 로드 실패', e);
                if (e.name === 'AbortError') {
                    showToast('서버 응답이 지연되고 있습니다. 잠시 후 다시 시도해주세요.');
                }
            }
        }

        function renderSeating(day, isSyncing) {
            const display = document.getElementById('seatingDisplay');
            display.innerHTML = '';
            const roomLists = getRoomLists(day);

            ROOMS.forEach(room => {
                const students = roomLists[room];
                const section = document.createElement('div');
                section.className = 'classroom-section';
                section.setAttribute('data-room', room);
                const colorClass = 'color-' + room;
                const syncBadge = isSyncing ? ` · 동기화 중` : '';

                section.innerHTML = `
                    <div class="classroom-header">
                        <span class="room-title ${colorClass}">${room}반</span>
                        <div class="header-right-btns">
                            <span class="room-meta">${day}요일 ${currentPeriod}교시 · ${students.length}명${syncBadge}</span>
                            <button class="btn btn-primary" onclick="submitRoom('${room}')" ${isSyncing ? 'disabled' : ''}>출결 전송</button>
                        </div>
                    </div>
                    <div class="seat-grid"></div>
                `;

                const grid = section.querySelector('.seat-grid');
                if (students.length === 0) {
                    grid.innerHTML = `<div class="empty-room-msg" style="grid-column: 1/-1;">${day}요일 ${currentPeriod}교시에 ${room}반 신청 학생이 없습니다.</div>`;
                } else {
                    students.forEach(s => {
                        const id = s['학번'];
                        const saved = attendance[room][id];
                        const isPresent = saved ? saved.status : false;
                        const remark = saved ? (saved.remark || '') : '';

                        const seat = document.createElement('div');
                        seat.className = 'seat' + (isPresent ? ' present' : '') + (remark ? ' has-memo' : '');
                        seat.dataset.id = id;
                        seat.dataset.name = s['이름'];
                        seat.dataset.remark = remark;
                        seat.innerHTML = `<div class="student-id">${escapeHtml(id)}</div><div class="student-name">${escapeHtml(s['이름'])}</div>`
                            + (remark ? `<div class="seat-memo">${escapeHtml(remark)}</div>` : '');

                        setupSeatEvents(seat, room);
                        grid.appendChild(seat);
                    });
                }

                display.appendChild(section);
            });
        }

        function setupSeatEvents(seatEl, room) {
            let pressTimer = null;
            let isLong = false;

            const openMemo = () => {
                isLong = true;
                openMemoModal(seatEl.dataset.id, seatEl.dataset.name, room, seatEl.dataset.remark);
            };

            seatEl.addEventListener('mousedown', (e) => {
                if (e.button !== 0) return;
                isLong = false;
                pressTimer = setTimeout(openMemo, 550);
            });
            seatEl.addEventListener('mouseup', () => {
                clearTimeout(pressTimer);
                if (!isLong) togglePresent(seatEl, room);
            });
            seatEl.addEventListener('mouseleave', () => clearTimeout(pressTimer));
            seatEl.addEventListener('touchstart', (e) => {
                isLong = false;
                pressTimer = setTimeout(openMemo, 550);
            }, { passive: true });
            seatEl.addEventListener('touchend', () => {
                clearTimeout(pressTimer);
                if (!isLong) togglePresent(seatEl, room);
            });
            seatEl.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                openMemoModal(seatEl.dataset.id, seatEl.dataset.name, room, seatEl.dataset.remark);
            });
        }

        function togglePresent(seatEl, room) {
            const id = seatEl.dataset.id;
            const nowPresent = seatEl.classList.contains('present');
            seatEl.classList.toggle('present', !nowPresent);
            if (!attendance[room][id]) attendance[room][id] = { status: false, remark: '' };
            attendance[room][id].status = !nowPresent;
        }

        function openMemoModal(studentId, studentName, room, remark) {
            memoTargetId = { studentId, room };
            document.getElementById('memoStudentName').innerText = `${studentName} (${studentId})`;
            document.getElementById('memoTextarea').value = remark || '';
            document.getElementById('memoModal').style.display = 'flex';
        }

        function closeMemoModal() {
            document.getElementById('memoModal').style.display = 'none';
            memoTargetId = null;
        }

        function saveMemo() {
            if (!memoTargetId) return;
            const { studentId, room } = memoTargetId;
            const remark = document.getElementById('memoTextarea').value.trim();
            if (!attendance[room][studentId]) attendance[room][studentId] = { status: false, remark: '' };
            attendance[room][studentId].remark = remark;

            const seatEl = document.querySelector(`.classroom-section[data-room="${room}"] .seat[data-id="${studentId}"]`);
            if (seatEl) {
                seatEl.dataset.remark = remark;
                seatEl.classList.toggle('has-memo', !!remark);
                let memoEl = seatEl.querySelector('.seat-memo');
                if (remark) {
                    if (!memoEl) {
                        memoEl = document.createElement('div');
                        memoEl.className = 'seat-memo';
                        seatEl.appendChild(memoEl);
                    }
                    memoEl.textContent = remark;
                } else if (memoEl) {
                    memoEl.remove();
                }
            }
            closeMemoModal();
        }

        async function submitRoom(room) {
            const { dateVal, day } = getSelectedDayInfo();
            const roomLists = getRoomLists(day);
            const students = roomLists[room];
            if (!students.length) {
                alert(`${room}반에 출석체크할 학생이 없습니다.`);
                return;
            }

            const studentsData = students.map(s => {
                const id = s['학번'];
                const saved = attendance[room][id] || { status: false, remark: '' };
                return { id, name: s['이름'], status: !!saved.status, remark: saved.remark || '', supervisor: supervisorName };
            });

            const payload = {
                sheetTarget: 'summer',
                type: 'batch',
                date: dateVal,
                day: day,
                period: `${currentPeriod}교시`,
                room: room,
                supervisor: supervisorName,
                students: studentsData
            };

            const gasUrl = document.getElementById('gasUrl').value.trim();
            const btn = document.querySelector(`.classroom-section[data-room="${room}"] .btn-primary`);
            if (btn) { btn.disabled = true; btn.innerText = '전송 중...'; }

            try {
                await fetch(gasUrl, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify(payload)
                });
                showToast(`${room}반 출결이 전송되었습니다.`);
            } catch (e) {
                console.error(e);
                alert(`${room}반 전송에 실패했습니다. 인터넷 연결을 확인해주세요.`);
            } finally {
                if (btn) { btn.disabled = false; btn.innerText = '출결 전송'; }
            }
        }
    </script>
</body>

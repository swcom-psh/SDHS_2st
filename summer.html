<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>하계 야자 출석체크</title>

    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        :root {
            /* Claude 브랜드 톤 — 따뜻한 종이 배경 + 클레이(코랄) 액센트 */
            --bg: #F7F4EC;
            --surface: #FFFFFF;
            --surface-soft: #FBF8F1;
            --ink: #2B2A26;
            --ink-soft: #6B6457;
            --ink-faint: #9A9384;
            --line: #E7E1D3;
            --line-strong: #D9D1BD;

            --accent: #C2632F;
            --accent-strong: #A8501F;
            --accent-soft: #F3E3D6;
            --accent-tint: #FBF0E7;

            --present: #3D6B52;
            --present-soft: #E3EEE6;

            --room-a: #C2632F;
            --room-b: #3E5C76;

            --shadow-sm: 0 1px 2px rgba(43, 42, 38, 0.06);
            --shadow-md: 0 8px 24px rgba(43, 42, 38, 0.08);
            --shadow-lg: 0 24px 60px rgba(43, 42, 38, 0.18);

            --radius-lg: 20px;
            --radius-md: 14px;
            --radius-sm: 10px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Helvetica Neue", "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
            background: var(--bg);
            background-image:
                radial-gradient(circle at 12% 8%, rgba(194, 99, 47, 0.06), transparent 38%),
                radial-gradient(circle at 88% 92%, rgba(62, 92, 118, 0.05), transparent 42%);
            color: var(--ink);
            line-height: 1.6;
            padding: 36px 20px 80px;
            letter-spacing: -0.01em;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        header {
            max-width: 980px;
            margin: 0 auto 32px;
            padding: 32px 36px;
            background: var(--surface);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--line);
        }

        h1 {
            font-size: 1.55rem;
            font-weight: 800;
            color: var(--ink);
            margin-bottom: 22px;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.03em;
        }

        h1::before {
            content: '';
            display: inline-block;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--accent);
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        #periodButtons {
            background: var(--surface-soft);
            padding: 4px;
            border-radius: var(--radius-sm);
            display: flex;
            gap: 2px;
            border: 1px solid var(--line);
        }

        #periodButtons .day-btn {
            background: transparent;
            color: var(--ink-soft);
            border: none;
            box-shadow: none;
            padding: 9px 18px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.92rem;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        #periodButtons .day-btn:hover {
            color: var(--ink);
        }

        #periodButtons .day-btn.active {
            background: var(--ink);
            color: white;
            font-weight: 700;
        }

        .btn {
            padding: 10px 18px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            border: 1px solid var(--line-strong);
            background: var(--surface);
            color: var(--ink-soft);
            font-size: 0.88rem;
        }

        .btn:hover {
            background: var(--surface-soft);
            color: var(--ink);
            border-color: var(--ink-faint);
        }

        .btn-primary {
            background: var(--accent);
            color: white;
            border: none;
        }

        .btn-primary:hover {
            background: var(--accent-strong);
            color: white;
        }

        .btn-primary:disabled {
            background: var(--ink-faint);
            cursor: not-allowed;
        }

        #dateInput {
            padding: 9px 16px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--line-strong);
            font-size: 0.95rem;
            font-family: inherit;
            background: var(--surface);
            color: var(--ink);
        }

        .info-text {
            font-size: 0.84rem;
            color: var(--ink-soft);
            background: var(--accent-tint);
            padding: 10px 16px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--accent-soft);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            width: 100%;
        }

        .seating-container {
            max-width: 980px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .classroom-section {
            background: var(--surface);
            padding: 28px 32px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--line);
            border-top: 3px solid var(--line);
        }

        .classroom-section[data-room="2-3"] {
            border-top-color: var(--room-a);
        }

        .classroom-section[data-room="2-4"] {
            border-top-color: var(--room-b);
        }

        .room-title.color-2-3 {
            color: var(--room-a);
        }

        .room-title.color-2-4 {
            color: var(--room-b);
        }

        .classroom-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            gap: 12px;
            flex-wrap: wrap;
        }

        .room-title {
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .room-meta {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--ink-soft);
            background: var(--surface-soft);
            border: 1px solid var(--line);
            padding: 5px 14px;
            border-radius: 100px;
            white-space: nowrap;
        }

        .header-right-btns {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .seat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(126px, 1fr));
            gap: 10px;
            margin-bottom: 4px;
        }

        .seat {
            border: 1px solid var(--line);
            border-radius: var(--radius-md);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: var(--surface-soft);
            padding: 16px 8px;
            position: relative;
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
        }

        .seat:hover {
            border-color: var(--ink-faint);
            background: var(--surface);
        }

        .seat.present {
            border: 1.5px solid var(--present);
            background: var(--present-soft);
            color: var(--present);
        }

        .seat.present .student-id {
            color: var(--present);
            opacity: 0.7;
        }

        .seat.has-memo::after {
            content: '';
            position: absolute;
            top: 9px;
            right: 9px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
        }

        .student-id {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--ink-faint);
            margin-bottom: 4px;
            letter-spacing: 0;
        }

        .student-name {
            font-weight: 700;
            font-size: 1.02rem;
            letter-spacing: -0.02em;
        }

        .seat-memo {
            margin-top: 7px;
            font-size: 0.72rem;
            font-weight: 600;
            line-height: 1.35;
            color: var(--accent-strong);
            background: var(--accent-tint);
            border: 1px solid var(--accent-soft);
            border-radius: 6px;
            padding: 3px 7px;
            max-width: 100%;
            word-break: break-word;
            white-space: normal;
            text-align: center;
        }

        .empty-room-msg {
            text-align: center;
            color: var(--ink-faint);
            padding: 28px 0;
            font-size: 0.9rem;
        }

        /* Login Overlay */
        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(43, 42, 38, 0.35);
            backdrop-filter: blur(3px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
        }

        .login-box {
            background: var(--surface);
            padding: 36px 32px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 380px;
            border: 1px solid var(--line);
            text-align: left;
        }

        .login-box .login-badge {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: var(--accent-tint);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            margin-bottom: 16px;
        }

        .login-box h2 {
            margin-bottom: 8px;
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .login-box input {
            width: 100%;
            padding: 13px 14px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--line-strong);
            background: var(--surface-soft);
            font-size: 1rem;
            outline: none;
            margin-top: 16px;
            font-family: inherit;
            color: var(--ink);
            transition: border-color 0.15s ease;
        }

        .login-box input:focus {
            border-color: var(--accent);
            background: var(--surface);
        }

        .login-box button {
            width: 100%;
            margin-top: 12px;
            padding: 13px;
            font-size: 0.98rem;
            font-weight: 700;
            border-radius: var(--radius-sm);
        }

        /* Memo modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(43, 42, 38, 0.4);
            backdrop-filter: blur(3px);
            z-index: 20000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: var(--surface);
            border: 1px solid var(--line);
            padding: 24px 22px;
            border-radius: var(--radius-lg);
            max-width: 360px;
            width: 100%;
            box-shadow: var(--shadow-lg);
            text-align: left;
        }

        .modal-content h3 {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 14px;
            color: var(--ink-soft);
        }

        .modal-content h3 span {
            color: var(--ink);
            font-weight: 800;
        }

        .modal-content textarea {
            width: 100%;
            min-height: 90px;
            padding: 12px 14px;
            border: 1px solid var(--line-strong);
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            font-family: inherit;
            resize: vertical;
            outline: none;
            background: var(--surface-soft);
            margin-bottom: 14px;
            color: var(--ink);
        }

        .modal-content textarea:focus {
            border-color: var(--accent);
            background: var(--surface);
        }

        .modal-btns {
            display: flex;
            gap: 8px;
        }

        .modal-btns button {
            flex: 1;
            padding: 11px;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 0.88rem;
            cursor: pointer;
            border: none;
        }

        .btn-cancel {
            background: var(--surface-soft);
            color: var(--ink-soft);
            border: 1px solid var(--line);
        }

        .btn-save {
            background: var(--accent);
            color: white;
        }

        .btn-save:hover {
            background: var(--accent-strong);
        }

        /* Toast */
        #toast {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--ink);
            color: white;
            padding: 13px 22px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.9rem;
            box-shadow: var(--shadow-lg);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10000;
            max-width: 90vw;
            text-align: center;
        }

        #toast.show {
            transform: translateX(-50%) translateY(0);
        }

        /* Loading */
        #loadingOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(247, 244, 236, 0.92);
            z-index: 10000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
        }

        .loader {
            width: 32px;
            height: 32px;
            border: 3px solid var(--accent-soft);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #loadingText {
            font-weight: 600;
            color: var(--ink-soft);
            font-size: 0.95rem;
        }

        @media (max-width: 768px) {
            body {
                padding: 16px 12px 70px;
            }

            header {
                padding: 22px 18px;
                border-radius: 16px;
            }

            h1 {
                font-size: 1.25rem;
            }

            .classroom-section {
                padding: 20px 16px;
            }

            .seat-grid {
                grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
                gap: 8px;
            }

            .classroom-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .info-text {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>
    <div id="loginOverlay" class="login-overlay">
        <div class="login-box">
            <div class="login-badge">☀️</div>
            <h2>하계 야자 출석체크</h2>
            <div style="color: var(--ink-soft); font-size: 0.88rem; margin-bottom: 4px; word-break: keep-all;">
                출석부에 기록될 감독 선생님 성함을 입력해주세요.
            </div>
            <input type="text" id="teacherNameInput" placeholder="이름 입력 (예: 홍길동)"
                onkeypress="if(event.key==='Enter') handleLogin()">
            <button class="btn btn-primary" onclick="handleLogin()">시작하기</button>
        </div>
    </div>

    <div id="memoModal" class="modal-overlay" onclick="if(event.target===this) closeMemoModal()">
        <div class="modal-content">
            <h3>비고 입력 — <span id="memoStudentName"></span></h3>
            <textarea id="memoTextarea" placeholder="결석 사유 등을 입력하세요 (예: 병결, 체험학습)"></textarea>
            <div class="modal-btns">
                <button class="btn-cancel" onclick="closeMemoModal()">취소</button>
                <button class="btn-save" onclick="saveMemo()">저장</button>
            </div>
        </div>
    </div>

    <div id="mainApp" style="display: none;">
        <header>
            <h1>하계 야자 출석체크</h1>
            <div class="controls">
                <div class="btn-group">
                    <input type="date" id="dateInput">
                    <div id="periodButtons">
                        <button class="day-btn active" data-period="1" onclick="selectPeriod(this)">1교시</button>
                        <button class="day-btn" data-period="2" onclick="selectPeriod(this)">2교시</button>
                        <button class="day-btn" data-period="3" onclick="selectPeriod(this)">3교시</button>
                    </div>
                </div>
                <input type="hidden" id="gasUrl"
                    value="https://script.google.com/macros/s/AKfycby4opXfNbOGVjC0rnBPg2XoiJiDllGbnrabI-DZ7kqc7qi0IqxNI2mB-lqlIo6APWTM/exec">
                <div class="info-text">
                    <div style="display: flex; gap: 8px; align-items: center;">
                        <span>클릭=출석 · 길게 누르거나 우클릭=비고</span>
                        <button class="btn" style="padding:4px 12px; font-size:0.78rem;"
                            onclick="refreshStudentList()">명단 갱신</button>
                    </div>
                    <div style="font-weight: 700; color: var(--ink); display: flex; align-items: center; gap: 10px;">
                        <span id="displaySupervisorName"></span> 선생님
                        <button onclick="handleLogout()"
                            style="background: var(--surface); border: 1px solid var(--line-strong); border-radius: 8px; padding: 4px 10px; font-size: 0.78rem; cursor: pointer; color: var(--ink-soft);">로그아웃</button>
                    </div>
                </div>
            </div>
        </header>

        <div class="seating-container" id="seatingDisplay"></div>
        <div id="toast">전송되었습니다.</div>
    </div>

    <div id="loadingOverlay">
        <div class="loader"></div>
        <div id="loadingText">불러오는 중...</div>
    </div>

    <script>
        let supervisorName = sessionStorage.getItem('summerSupervisor') || '';
        let allowedTeachers = [];
        let globalData = [];
        let currentPeriod = '1';
        // attendance[room][studentId] = { status: bool, remark: string }
        let attendance = { '2-3': {}, '2-4': {} };
        let memoTargetId = null;

        const ROOMS = ['2-3', '2-4'];
        const DAY_MAP = ['일', '월', '화', '수', '목', '금', '토'];

        function showLoading(text) {
            document.getElementById('loadingText').innerText = text || '불러오는 중...';
            document.getElementById('loadingOverlay').style.display = 'flex';
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').style.display = 'none';
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        function escapeHtml(str) {
            return String(str == null ? '' : str)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function getTodayDateString() {
            const d = new Date();
            const pad = n => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
        }

        function loadTeacherListFromCache() {
            const cached = localStorage.getItem('summerTeacherList');
            if (!cached) return false;
            try {
                allowedTeachers = JSON.parse(cached);
                return Array.isArray(allowedTeachers) && allowedTeachers.length > 0;
            } catch (e) {
                localStorage.removeItem('summerTeacherList');
                return false;
            }
        }

        function loadStudentListFromCache() {
            const cached = localStorage.getItem('summerStudentList');
            if (!cached) return false;
            try {
                globalData = JSON.parse(cached);
                return Array.isArray(globalData) && globalData.length > 0;
            } catch (e) {
                localStorage.removeItem('summerStudentList');
                return false;
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            document.getElementById('dateInput').value = getTodayDateString();
            document.getElementById('dateInput').addEventListener('change', onDateOrPeriodChange);

            const hasTeachers = loadTeacherListFromCache();
            const hasStudents = loadStudentListFromCache();

            if (supervisorName && hasStudents) {
                // 캐시가 있으면 네트워크 응답을 기다리지 않고 즉시 화면을 띄움 (index.html과 동일한 방식)
                await startAppSession(supervisorName, { skipFetch: true });
            } else if (supervisorName) {
                showLoading('학생 명단을 불러오는 중...');
                await fetchTeacherList(true);
                await fetchSummerStudents(true);
                await startAppSession(supervisorName, { skipFetch: true });
            }

            // 캐시로 먼저 띄운 경우에도 최신 데이터로 백그라운드 갱신
            if (supervisorName) {
                revalidateDataInBackground();
            }
        });

        async function revalidateDataInBackground() {
            try {
                const [teacherResult, studentResult] = await Promise.all([
                    fetchTeacherList(true),
                    fetchSummerStudents(true)
                ]);
                if (studentResult.changed && document.getElementById('mainApp').style.display === 'block') {
                    onDateOrPeriodChange();
                }
            } catch (e) {
                console.error('백그라운드 동기화 실패', e);
            }
        }

        async function startAppSession(name, opts) {
            supervisorName = name;
            sessionStorage.setItem('summerSupervisor', supervisorName);
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            document.getElementById('displaySupervisorName').innerText = supervisorName;
            hideLoading();
            await onDateOrPeriodChange();
        }

        async function handleLogin() {
            const nameInput = document.getElementById('teacherNameInput').value.trim();
            if (!nameInput) {
                alert('감독 교사 성함을 입력해주세요.');
                return;
            }

            // 교사 명단 / 학생 명단을 동시에(병렬로) 요청해서 GAS 콜드스타트 대기 시간을 한 번만 겪도록 함
            const needTeachers = allowedTeachers.length === 0;
            const needStudents = globalData.length === 0;
            if (needTeachers || needStudents) {
                showLoading('명단을 불러오는 중...');
                const [teacherResult, studentResult] = await Promise.all([
                    needTeachers ? fetchTeacherList(true) : Promise.resolve({ success: true }),
                    needStudents ? fetchSummerStudents(true) : Promise.resolve({ success: true })
                ]);
                hideLoading();

                if (!teacherResult.success) {
                    alert('인터넷 연결이 원활하지 않거나 구글 시트 주소가 올바르지 않아 교사 명단을 불러올 수 없습니다.');
                    return;
                }
                if (!studentResult.success) {
                    alert('구글 시트에서 하계 학생명단을 가져오는 데 실패했습니다.');
                    return;
                }
            }

            if (!allowedTeachers.includes(nameInput)) {
                alert('등록되지 않은 선생님입니다. 입력하신 성함을 다시 한 번 확인해주세요.');
                return;
            }

            await startAppSession(nameInput);
        }

        function handleLogout() {
            if (!confirm('로그아웃 하시겠습니까?')) return;
            sessionStorage.removeItem('summerSupervisor');
            supervisorName = '';
            document.getElementById('teacherNameInput').value = '';
            document.getElementById('loginOverlay').style.display = 'flex';
            document.getElementById('mainApp').style.display = 'none';
        }

        // force가 false면 캐시가 있으면 캐시만 쓰고 네트워크 요청을 하지 않음 (즉시 로딩용)
        // 반환값: { success: 데이터를 확보했는지, changed: 이전 값과 달라졌는지 }
        async function fetchTeacherList(force = false) {
            if (!force && loadTeacherListFromCache()) return { success: true, changed: false };
            const gasUrl = document.getElementById('gasUrl').value.trim();
            try {
                const res = await fetch(`${gasUrl}?action=getTeachers`);
                const names = await res.json();
                if (Array.isArray(names)) {
                    const changed = JSON.stringify(names) !== JSON.stringify(allowedTeachers);
                    allowedTeachers = names;
                    localStorage.setItem('summerTeacherList', JSON.stringify(allowedTeachers));
                    return { success: true, changed };
                }
            } catch (e) {
                console.error('교사 명단 로드 실패', e);
            }
            return { success: allowedTeachers.length > 0, changed: false };
        }

        async function fetchSummerStudents(force = false) {
            if (!force && loadStudentListFromCache()) return { success: true, changed: false };
            const gasUrl = document.getElementById('gasUrl').value.trim();
            try {
                const res = await fetch(`${gasUrl}?action=getSummerStudents`);
                const data = await res.json();
                if (Array.isArray(data)) {
                    const mapped = data.map(s => {
                        const obj = {};
                        for (const key in s) {
                            obj[String(key).trim()] = (s[key] === null || s[key] === undefined) ? '' : String(s[key]).trim();
                        }
                        return obj;
                    }).filter(s => s['학번']);
                    const changed = JSON.stringify(mapped) !== JSON.stringify(globalData);
                    globalData = mapped;
                    localStorage.setItem('summerStudentList', JSON.stringify(globalData));
                    return { success: true, changed };
                }
            } catch (e) {
                console.error('하계 학생명단 로드 실패', e);
            }
            return { success: globalData.length > 0, changed: false };
        }

        async function refreshStudentList() {
            showLoading('최신 데이터를 불러오고 있습니다...');
            const { success } = await fetchSummerStudents(true);
            hideLoading();
            if (!success) {
                alert('명단 갱신에 실패했습니다. 인터넷 연결을 확인해주세요.');
                return;
            }
            showToast('명단이 갱신되었습니다.');
            await onDateOrPeriodChange();
        }

        function selectPeriod(btn) {
            document.querySelectorAll('#periodButtons .day-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentPeriod = btn.dataset.period;
            onDateOrPeriodChange();
        }

        function getSelectedDayInfo() {
            const dateVal = document.getElementById('dateInput').value;
            const d = new Date(dateVal + 'T00:00:00');
            const day = DAY_MAP[d.getDay()];
            return { dateVal, day, isWeekend: (day === '일' || day === '토') };
        }

        function getRoomLists(day) {
            const lists = { '2-3': [], '2-4': [] };
            const periodKey = `${day}${currentPeriod}`; // 예: "월1" = 월요일 1교시 신청 여부
            globalData.forEach(s => {
                // 해당 교시 신청 컬럼이 있으면, 신청한(값이 있는) 학생만 포함
                if (Object.prototype.hasOwnProperty.call(s, periodKey)) {
                    if (!(s[periodKey] || '').trim()) return;
                }
                const room = (s[`${day}_배정`] || '').trim();
                if (lists[room]) lists[room].push(s);
            });
            ROOMS.forEach(r => lists[r].sort((a, b) => Number(a['학번']) - Number(b['학번'])));
            return lists;
        }

        async function onDateOrPeriodChange() {
            const { day, isWeekend } = getSelectedDayInfo();
            const display = document.getElementById('seatingDisplay');

            if (isWeekend) {
                display.innerHTML = `<div class="classroom-section"><div class="empty-room-msg">주말(${day}요일)에는 하계 야자가 운영되지 않습니다.</div></div>`;
                return;
            }

            if (!globalData.length) {
                display.innerHTML = `<div class="classroom-section"><div class="empty-room-msg">하계 학생명단을 불러오지 못했습니다. [명단 갱신]을 눌러주세요.</div></div>`;
                return;
            }

            // 출결 데이터가 도착하기 전에도 명단부터 먼저 그려서 "오래 걸린다"는 느낌을 줄임
            attendance = { '2-3': {}, '2-4': {} };
            renderSeating(day, true);

            await fetchAllAttendance(day);
            renderSeating(day, false);
        }

        // 2-3반/2-4반을 따로 조회하지 않고 한 번의 요청으로 합쳐서 가져와 GAS 콜드스타트 지연을 절반으로 줄임
        async function fetchAllAttendance(day) {
            const { dateVal } = getSelectedDayInfo();
            const gasUrl = document.getElementById('gasUrl').value.trim();
            const roomLists = getRoomLists(day);
            const idToRoom = {};
            ROOMS.forEach(r => roomLists[r].forEach(s => { idToRoom[s['학번']] = r; }));

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 12000);
                const url = `${gasUrl}?sheetTarget=summer&date=${encodeURIComponent(dateVal)}&day=${encodeURIComponent(day)}&period=${currentPeriod}교시`;
                const res = await fetch(url, { signal: controller.signal });
                clearTimeout(timeoutId);
                const data = await res.json();

                attendance = { '2-3': {}, '2-4': {} };
                Object.keys(data || {}).forEach(id => {
                    const room = idToRoom[id];
                    if (room) attendance[room][id] = data[id];
                });
            } catch (e) {
                console.error('출결 정보 로드 실패', e);
                if (e.name === 'AbortError') {
                    showToast('서버 응답이 지연되고 있습니다. 잠시 후 다시 시도해주세요.');
                }
            }
        }

        function renderSeating(day, isSyncing) {
            const display = document.getElementById('seatingDisplay');
            display.innerHTML = '';
            const roomLists = getRoomLists(day);

            ROOMS.forEach(room => {
                const students = roomLists[room];
                const section = document.createElement('div');
                section.className = 'classroom-section';
                section.setAttribute('data-room', room);
                const colorClass = 'color-' + room;
                const syncBadge = isSyncing ? ` · 동기화 중` : '';

                section.innerHTML = `
                    <div class="classroom-header">
                        <span class="room-title ${colorClass}">${room}반</span>
                        <div class="header-right-btns">
                            <span class="room-meta">${day}요일 ${currentPeriod}교시 · ${students.length}명${syncBadge}</span>
                            <button class="btn btn-primary" onclick="submitRoom('${room}')" ${isSyncing ? 'disabled' : ''}>출결 전송</button>
                        </div>
                    </div>
                    <div class="seat-grid"></div>
                `;

                const grid = section.querySelector('.seat-grid');
                if (students.length === 0) {
                    grid.innerHTML = `<div class="empty-room-msg" style="grid-column: 1/-1;">${day}요일 ${currentPeriod}교시에 ${room}반 신청 학생이 없습니다.</div>`;
                } else {
                    students.forEach(s => {
                        const id = s['학번'];
                        const saved = attendance[room][id];
                        const isPresent = saved ? saved.status : false;
                        const remark = saved ? (saved.remark || '') : '';

                        const seat = document.createElement('div');
                        seat.className = 'seat' + (isPresent ? ' present' : '') + (remark ? ' has-memo' : '');
                        seat.dataset.id = id;
                        seat.dataset.name = s['이름'];
                        seat.dataset.remark = remark;
                        seat.innerHTML = `<div class="student-id">${escapeHtml(id)}</div><div class="student-name">${escapeHtml(s['이름'])}</div>`
                            + (remark ? `<div class="seat-memo">${escapeHtml(remark)}</div>` : '');

                        setupSeatEvents(seat, room);
                        grid.appendChild(seat);
                    });
                }

                display.appendChild(section);
            });
        }

        function setupSeatEvents(seatEl, room) {
            let pressTimer = null;
            let isLong = false;

            const openMemo = () => {
                isLong = true;
                openMemoModal(seatEl.dataset.id, seatEl.dataset.name, room, seatEl.dataset.remark);
            };

            seatEl.addEventListener('mousedown', (e) => {
                if (e.button !== 0) return;
                isLong = false;
                pressTimer = setTimeout(openMemo, 550);
            });
            seatEl.addEventListener('mouseup', () => {
                clearTimeout(pressTimer);
                if (!isLong) togglePresent(seatEl, room);
            });
            seatEl.addEventListener('mouseleave', () => clearTimeout(pressTimer));
            seatEl.addEventListener('touchstart', (e) => {
                isLong = false;
                pressTimer = setTimeout(openMemo, 550);
            }, { passive: true });
            seatEl.addEventListener('touchend', () => {
                clearTimeout(pressTimer);
                if (!isLong) togglePresent(seatEl, room);
            });
            seatEl.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                openMemoModal(seatEl.dataset.id, seatEl.dataset.name, room, seatEl.dataset.remark);
            });
        }

        function togglePresent(seatEl, room) {
            const id = seatEl.dataset.id;
            const nowPresent = seatEl.classList.contains('present');
            seatEl.classList.toggle('present', !nowPresent);
            if (!attendance[room][id]) attendance[room][id] = { status: false, remark: '' };
            attendance[room][id].status = !nowPresent;
        }

        function openMemoModal(studentId, studentName, room, remark) {
            memoTargetId = { studentId, room };
            document.getElementById('memoStudentName').innerText = `${studentName} (${studentId})`;
            document.getElementById('memoTextarea').value = remark || '';
            document.getElementById('memoModal').style.display = 'flex';
        }

        function closeMemoModal() {
            document.getElementById('memoModal').style.display = 'none';
            memoTargetId = null;
        }

        function saveMemo() {
            if (!memoTargetId) return;
            const { studentId, room } = memoTargetId;
            const remark = document.getElementById('memoTextarea').value.trim();
            if (!attendance[room][studentId]) attendance[room][studentId] = { status: false, remark: '' };
            attendance[room][studentId].remark = remark;

            const seatEl = document.querySelector(`.classroom-section[data-room="${room}"] .seat[data-id="${studentId}"]`);
            if (seatEl) {
                seatEl.dataset.remark = remark;
                seatEl.classList.toggle('has-memo', !!remark);
                let memoEl = seatEl.querySelector('.seat-memo');
                if (remark) {
                    if (!memoEl) {
                        memoEl = document.createElement('div');
                        memoEl.className = 'seat-memo';
                        seatEl.appendChild(memoEl);
                    }
                    memoEl.textContent = remark;
                } else if (memoEl) {
                    memoEl.remove();
                }
            }
            closeMemoModal();
        }

        async function submitRoom(room) {
            const { dateVal, day } = getSelectedDayInfo();
            const roomLists = getRoomLists(day);
            const students = roomLists[room];
            if (!students.length) {
                alert(`${room}반에 출석체크할 학생이 없습니다.`);
                return;
            }

            const studentsData = students.map(s => {
                const id = s['학번'];
                const saved = attendance[room][id] || { status: false, remark: '' };
                return { id, name: s['이름'], status: !!saved.status, remark: saved.remark || '', supervisor: supervisorName };
            });

            const payload = {
                sheetTarget: 'summer',
                type: 'batch',
                date: dateVal,
                day: day,
                period: `${currentPeriod}교시`,
                room: room,
                supervisor: supervisorName,
                students: studentsData
            };

            const gasUrl = document.getElementById('gasUrl').value.trim();
            const btn = document.querySelector(`.classroom-section[data-room="${room}"] .btn-primary`);
            if (btn) { btn.disabled = true; btn.innerText = '전송 중...'; }

            try {
                await fetch(gasUrl, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify(payload)
                });
                showToast(`${room}반 출결이 전송되었습니다.`);
            } catch (e) {
                console.error(e);
                alert(`${room}반 전송에 실패했습니다. 인터넷 연결을 확인해주세요.`);
            } finally {
                if (btn) { btn.disabled = false; btn.innerText = '출결 전송'; }
            }
        }
    </script>
</body>
